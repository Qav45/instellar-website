<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visitors</title>
<meta name="robots" content="noindex">
<script>
  // Only the Vercel copy has the /api/* functions; the Pages copy would 404.
  if (location.hostname === "instellar.net" || location.hostname === "www.instellar.net") {
    location.replace("https://go.instellar.net" + location.pathname + location.search + location.hash);
  }
</script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { background:#0b0d12; color:#e7e9ee; font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; padding:34px 20px; }
  .wrap { max-width:960px; margin:0 auto; }
  h1 { font-size:20px; font-weight:600; letter-spacing:-.01em; }
  .sub { color:#8a90a0; margin:6px 0 22px; }
  .bar { display:flex; gap:10px; align-items:center; margin-bottom:16px; flex-wrap:wrap; }
  input, button { font:inherit; }
  input[type=password] { background:#151922; border:1px solid #232838; color:#e7e9ee; border-radius:8px; padding:8px 11px; outline:none; min-width:220px; }
  input:focus { border-color:#6ea8fe; }
  button { background:#6ea8fe; color:#0b0d12; border:0; border-radius:8px; padding:7px 13px; font-weight:600; cursor:pointer; }
  button:hover { filter:brightness(1.08); }
  button.ghost { background:transparent; color:#8a90a0; border:1px solid #232838; font-weight:400; padding:5px 10px; }
  button.ghost:hover { color:#e7e9ee; border-color:#3a4055; filter:none; }
  button.danger { color:#ffb3bd; border-color:#4a2028; }
  .count { color:#8a90a0; font-size:13px; }
  .msg { padding:10px 13px; border-radius:8px; margin-bottom:16px; }
  .msg.err { background:#2a1418; border:1px solid #4a2028; color:#ffb3bd; }
  .msg.ok  { background:#0f2018; border:1px solid #1d4030; color:#8fe3b4; }
  .card { background:#12161e; border:1px solid #202838; border-radius:12px; padding:15px 17px; margin-bottom:12px; }
  .card.blocked { opacity:.6; border-color:#4a2028; }
  .head { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .dev { font-weight:600; }
  .pill { font-size:12px; padding:2px 8px; border-radius:999px; background:#1a2130; color:#9fb0d0; }
  .pill.red { background:#2a1418; color:#ffb3bd; }
  .vid { font-family:ui-monospace,Menlo,Consolas,monospace; font-size:12px; color:#8a90a0; word-break:break-all; }
  .meta { color:#8a90a0; font-size:12.5px; margin:4px 0 0; }
  .spacer { flex:1; }
  .acts { display:flex; gap:7px; }
  .log { margin-top:11px; border-top:1px solid #1a2130; padding-top:10px; display:none; }
  .log.open { display:block; }
  .logrow { display:flex; gap:10px; padding:3px 0; font-size:13px; }
  .logrow .when { color:#6b7180; white-space:nowrap; min-width:70px; }
  .logrow .what { word-break:break-all; }
  .logrow .q { color:#8fe3b4; }
  a.toggle { color:#6ea8fe; font-size:12.5px; cursor:pointer; text-decoration:none; }
  .empty { color:#8a90a0; padding:30px 0; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Visitors</h1>
  <div class="sub">Everyone who’s used the proxy — their device, what they opened, and a block switch.</div>

  <div id="msg" class="msg" hidden></div>

  <div id="gate" hidden>
    <div class="bar">
      <input type="password" id="tok" placeholder="Admin token" autocomplete="off" spellcheck="false">
      <button type="button" id="unlock">Unlock</button>
    </div>
  </div>

  <div id="panel" hidden>
    <div class="bar">
      <button type="button" class="ghost" id="refresh">Refresh</button>
      <span class="count" id="count"></span>
      <span class="spacer"></span>
      <label class="count"><input type="checkbox" id="auto"> auto-refresh</label>
    </div>
    <div id="list"></div>
    <div id="empty" class="empty" hidden>No one has used the proxy yet.</div>
  </div>
</div>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const list = $("list"), msg = $("msg");
  let token = decodeURIComponent((location.hash || "").replace(/^#/, "")) ||
              sessionStorage.getItem("pxadmin") || "";
  let timer = null;

  function say(t, kind) { msg.hidden = false; msg.className = "msg " + (kind || "ok"); msg.textContent = t; }
  function esc(s) { return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

  function ago(iso) {
    const s = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
    if (s < 60) return Math.floor(s) + "s ago";
    if (s < 3600) return Math.floor(s / 60) + "m ago";
    if (s < 86400) return Math.floor(s / 3600) + "h ago";
    return Math.floor(s / 86400) + "d ago";
  }

  // Show a google.com/search as "🔍 <query>", anything else as its bare URL.
  function pretty(u) {
    try {
      const url = new URL(u);
      if (/(^|\.)google\.[a-z.]+$/.test(url.hostname) && url.pathname === "/search") {
        const q = url.searchParams.get("q");
        if (q) return '<span class="q">🔍 ' + esc(q) + "</span>";
      }
      return esc(url.hostname + (url.pathname === "/" ? "" : url.pathname));
    } catch (_) { return esc(u); }
  }

  async function api(method, qs) {
    const res = await fetch("/api/keys" + (qs || ""), { method, headers: { "x-admin-token": token } });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || ("HTTP " + res.status));
    return data;
  }

  function render(visitors) {
    const ids = Object.keys(visitors || {})
      .sort((a, b) => new Date(visitors[b].last || 0) - new Date(visitors[a].last || 0));
    $("count").textContent = ids.length + (ids.length === 1 ? " visitor" : " visitors");
    $("empty").hidden = ids.length > 0;

    list.innerHTML = ids.map(function (rawId) {
      const v = visitors[rawId];
      // The id is whatever the visitor's browser put in the proxy path, so it is
      // theirs to choose. Every other field was escaped; this one went into the
      // data- attributes verbatim.
      const id = esc(rawId);
      const log = (v.log || []).map(function (e) {
        return '<div class="logrow"><span class="when">' + ago(e.t) + '</span>' +
               '<span class="what">' + pretty(e.u) + "</span></div>";
      }).join("") || '<div class="meta">nothing yet</div>';

      return '<div class="card' + (v.blocked ? " blocked" : "") + '">' +
        '<div class="head">' +
          '<span class="dev">' + esc(v.dev || "Unknown") + "</span>" +
          (v.blocked ? '<span class="pill red">blocked</span>' : "") +
          '<span class="pill">' + (v.hits || 0) + " opened</span>" +
          '<span class="spacer"></span>' +
          '<span class="acts">' +
            '<button type="button" class="ghost" data-toggle="' + id + '">activity</button>' +
            (v.blocked
              ? '<button type="button" class="ghost" data-unblock="' + id + '">Unblock</button>'
              : '<button type="button" class="ghost danger" data-block="' + id + '">Block</button>') +
            '<button type="button" class="ghost" data-del="' + id + '">Forget</button>' +
          "</span>" +
        "</div>" +
        '<div class="meta">' + esc(v.ip || "?") + " · last seen " + (v.last ? ago(v.last) : "?") + "</div>" +
        '<div class="vid">' + id + "</div>" +
        '<div class="log" id="log-' + id + '">' + log + "</div>" +
      "</div>";
    }).join("");
  }

  async function load() {
    try {
      render((await api("GET")).visitors);
      $("gate").hidden = true; $("panel").hidden = false;
      sessionStorage.setItem("pxadmin", token);
      if (location.hash) history.replaceState(null, "", location.pathname);
    } catch (e) {
      $("panel").hidden = true; $("gate").hidden = false;
      if (token) say(e.message, "err");
    }
  }

  $("unlock").addEventListener("click", function () { token = $("tok").value.trim(); if (token) load(); });
  $("tok").addEventListener("keydown", function (e) { if (e.key === "Enter") $("unlock").click(); });
  $("refresh").addEventListener("click", load);
  $("auto").addEventListener("change", function (e) {
    clearInterval(timer);
    if (e.target.checked) timer = setInterval(load, 5000);
  });

  list.addEventListener("click", async function (e) {
    const t = e.target;
    const toggle = t.getAttribute("data-toggle");
    if (toggle) { $("log-" + toggle).classList.toggle("open"); return; }
    try {
      if (t.getAttribute("data-block")) {
        if (!confirm("Block this visitor and their IP?")) return;
        render((await api("POST", "?block=" + encodeURIComponent(t.getAttribute("data-block")))).visitors);
        say("Blocked.", "ok");
      } else if (t.getAttribute("data-unblock")) {
        render((await api("POST", "?unblock=" + encodeURIComponent(t.getAttribute("data-unblock")))).visitors);
        say("Unblocked.", "ok");
      } else if (t.getAttribute("data-del")) {
        if (!confirm("Forget this visitor? Their record and history are deleted.")) return;
        render((await api("DELETE", "?id=" + encodeURIComponent(t.getAttribute("data-del")))).visitors);
        say("Forgotten.", "ok");
      }
    } catch (err) { say(err.message, "err"); }
  });

  load();
})();
</script>
</body>
</html>
