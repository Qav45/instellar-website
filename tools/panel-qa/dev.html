<div id="modal-root" hidden></div>
<div class="toasts" id="toast-root" role="status" aria-live="polite" hidden></div>
<script>
window.__errs=[];window.addEventListener('error',function(e){__errs.push(String(e.message)+' @'+(e.filename||'').split('/').pop()+':'+e.lineno);});
window.addEventListener('unhandledrejection',function(e){__errs.push('rej '+String(e.reason&&e.reason.stack||e.reason));});
setTimeout(function(){var d=document.createElement('pre');d.id='__dbg';d.style.display='none';d.textContent=JSON.stringify({sess:MOCK.session,search:location.search,nstaff:MOCK.db.staff.length,errs:__errs,authed:P.state.authed,screen:P.state.screen,me:P.state.me&&P.state.me.username,log:MOCK.log.slice(-40)});document.body.appendChild(d);},2500);
</script>
<script src="supabase-mock.js"></script>
<script src="fixtures.js"></script>
<script>
(function(){
  var q=new URLSearchParams(location.search);
  var as=q.get('as'); if(as) MOCK.as(as);
  var srv=q.get('server'); try{ if(srv) localStorage.setItem('instellar_server',srv); else localStorage.removeItem('instellar_server'); }catch(e){}
  window.DEV_OPEN=q.get('open'); window.DEV_W=q.get('w');
})();
</script>
<script src="../../panel/js/core.js"></script>
<script src="../../panel/js/api.js"></script>

<script src="../../panel/js/screens/guides.js"></script>
<script src="../../panel/js/screens/staff.js"></script>
<script src="../../panel/js/screens/supdash.js"></script>
<script src="../../panel/js/screens/protection.js"></script>
<script>
window.P.boot();
// ?open=punish|player|invite|manage|protect|template|log|guide  — opened once data has loaded
(function(){
  var o=window.DEV_OPEN; if(!o) return;
  var tries=0;
  (function wait(){
    if(!P.state.authed || !P.state.data.actions.length){ if(tries++<60) return setTimeout(wait,100); }
    try{
      if(o==='punish') P.openPunish({type:'Ban',target:'Sn0wF0x_',reason:'Cheating / Hacking',duration:'7 days'});
      else if(o==='punish-protected') P.openPunish({type:'Ban',target:'Nova_Tide',reason:'Cheating / Hacking',duration:'7 days'});
      else if(o==='punish-banned'){ P.openPunish({type:'Ban',target:'iron_ivy',reason:'Cheating / Hacking',duration:'7 days'}); setTimeout(function(){ var b=document.querySelector('#modal-root [data-action="submit"]'); if(b) b.click(); },50); }
      else if(o==='player') P.openPlayer('Sn0wF0x_');
      else { var el=document.querySelector('[data-action="'+o+'"]'); if(el) el.click(); else console.warn('no [data-action='+o+']'); }
    }catch(e){ console.error(e); }
  })();
})();
</script>
