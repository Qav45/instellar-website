let decoder = null;      // a live VideoDecoder means Stream is carrying the picture
let vidWaitKey = true;   // deltas are useless without the key they build on
let vidTimer = 0;        // the wait for a config message on a fresh socket
let vidFrames = 0;       // decoder outputs since the last tick
let vidHz = 0;           // the rate the encoder was configured for
let vidEncoder = "";     // which encoder the host ended up on, for the hover text
let vidCodec = "";       // and the codec string it is sending
let vidTried = false;    // one unasked retry per connect, no more

// Which codecs this browser decodes in hardware, in the order worth having
// them: bytes are what the tunnel is short of, and AV1 buys the most picture
// per byte, then HEVC. The host takes the list as a preference and answers
// with whichever of them it can encode. These strings are probes, one
// plausible 1080p profile per codec; the host's own arrives in the config
// message. Nothing supported still asks for H.264, since a browser without
// WebCodecs H.264 has no Stream at all and the host will say so.
const STREAM_CODECS = [["av1", "av01.0.08M.08"], ["hevc", "hvc1.1.6.L120.90"], ["h264", "avc1.64002a"]];
let vidCodecs = null;    // "av1,hevc,h264" once the probe below has answered

function streamCodecs(supported) {
  const list = STREAM_CODECS.filter((c, i) => supported[i]).map((c) => c[0]);
  return list.length ? list.join(",") : "h264";
}

// Asked once, at load: isConfigSupported is a promise, and openVideo is not.
const vidProbe = !("VideoDecoder" in window) ? Promise.resolve() :
  Promise.all(STREAM_CODECS.map(([, codec]) =>
    VideoDecoder.isConfigSupported({ codec, hardwareAcceleration: "prefer-hardware" })
      .then((r) => !!r.supported, () => false)))
    .then((s) => { vidCodecs = streamCodecs(s); });

// The 5-byte header the bridge puts on every binary frame: flags (bit 0 is a
// keyframe), then a big-endian millisecond timestamp. WebCodecs wants
// microseconds. Anything shorter than a header plus one byte is not a frame.
function parseVideoFrame(buf) {
  if (!buf || buf.byteLength < 6) return null;
  const v = new DataView(buf);
  return { key: (v.getUint8(0) & 1) === 1, timestamp: v.getUint32(1) * 1000,
           data: new Uint8Array(buf, 5) };
}

// Whether to hand a chunk to the decoder, and whether to wait for a key after
// it. A delta after a skipped frame is garbage - it references pixels this
// decoder never saw - so once anything is dropped nothing goes in until the next
// key. The drop itself is the lag control: a decoder holding more than
// LAG_QUEUE chunks is behind by that many frames, and feeding it more only makes
// the picture later. A keyframe is always decoded; it is the recovery point.
function streamGate(waitKey, key, queued) {
  if (key) return { decode: true, waitKey: false };
  if (waitKey || queued > LAG_QUEUE) return { decode: false, waitKey: true };
  return { decode: true, waitKey: false };
}

// One short line for the state text, whatever went wrong. The bridge closes
// with 1011 and a reason when the encoder is the problem, and 1006 with nothing
// when the socket simply never got there - a host predating the route, a tunnel
// that only forwards /ws, the link going away.
function streamReason(why, code, reason) {
  switch (why) {
    case "nodecoder": return "this browser cannot decode video";
    case "host": return "this host has no video route";
    case "timeout": return "the host sent no video";
    case "decode": return "decoder error" + (reason ? " (" + reason + ")" : "");
    case "close":
      if (code === 1011) return reason || "the encoder failed";
      if (code === 1006) return "the video link dropped";
      return "closed" + (code ? " (" + code + (reason ? ": " + reason : "") + ")" : "");
  }
  return "unknown";
}

function canStream() {
  return "VideoDecoder" in window && hostVideo;
}

function reflectStream() {
  const b = $("stream");
  const why = !("VideoDecoder" in window)
    ? "This browser has no WebCodecs video decoder, so Stream cannot run here."
    : !hostVideo ? "This host has no video route. Update the host script to get one."
    : "";
  b.disabled = !!why;
  b.title = why || STREAM_TITLE;
  b.classList.toggle("on", stream && !why);
}

function vidCanvas() {
  return rfb ? (rfb.canvas || screenEl.querySelector("canvas")) : null;
}

function openVideo() {
  closeVideo();
  if (!stream || !rfb || !endpoint || document.hidden) return;
  if (!canStream()) { streamOff("VideoDecoder" in window ? "host" : "nodecoder"); return; }
  // The codec probe is still out only in the first moments after load; come
  // back when it has answered, if Stream is still wanted and nothing else got
  // here first.
  if (vidCodecs === null) { vidProbe.then(() => { if (stream && !vidSock) openVideo(); }); return; }
  // Video mode is a picture that is all motion, so it gets the bytes. The
  // display is the share dropdown's own vocabulary; the bridge whitelists it
  // and the codec list too.
  const url = endpoint.replace("/ws?", "/video?") + "&fps=60&mbps=" + (video ? 12 : 8) +
              "&display=" + encodeURIComponent($("share").value) + "&codecs=" + vidCodecs;
  let sock;
  try {
    sock = new WebSocket(url);
  } catch (e) {
    streamOff("decode", 0, String(e.message || e));
    return;
  }
  sock.binaryType = "arraybuffer";
  vidSock = sock;
  // The same guard as the RFB handlers: a socket this page closed still has a
  // close event to deliver, and it must not tear down its replacement.
  const mine = () => vidSock === sock;
  vidTimer = setTimeout(() => { if (mine()) streamOff("timeout"); }, 5000);

  sock.addEventListener("message", (e) => {
    if (!mine()) return;
    if (typeof e.data === "string") {
      let cfg = null;
      try { cfg = JSON.parse(e.data); } catch (_) {}
      if (cfg && cfg.type === "config") configureVideo(cfg);
      return;
    }
    // The link readout is bytes arriving, whichever socket carries them.
    stats.window += e.data.byteLength || 0;
    if (!decoder || decoder.state !== "configured") return;
    const f = parseVideoFrame(e.data);
    if (!f) return;
    const g = streamGate(vidWaitKey, f.key, decoder.decodeQueueSize);
    vidWaitKey = g.waitKey;
    if (!g.decode) return;
    try {
      decoder.decode(new EncodedVideoChunk({ type: f.key ? "key" : "delta",
                                             timestamp: f.timestamp, data: f.data }));
    } catch (err) {
      streamOff("decode", 0, String(err.message || err));
    }
  });
  sock.addEventListener("close", (e) => {
    if (mine()) streamOff("close", e.code, e.reason);
  });
}

// A config message is the encoder starting - or restarting with new settings,
// which is why the decoder is built fresh each time rather than reconfigured
// mid-stream. Only from here on are the RFB pixels switched off: until the
// host has proved it can encode, the VNC picture is the one worth keeping.
function configureVideo(cfg) {
  clearTimeout(vidTimer);
  if (decoder) { try { decoder.close(); } catch (_) {} decoder = null; }
  const d = new VideoDecoder({
    output: (frame) => {
      // Scaled to the canvas rather than drawn 1:1: the framebuffer is what the
      // mouse coordinates are measured against, and the encoder's size need
      // not match it exactly.
      const c = decoder === d ? vidCanvas() : null;
      if (c) {
        vidFrames++;
        c.getContext("2d").drawImage(frame, 0, 0, c.width, c.height);
      }
      frame.close();
    },
    error: (e) => { if (decoder === d) streamOff("decode", 0, String(e.message || e)); },
  });
  try {
    d.configure({ codec: cfg.codec, optimizeForLatency: true,
                  hardwareAcceleration: "prefer-hardware" });
  } catch (e) {
    try { d.close(); } catch (_) {}
    streamOff("decode", 0, String(e.message || e));
    return;
  }
  decoder = d;
  vidWaitKey = true;
  vidHz = cfg.fps || 0;
  vidEncoder = cfg.encoder || "";
  vidCodec = cfg.codec || "";
  rfb.pixels = false;
  streamWant = 0;
  pushStream();
  $("quality").disabled = true;
  state("live", "Streaming");
}

// Tear down the socket and decoder and nothing else: the RFB pixels stay as
// they are, which is what a hidden tab and a reconnect both want.
function closeVideo() {
  clearTimeout(vidTimer);
  if (vidSock) { const s = vidSock; vidSock = null; try { s.close(); } catch (_) {} }
  if (decoder) { const d = decoder; decoder = null; try { d.close(); } catch (_) {} }
  vidHz = 0;
  vidEncoder = "";
  vidCodec = "";
  vidFrames = 0;
}

// Back to VNC pixels. With a reason it is a failure and the state line says
// so; without one it is the toggle going off. Either way the ladder resumes
// from its ceiling, exactly as the Video toggle hands the rate back.
function streamOff(why, code, reason) {
  closeVideo();
  $("quality").disabled = video;
  // No session means nothing to fall back to, and whatever card is up owns
  // the state line: a video socket outliving Stop cast must not overwrite
  // "Host offline" with its own goodbye.
  if (!rfb) return;
  if (rfb.pixels === false) rfb.pixels = true;
  if (!document.hidden) setRate(ceilHz());
  if (!why) { state("live", "Connected"); return; }
  state("live", "Stream unavailable: " + streamReason(why, code, reason));
  if (why === "host" || why === "nodecoder") { reflectStream(); return; }
  // A tunnel hiccup or an encoder still warming up deserves one more go. Just
  // one: a host that cannot encode says so on every attempt, and a socket
  // reopened every few seconds is the loop this page has already had to
  // remove once from pushStream. A socket already pending by then - a
  // reconnect got there first - is left alone.
  if (!vidTried && stream) {
    vidTried = true;
    setTimeout(() => { if (rfb && stream && !vidSock) openVideo(); }, 3000);
  }
}

$("stream").addEventListener("click", () => {
  if ($("stream").disabled) return;
  stream = !stream;
  try { localStorage.setItem(STREAM_KEY, stream ? "1" : "0"); } catch (_) {}
  reflectStream();
  if (stream) { vidTried = false; openVideo(); }
  else streamOff("");
  refocus();
});

// Same shape as the session store: a browser that blocks site data throws on
// the mention of localStorage, and a toggle that forgets itself is not a
// broken page.
try { stream = localStorage.getItem(STREAM_KEY) === "1"; } catch (_) {}
reflectStream();

$("look").addEventListener("click", () => {
  const on = $("look").classList.toggle("on");
  if (rfb) rfb.viewOnly = on;
  // Holding the pointer captive for a session that throws every mouse event
  // away is the worst of both: the cursor cannot leave and nothing it does
  // arrives.
  if (on) setGrab(false);
  refocus();
});

$("cad").addEventListener("click", () => { if (rfb) rfb.sendCtrlAltDel(); refocus(); });

$("full").addEventListener("click", () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen().catch(() => {});
  refocus();
});

$("again").addEventListener("click", () => {
  manualStop = true;
  if (rfb) { try { rfb.disconnect(); } catch (_) {} rfb = null; }
  start();
});

// The other half of the remote start. Not on the LAN page: that is served by
// the bridge itself, which has no /api/cast, and Ctrl+C is right there anyway.
$("stop").hidden = !!DIRECT;
$("stop").addEventListener("click", async () => {
  if (!token) return;
  const who = hostName || "the host";
  if (!confirm("Stop casting on " + who + "? The screen goes away for everyone watching.")) {
    refocus();
    return;
  }
  state("wait", "Stopping…");
  let body;
  try {
    body = await wish("stop");
  } catch (e) {
    state("bad", "Could not stop");
    if (rfb) { refocus(); return; }
    // Nothing on screen to fall back to, so the error gets the card.
    problem("Could not stop the cast", String(e.message || e));
    return;
  }
  // The host takes up to ten seconds to go, and the first retry fires before
  // that. Start the wait long enough that it does not walk straight back into
  // the session it just asked to end.
  manualStop = true;
  closePing();
  stopStats();
  if (rfb) { try { rfb.disconnect(); } catch (_) {} rfb = null; }
  backoff = 15000;
  state("wait", "Host offline");
  problem("Nobody is casting", "Stopping " + (body.name || who) + "… the host takes about ten seconds to go.");
});

window.addEventListener("beforeunload", () => {
  manualStop = true;
  closePing();
  if (rfb) { try { rfb.disconnect(); } catch (_) {} }
});

/* ---------------------------------------------------------------- boot -- */

// Keep the key out of the address bar once we have it. It still has to survive
// a reload, though: stripped from the URL and saved nowhere, every F5 on a watch
// link came back to the access-key card.
if (location.hash) {
  if (token) store.set("castToken", token);
  history.replaceState(null, "", location.pathname + location.search);
}

$("gateGo").addEventListener("click", () => {
  const v = $("gateInput").value.trim();
  if (!v) return;
  token = v;
  store.set("castToken", v);
  start();
});
$("gateInput").addEventListener("keydown", (e) => {
  if (e.key === "Enter") $("gateGo").click();
});

if (DIRECT || token) start();
else { state("wait", "Waiting for a key"); $("gateInput").focus(); }
</script>
</body>
</html>
