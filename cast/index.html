<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Cast</title>
<meta name="robots" content="noindex">
<script>
  (function () {
    // Served by the bridge on the LAN: already at the root, nothing to normalise.
    if (window.CAST_DIRECT) return;

    // Same file is served by GitHub Pages (instellar.net) and Vercel
    // (go.instellar.net). Only the Vercel copy has /api/*, so bounce to that one.
    var h = location.hostname;
    if (h === "instellar.net" || h === "www.instellar.net") {
      location.replace("https://go.instellar.net" +
        location.pathname + location.search + location.hash);
      return;
    }

    // Vercel serves /cast without redirecting to /cast/, and a relative URL in a
    // page at /cast resolves against / - so ./novnc.js would ask for /novnc.js and
    // 404, leaving the page stuck on its own markup. Add the slash so relative
    // paths mean what they look like.
    if (!location.pathname.endsWith("/")) {
      location.replace(location.pathname + "/" + location.search + location.hash);
    }
  })();
</script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  [hidden] { display: none !important; }
  :root { --bg:#0b0d12; --fg:#e7e9ee; --muted:#8a90a0; --accent:#6ea8fe; --panel:#151922; --line:#232838; }
  html, body { height: 100%; overflow: hidden; }
  body { background: var(--bg); color: var(--fg); display: flex; flex-direction: column;
         font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

  /* ---- toolbar ---- */
  #bar { display:flex; align-items:center; gap:8px; padding:6px 10px; flex:0 0 auto; flex-wrap:wrap;
         background:var(--panel); border-bottom:1px solid var(--line); font-size:13px; }
  #bar .spacer { flex:1; }
  #bar button, #bar select { background:#1b2130; color:var(--fg); border:1px solid var(--line);
         border-radius:8px; padding:5px 9px; font-size:12px; font-family:inherit; cursor:pointer; }
  #bar button:hover, #bar select:hover { border-color:var(--accent); }
  #bar button.on { border-color:var(--accent); color:var(--accent); }
  /* Stream with no decoder here or no route there: the title says which. */
  #bar button:disabled { opacity:.5; cursor:default; border-color:var(--line); }
  /* Mouse lock armed but not currently holding the pointer - Escape hands it
     back and only a click can take it again, so the button must not go on
     claiming the pointer is captured. */
  #grab.on:not(.held) { border-style:dashed; }
  #bar label { color:var(--muted); font-size:12px; display:flex; align-items:center; gap:5px; }

  #state { display:flex; align-items:center; gap:8px; color:var(--muted); font-size:12px;
           min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #state .dot { width:8px; height:8px; border-radius:50%; background:var(--muted); flex:0 0 auto; }
  #state.live .dot { background:#3ddc84; box-shadow:0 0 8px #3ddc84; }
  #state.wait .dot { background:#ffb020; box-shadow:0 0 8px #ffb020; animation:pulse 1.2s infinite; }
  #state.bad  .dot { background:#ff5c5c; box-shadow:0 0 8px #ff5c5c; }
  @keyframes pulse { 50% { opacity:.25; } }

  /* ---- stats readout ---- */
  #hud { display:flex; gap:12px; font-size:11.5px; color:var(--muted);
         font-variant-numeric:tabular-nums; white-space:nowrap; }
  #hud b { color:var(--fg); font-weight:600; }
  #hud .warn b { color:#ffb020; }
  #hud .bad b { color:#ff5c5c; }
  /* The fps field keeps its frame diagnostics - duty, backlog, requested rate -
     in a tooltip, because they do not deserve toolbar width. Nothing says a
     tooltip is there unless the cursor does. */
  #hud [title] { cursor:help; }

  /* ---- screen ---- */
  #screen { flex:1 1 auto; min-height:0; background:#000; position:relative; }

  /* ---- video mode ---- */
  /* The toolbar floats over the picture and fades once the mouse rests, so a
     letterboxed video gets the rows the bar was taking. It comes back on the
     first movement; a cursor parked on the bar keeps it. */
  body.video #bar { position:absolute; top:0; left:0; right:0; z-index:5; transition:opacity .25s; }
  body.video.idle #bar { opacity:0; pointer-events:none; }

  /* ---- overlay cards (token / password / errors) ---- */
  #veil { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
          background:rgba(11,13,18,.94); z-index:10; padding:24px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:14px;
          padding:26px 26px 22px; width:100%; max-width:400px; }
  .card h2 { font-size:19px; letter-spacing:-.01em; margin-bottom:6px; }
  .card p { color:var(--muted); font-size:13px; line-height:1.55; margin-bottom:16px; }
  .card input { width:100%; background:#0f131c; color:var(--fg); border:1px solid var(--line);
          border-radius:9px; padding:10px 12px; font-size:14px; font-family:inherit; margin-bottom:12px; }
  .card input:focus { outline:none; border-color:var(--accent); }
  .card button { width:100%; background:var(--accent); color:#0b0d12; border:0; border-radius:9px;
          padding:10px; font-size:14px; font-weight:600; font-family:inherit; cursor:pointer; }
  .card .err { color:#ff8080; font-size:13px; margin-bottom:12px; }
  .card button + button { margin-top:8px; }
  .card button:disabled { opacity:.6; cursor:default; }
  .card .foot { color:var(--muted); font-size:12px; margin-top:14px; line-height:1.5; }
</style>
</head>
<body>

<div id="bar">
  <div id="state"><span class="dot"></span><span id="stateText">Starting…</span></div>
  <div id="hud">
    <span id="hRtt">ping <b>–</b></span>
    <span id="hRate">link <b>–</b></span>
    <span id="hFb">screen <b>–</b></span>
    <span id="hFps">fps <b>–</b></span>
  </div>
  <div class="spacer"></div>
  <label>Show
    <select id="share" title="Fewer pixels is the single biggest speed win">
      <option value="primary" selected>Main screen</option>
      <option value="2">Second screen</option>
      <option value="full">Both</option>
    </select>
  </label>
  <label>Quality
    <select id="quality" title="Auto watches the link and picks for you">
      <option value="auto" selected>Auto</option>
      <option value="9,3">Sharp</option>
      <option value="6,5">Balanced</option>
      <option value="3,7">Fast</option>
    </select>
  </label>
  <button id="fit" class="on" title="Scale the remote screen to fit this window">Fit</button>
  <button id="video" title="For watching a video playing on the host: a quality pair chosen for moving pictures, the rate as the only thing that gives, the toolbar out of the way and the screen kept awake.">Video</button>
  <button id="stream" title="Hardware video for games and video: the host's GPU encodes the screen (AV1, HEVC or H.264, whichever this browser decodes in hardware) and this browser decodes it, sixty frames a second. Text goes a little soft, which is why it is a toggle and not the default.">Stream</button>
  <button id="look" title="Ignore my mouse and keyboard">Watch only</button>
  <button id="grab" title="Keep the pointer in the remote screen and send movement rather than position - what a game needs. Turn Fullscreen on too and Escape reaches the game; hold it to let go.">Mouse lock</button>
  <button id="cad" title="Send Ctrl+Alt+Delete to the remote machine">Ctrl+Alt+Del</button>
  <button id="full" title="Fullscreen">Fullscreen</button>
  <button id="again" title="Reconnect">Reconnect</button>
  <button id="stop" title="Ask the host machine to stop casting">Stop cast</button>
</div>

<div id="screen">
  <div id="veil">
    <div class="card">
      <h2>Access key</h2>
      <p>Paste the key the host printed when it started casting.</p>
      <input type="password" id="gateInput" placeholder="Access key" autocomplete="off" spellcheck="false">
      <button id="gateGo">Connect</button>
    </div>
  </div>
</div>

<script type="module">
// The stream does NOT come through instellar.net: Vercel functions cannot hold a
// WebSocket open. /api/cast only hands back the address of the host's tunnel, and
// this page then talks RFB straight to it. No serverless hop in the pixel path is
// the reason this stays quick.
//
// Everything else about feeling fast comes down to three numbers, all of which the
// toolbar shows so they can be argued with rather than taken on faith:
//   ping    - the floor on how fast a keystroke can echo. Network, not us.
//   link    - bytes actually arriving. If this pins, quality is too high.
//   screen  - the framebuffer. Every pixel here is decode work on a weak laptop,
//             which is why the host shares one display by default.

// noVNC ships CommonJS only - there is no ESM build to import - and its 54
// modules would be 54 requests on every cold load. novnc.js is that whole tree
// bundled into one same-origin file, which is one request and no third party in
// the critical path.
import RFB from "./novnc.js?v=20260909-stream";

const $ = (id) => document.getElementById(id);
const screenEl = $("screen");

// Card bodies are built as HTML, and the messages put in them come off the RFB
// wire (the host's own rejection reason) or out of an /api/cast error body.
const esc = (s) => String(s).replace(/[&<>"]/g,
  (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

// A key containing a bare % is not a valid escape and decodeURIComponent throws
// on it. Up here that throw aborts the whole module, so the access-key card stays
// on screen with nothing wired to its button - a dead page and no error.
function hashToken() {
  const raw = (location.hash || "").replace(/^#/, "");
  try { return decodeURIComponent(raw); } catch (_) { return raw; }
}

// A browser set to block site data - a managed Chromebook, a private window on
// some phones - throws on the mere mention of sessionStorage, and up here that
// throw is the same dead page as the bad hash above. The key and password are
// conveniences for a reload; a session that has to ask again is not broken.
const store = {
  get: (k) => { try { return sessionStorage.getItem(k) || ""; } catch (_) { return ""; } },
  set: (k, v) => { try { sessionStorage.setItem(k, v); } catch (_) {} },
  drop: (k) => { try { sessionStorage.removeItem(k); } catch (_) {} },
};

let token = hashToken() || store.get("castToken");
let password = store.get("castPass");
// Served by the bridge itself on the LAN: the endpoint is this very host, and the
// session key was injected into the page, so there is nothing to look up.
const DIRECT = typeof window.CAST_DIRECT === "string" ? window.CAST_DIRECT : "";
// Which tab this is, carried on the socket URL so the bridge learns it during the
// upgrade and every /ctl call can name it. Not a credential - the session key in
// the same URL is - just an identifier, so that the rate this page's controller
// asks for moves this page's bridge and not the one a second tab is watching
// through. Per tab rather than per connection: a reconnect is the same viewer
// and should land on the rate it already chose.
const VIEWER = Math.random().toString(36).slice(2, 10) +
               Math.random().toString(36).slice(2, 10);
let endpoint = DIRECT
  ? (location.protocol === "https:" ? "wss://" : "ws://") + location.host +
    "/ws?k=" + encodeURIComponent(DIRECT) + "&v=" + VIEWER
  : "";
let rfb = null;
let retry = null;
let hostName = "";          // whatever the registry last called the host
let manualStop = false;
let needPassword = false;   // a password card is up; disconnect must not bury it
let video = false;          // the Video toggle: VIDEO pinned, rate the only dial

/* --------------------------------------------------------------- metrics -- */

// A Chromebook is CPU-poor before it is bandwidth-poor, so the presets trade JPEG
// quality away first. That costs less than it sounds: Tight sends flat and
// low-colour regions - which is most of a code editor - through zlib with a
// palette, and only photographic areas through JPEG. Dropping quality blurs
// wallpaper, not text.
//
// Compression is a separate dial and it is close to free here: zlib decompresses
// at the same speed whatever level packed it, so a higher level costs the host a
// little CPU - it is a desktop, it has some - and costs the viewer nothing while
// meaningfully shrinking exactly the flat regions that dominate a screenful of
// text. The old level 1 was leaving that on the table.
// One ladder, not two knobs. Frame rate and quality spend the same budget -
// bytes on the wire and milliseconds of decode - so two controllers arguing over
// it is a guaranteed fight. Eight rungs ordered by bytes per second, climbed and
// descended one at a time. The top rung exists so a LAN session on a real machine
// still gets the sharp picture this page has always given it; rung 0 exists so a
// phone on cellular still gets something that moves.
//
// Ordered by bytes rather than by rate, which is what the low-quality pair at 20
// and 30 Hz is for. Video is the case that exposed the old six-rung shape: a
// playing video changes every pixel of the viewport every frame, so it is bound
// by the link long before it is bound by anything else, and the only descent the
// ladder offered was rate. Falling out of Balanced cost a third of the motion and
// not one byte per frame, then another third, and another - 30 Hz down to 10,
// each step still shipping the same expensive frames - when dropping the quality
// pair instead cuts bytes about threefold at full rate. That rung did not exist,
// so the picture that could have moved smoothly at 30 Hz stuttered at 10.
//
// So both quality pairs now span the rate axis, and the order is the byte cost of
// a second: 3.3, 6.7, 10, 15, 20, 30 and up. Every down-step therefore buys a
// link something, which is the property the descent needs and the only one that
// makes a single ladder honest. It is not monotone in decode work - rung 3 is
// thirty cheap frames where rung 4 is fifteen dearer ones - and it cannot be,
// because the two axes disagree about what costs what. A viewer bound by its own
// decoder rather than by the link simply keeps descending past that step, which
// is what it did before.
//
// `preset` names the dropdown entry a rung answers to, where one does: the
// mapping is written down rather than recovered by scanning the table for a
// matching pair.
const RUNGS = [
  { hz: 5,  quality: 3, compression: 7 },
  { hz: 10, quality: 3, compression: 7 },
  { hz: 20, quality: 3, compression: 7 },
  { hz: 30, quality: 3, compression: 7, preset: "3,7" },   // Fast, where video settles
  { hz: 15, quality: 6, compression: 5 },
  { hz: 20, quality: 6, compression: 5 },
  { hz: 30, quality: 6, compression: 5, preset: "6,5" },   // Balanced
  { hz: 30, quality: 9, compression: 3, preset: "9,3" },   // Sharp
];
const TOP = RUNGS.length - 1;
// The rate axis on its own, for the manual case below, where quality is pinned
// and this is the only dial left to turn. 0 is a rate: it means stop asking.
const RATES = [0, 5, 10, 15, 20, 30];

// The pair video mode pins. A playing video is one photographic region changing
// every frame, so JPEG carries nearly all of it and the ladder's text-first
// reasoning does not apply: quality 5 is the level where motion stops looking
// like a mosaic, and that is worth the bytes over Fast's 3. Compression 6 is the
// lowest level at which TightVNC splits a frame into its largest rects, 65536
// pixels - lower levels cut the frame finer, down to hundreds of rects at the
// Fast end, each its own JPEG with its own header and its own createImageBitmap
// on this side - and it
// carries the cheapest zlib of that tier, which only touches the letterbox bars
// anyway. Not a rung: its bytes would sit mid-ladder while its decode cost sits
// at the top, and the ladder's descent is only honest when both fall together.
// So video mode is the manual shape - the pair is pinned, the rate is the dial.
const VIDEO = { quality: 5, compression: 6 };

// Cheap proxy for "is this a weak machine": Chromebooks commonly report 2-4 cores
// and 4GB. A cold-start guess and nothing more - it picks the rung this page
// opens on and is never consulted again. It used to be ORed into the tier
// decision itself, which meant a machine flagged weak could never reach the
// sharp preset however well it was measured to be doing, for the life of the
// page - and the comment here claimed the opposite. The ladder's own ceiling is
// what holds a weak device down now, and it earns that from measurement.
const WEAK = (navigator.hardwareConcurrency || 4) <= 4 ||
             (navigator.deviceMemory || 8) <= 4;

const stats = { rtt: 0, floor: 0, window: 0, mbps: 0 };
// What the frame pipeline is doing, as opposed to what the probe socket says.
// Whoever measures frames writes these; the tick below only renders them, so
// the readout stays honest about knowing nothing while they are all zero.
const metrics = { fps: 0, duty: 0, streamHz: 0, backlogBytes: 0,
                  pollMs: 0, rung: 0, ceiling: 0 };
const hud = {
  rtt: $("hRtt").querySelector("b"),
  rate: $("hRate").querySelector("b"),
  fb: $("hFb").querySelector("b"),
  fps: $("hFps").querySelector("b"),
};
let pingSock = null;
let pingTimer = null;
let pingRetryAt = 0;

function openPing() {
  if (!endpoint) return;
  // A handshake a second, for as long as the probe cannot connect, is what the
  // tick below was doing - through the very tunnel this session depends on, and
  // it is exactly the shape of traffic a tunnel throttles. The probe is a
  // readout; it can wait five seconds.
  pingRetryAt = performance.now() + 5000;
  closePing();
  try {
    pingSock = new WebSocket(endpoint.replace("/ws?", "/ping?"), ["binary"]);
  } catch (_) { return; }
  pingSock.binaryType = "arraybuffer";

  // The timer belongs to this socket. Reading it out of `pingTimer` instead
  // meant a stale socket's close event - which lands after the replacement has
  // already opened - cleared the *live* timer, freezing the ping readout and
  // with it the auto tier, which is driven by that number.
  const sock = pingSock;
  let timer = null;
  const stop = () => clearInterval(timer);

  sock.addEventListener("open", () => {
    timer = setInterval(() => {
      if (sock.readyState !== 1) return;
      sock.send(new Float64Array([performance.now()]).buffer);
    }, 1000);
    if (sock === pingSock) pingTimer = timer;
  });

  sock.addEventListener("message", (e) => {
    // A reconnect builds a new probe, and the old socket can still be open and
    // still be echoing. Its samples belong to a tunnel this page has walked away
    // from, and letting them seed the floor of the new one is how a session
    // starts life believing it is congested. The close handler below already
    // guards this way; the sample path has to as well.
    if (sock !== pingSock) return;
    if (!(e.data instanceof ArrayBuffer) || e.data.byteLength !== 8) return;
    const sample = performance.now() - new Float64Array(e.data)[0];
    // Smoothed, so one scheduling hiccup does not swing the readout or the tier.
    stats.rtt = stats.rtt ? stats.rtt * 0.7 + sample * 0.3 : sample;
    // The lowest round trip seen is this link's own floor - distance and tunnel,
    // nothing we can spend our way out of. What the tier cares about is delay on
    // top of that, so keep the floor to subtract from later.
    stats.floor = stats.floor ? Math.min(stats.floor, sample) : sample;
  });

  // The probe is a nicety; if it cannot connect the session carries on regardless.
  // But a dead probe must not leave its last number behind: the tick reopens it,
  // and until a fresh sample lands the readout says so and the tier holds where
  // it is. Otherwise the floor drifts up to meet the stale figure, "queued" reads
  // zero, and auto quality climbs to sharp on a link nobody is measuring.
  sock.addEventListener("close", () => {
    stop();
    if (sock === pingSock) stats.rtt = 0;
  });
  sock.addEventListener("error", stop);
}

function closePing() {
  clearInterval(pingTimer);
  if (pingSock) { try { pingSock.close(); } catch (_) {} }
  pingSock = null;
}

function fmtRate(mbps) {
  if (!mbps) return "idle";
  return mbps >= 1 ? mbps.toFixed(1) + " Mb/s" : (mbps * 1000).toFixed(0) + " kb/s";
}

// One timer drives both the readout and the controller, so the page does no
// per-frame work of its own beyond counting what arrives.
//
// It runs only while there is a session. It used to run from module load for
// the life of the tab: a page sitting on a "Nobody is casting" card did a DOM
// query and four style writes every second forever, and showed a decaying link
// figure for a link that was not there instead of an honest dash.
let lastTick = performance.now();
let statsTimer = null;
let lastTitle = "";

function startStats() {
  if (statsTimer) return;
  lastTick = performance.now();
  statsTimer = setInterval(tick, 1000);
}

function stopStats() {
  clearInterval(statsTimer);
  statsTimer = null;
  stats.window = 0;
  stats.mbps = 0;
  metrics.fps = metrics.duty = metrics.backlogBytes = metrics.streamHz = 0;
  hud.rtt.textContent = hud.rate.textContent = hud.fb.textContent = "–";
  hud.fps.textContent = "–";
  $("hRtt").className = "";
  $("hFps").className = "";
  $("hFps").title = lastTitle = "";
}

function tick() {
  // Divide by the time that actually passed. A hidden tab throttles this timer to
  // once a minute while bytes keep arriving, and assuming one second turned that
  // into a readout sixty times the real rate on the first tick back.
  const now = performance.now();
  const dt = (now - lastTick) / 1000;
  lastTick = now;
  stats.mbps = dt > 0 ? (stats.window * 8) / 1e6 / dt : 0;
  stats.window = 0;

  // Let the floor drift back up, or a single lucky sample early on becomes a
  // baseline the link can never live up to again.
  //
  // This used to happen only while the link was quiet, and a live cast is never
  // quiet - mbps is above 0.5 essentially by definition - so in practice the
  // floor froze at the lowest sample of the first few still seconds and only
  // ever ratcheted down. A wifi handover or a route change mid-session then read
  // as permanent congestion for the rest of the session. It re-learns either way
  // now, just more slowly under load, where a rise is as likely to be our own
  // bytes as the path's. Relaxing it is safe because RTT no longer sets the
  // picture on its own: it is a veto on climbing and one of four reasons to drop,
  // so a floor that reads a little high costs a delayed climb, not a session
  // pinned to the cheapest rung.
  if (stats.floor && stats.rtt) {
    stats.floor = Math.min(stats.floor * (stats.mbps < 0.5 ? 1.02 : 1.005), stats.rtt);
  }

  // The probe is a second socket and it dies on its own timetable - an idle
  // timeout on the tunnel is enough. Left dead, the readout freezes on a stale
  // number and the tier goes on trusting it.
  if (rfb && (!pingSock || pingSock.readyState > 1) && performance.now() >= pingRetryAt) openPing();

  // Decide before drawing, so the toolbar shows this second's numbers and this
  // second's rung rather than the previous one's.
  govern(dt);

  // The rate the ladder wants and the rate the host acknowledged, reconciled once
  // a second. Every other call site is an event - a rung change, connect,
  // disconnect - so a single failed /ctl used to leave the two disagreeing until
  // the ladder happened to move again: the page believed nothing was streaming,
  // which silently took the deficit rule out of service, while the bridge went on
  // injecting at the old rate. A reconnect could lose its rate push the same way,
  // to a stale call still in flight. pushStream is a no-op unless it has
  // something to say and its backoff has run, so this costs nothing while the
  // two agree.
  if (streamWant !== streamSent) pushStream();

  const rtt = stats.rtt;
  hud.rtt.textContent = rtt ? Math.round(rtt) + " ms" : "–";
  $("hRtt").className = rtt > 150 ? "bad" : rtt > 70 ? "warn" : "";
  hud.rate.textContent = fmtRate(stats.mbps);

  const canvas = screenEl.querySelector("canvas");
  hud.fb.textContent = canvas && canvas.width
    ? canvas.width + "×" + canvas.height : "–";

  // Frames delivered over the rate that was asked for. A zero requested rate is
  // not "asked for nothing", it is "nobody is asking" - either nothing drives
  // the rate yet, or the server pushes frames on its own timetable and there is
  // no request to fall short of - and inventing a target there would paint a
  // healthy stream red, so show the delivered number by itself.
  //
  // While Stream is on the picture is the decoder's, not the RFB loop's, so the
  // readout counts its outputs against the rate the encoder was configured for.
  const vidFps = decoder && dt > 0 ? vidFrames / dt : 0;
  vidFrames = 0;
  const want = decoder ? vidHz : metrics.streamHz;
  const fps = decoder ? vidFps : metrics.fps;
  hud.fps.textContent = fps || want
    ? Math.round(fps) + (want ? " / " + Math.round(want) : "")
    : "–";
  const short = want ? 1 - fps / want : 0;
  const fpsEl = $("hFps");
  fpsEl.className = short > 0.35 ? "bad" : short > 0.15 ? "warn" : "";
  // The whole controller state, in the one place it costs nothing to put it.
  // A bug report about the rate is unanswerable without it, and the host poll
  // line is what tells someone their 1 FPS is tune-host.cmd's job, not ours.
  // Assigned only when it actually changed: a title nobody is hovering over is
  // not worth a DOM write a second, in a file whose own comments complain about
  // per-second DOM work.
  const title = (vidEncoder ? vidCodec + " via " + vidEncoder + " · " : "") +
    "decode duty " + Math.round(metrics.duty * 100) + "%" +
    " · backlog " + Math.round(metrics.backlogBytes / 1024) + " KB" +
    " · stream " + (want ? Math.round(want) + " Hz" : "not set") +
    " · rung " + metrics.rung + " of " + metrics.ceiling +
    (metrics.pollMs ? " · host polls every " + metrics.pollMs + " ms" : "");
  if (title !== lastTitle) { fpsEl.title = lastTitle = title; }

  // Every named way focus can leave the canvas already puts it back, but a dead
  // keyboard that needs a Reconnect to clear means at least one way is not named
  // - a print dialog dismissed, an extension popup, a window manager handing
  // focus somewhere on its own. None of those fire anything we listen for. So
  // stop enumerating causes and check the state itself: if there is a session,
  // nothing on screen asking to be typed into, and focus is not on the canvas or
  // the toolbar, that is a keyboard nobody can use and no reason for it.
  // Only while this tab is the one in front: reaching for focus behind the
  // user's back, while they are in another tab, is how a page becomes the thing
  // that steals your address bar.
  if (rfb && !document.hidden && !$("veil")) {
    const el = document.activeElement;
    if (!(el && el.closest && el.closest("#bar"))) refocus();
  }
}

/* ------------------------------------------------------------- governor -- */

// The old tuner read one number - the excess delay of an 8-byte echo - and its
// only output was JPEG quality. Neither half could express frame rate. Quality
// is bytes per frame, and the frame period through a tunnel is set by the round
// trip, so moving Sharp to Fast cut the bytes about threefold and left the rate
// bit for bit identical: every tier was equally choppy, which is the complaint.
// The echo also travels its own socket, so a viewer too slow to decode - the
// weak laptop this page is written for - showed no queueing at all and got
// climbed into the stall.
//
// So: measure the pipeline in band, and control the thing being complained
// about. RTT keeps a job, but a smaller one - a veto on climbing and one of four
// reasons to fall - and the signals that actually respond to a change in rate do
// the driving.
const UP_DWELL = 6, DOWN_DWELL = 2;
const SOFT_BACKLOG = 256 * 1024;
const HARD_BACKLOG = 2 * 1024 * 1024;
const KILL_BACKLOG = 8 * 1024 * 1024;

const CEILING_DECAY = 60000;

// The same two pictures this page has always opened on - 15 Hz and 30 Hz, both
// at the balanced quality pair - now that the two new rungs sit below them.
let rung = WEAK ? 4 : 6;
let ceilingRung = TOP;
let ceilingSince = 0;     // when the ceiling was last lowered, for its decay
let upHold = 0, downHold = 0;
let enteredAt = 0;        // when this rung was climbed into; 0 if we fell into it
let holdUntil = 0;        // the kill switch's flat freeze; nothing else sets it
let prevBacklog = 0;
let bestFps = 0;          // the highest rate this session has actually delivered
let alignedFor = -1;      // the pollMs the current ask was aligned to; -1 is none

// Filled by the framebufferupdate event, drained once a second by the tick.
const frames = { n: 0, busyMs: 0, bytes: 0, backlog: 0, continuous: false };

function onFrame(d) {
  frames.n++;
  // duration spans header to flip, so it includes the wait on the previous
  // frame's render queue. That is deliberate: the wait is decode cost this
  // device is paying, and leaving it out would read a stalled decoder as idle.
  frames.busyMs += d.duration;
  frames.bytes += d.bytes;
  if (d.backlog > frames.backlog) frames.backlog = d.backlog;
  frames.continuous = d.continuous;
}

// The rate actually asked for, which is the rung's rate except at the top of the
// rate axis, where it is the host's poll rate instead.
//
// Asking a little slower than the host polls does not deliver a slightly slower
// picture, it delivers an uneven one. TightVNC answers an update request at the
// first poll that finds a change, so a 30 Hz ask against a 33 Hz poll is answered
// on the poll grid - nine gaps of 30 ms and then one of 60, three times a second,
// for ever. Even frames, uneven motion. Scenery hides that completely and a
// moving hand does not, which is exactly how it was reported.
//
// Asking at or above the poll rate removes the beat rather than papering over it:
// every request then waits for the next poll, and the poll grid, which is even,
// becomes the pacing. Ceil so 30 ms lands on 34 Hz and not on 33, which would
// beat again the other way.
//
// Only at the ladder's top rate, where the intent is "as fast as this host can
// go". Every rung below it is asking for fewer frames on purpose, and rounding
// those back up to the poll rate would undo the ladder.
const TOP_HZ = RATES[RATES.length - 1];
function rungHz(n) {
  const hz = RUNGS[n].hz;
  const pollHz = metrics.pollMs ? 1000 / metrics.pollMs : 0;
  return hz === TOP_HZ && pollHz > hz ? Math.ceil(pollHz) : hz;
}

function setRung(n) {
  n = Math.max(0, Math.min(TOP, n));
  upHold = downHold = 0;
  if (n === rung) return;
  enteredAt = n > rung ? performance.now() : 0;
  rung = n;
  metrics.rung = n;
  applyQuality();
  streamWant = rungHz(n);
  pushStream();
}

// A rung climbed into and abandoned within twenty seconds was never sustainable.
// Remember it as a ceiling instead of climbing back into it six seconds later:
// without this a marginal link saws between two pictures every eight seconds for
// the whole session, which is worse to watch than either picture.
//
// The ceiling is the whole memory. There used to be a per-rung failure count
// driving an exponential cooldown on top of it, which made a third and fourth
// anti-oscillation loop stacked over the dead band and the asymmetric dwell that
// already do this job - and between them they were what made a ratcheting
// ceiling impossible to recover from. Last rung that failed, minus one, decayed
// on a plain timer.
function failedClimb() {
  if (!enteredAt || performance.now() - enteredAt > 20000) return;
  ceilingRung = Math.max(0, rung - 1);
  ceilingSince = performance.now();
}

// In manual mode the person pinned the quality, and quality is not ours to
// change behind their back - the dropdown would go on reading Sharp over a
// picture we had quietly moved to the cheapest preset. The rate is ours, though:
// asking the host to inject 30 Hz into a device that cannot decode it is our
// doing, not theirs. So the stall rules run in both modes; in manual they move
// the one dial we own, and the pinned rung stays the ceiling for it.
// The rate the pinned pair is allowed up to. Video mode pins no rung, so it is
// not held under whatever rung the ladder happened to be on: it may ask for the
// top of the rate axis, poll-aligned like the ladder's own top.
function ceilHz() {
  return video ? rungHz(TOP) : rungHz(rung);
}

// Where on the rate axis the current ask sits. The top of the axis is the
// poll-aligned rate rather than 30 itself, and that is not in RATES: indexOf
// answered -1 for it, which stepUp read as the bottom and answered with 5 Hz -
// six good seconds at the top of a tuned host bought a drop to five frames.
function rateAt() {
  return streamWant >= TOP_HZ ? RATES.length - 1 : RATES.indexOf(streamWant);
}

function setRate(hz) {
  // Asking for the top of the axis means "as fast as the host goes", which is
  // the aligned rate, not the 30 the axis is written with.
  const top = ceilHz();
  hz = hz >= TOP_HZ ? top : Math.min(hz, top);
  upHold = downHold = 0;
  if (hz === streamWant) return;
  streamWant = hz;
  pushStream();
}

function stepDown(manual, steps) {
  if (!manual) { failedClimb(); setRung(rung - steps); return; }
  const at = rateAt();
  setRate(RATES[Math.max(0, (at < 0 ? RATES.length - 1 : at) - steps)]);
}

function stepUp(manual) {
  // In auto the rung owns both numbers, so a climb also asserts the rate. setRung
  // is a no-op at the top, and without this second line a rate that manual mode
  // walked down - or that the continuous branch zeroed - stayed below the rung
  // for the rest of the session, because the only thing that ever sets the rate
  // in auto is a rung actually changing.
  if (!manual) { setRung(rung + 1); setRate(rungHz(rung)); return; }
  const at = rateAt();
  setRate(RATES[Math.min(RATES.length - 1, (at < 0 ? 0 : at) + 1)]);
}

function govern(dt) {
  const n = frames.n, busyMs = frames.busyMs;
  const bytes = frames.bytes, backlog = frames.backlog, continuous = frames.continuous;
  frames.n = frames.busyMs = frames.bytes = frames.backlog = 0;
  // Cleared with the rest, or a single frame from a server that pushes its own
  // updates would latch the branch below true for the life of the session and
  // hold the rate at zero for ever after.
  frames.continuous = false;

  metrics.fps = dt > 0 ? n / dt : 0;
  metrics.duty = dt > 0 ? Math.min(1, busyMs / (dt * 1000)) : 0;
  metrics.backlogBytes = backlog;
  metrics.rung = rung;
  metrics.ceiling = ceilingRung;
  if (!rfb) return;

  // The video socket carries the picture and TightVNC carries nothing but
  // input, so there is no VNC rate to govern - and the poll alignment below
  // would otherwise ask for one the moment the first /ctl answer lands.
  if (decoder) {
    if (streamWant !== 0) { streamWant = 0; pushStream(); }
    return;
  }

  const now = performance.now();
  // A person has the wheel: the quality is theirs and stays theirs. Everything
  // below still runs, because a stall is not a matter of taste - it just moves
  // the rate rather than the rung.
  const manual = video || $("quality").value !== "auto";

  // Not a rung decision and it waits for nothing: 8 MB of unparsed bytes is a
  // queue heading for the 40 MB cap where Websock throws and takes the session
  // with it. Stop asking for frames and do not think about climbing for a minute.
  if (backlog > KILL_BACKLOG) {
    holdUntil = now + 60000;
    if (manual) setRate(0);
    else { setRung(0); streamWant = 0; pushStream(); }
    // This is the one rule above the hidden-tab return, so it is also the one
    // that can fire while the rate the tab is holding for later is the only rate
    // there is. Coming back must not undo it.
    if (hiddenWant >= 0) hiddenWant = 0;
    return;
  }

  // A background tab's timers fire about once a minute, so every rule here -
  // the kill switch included - would evaluate once a minute while the bridge
  // went on injecting at the last rate it was given. The depth-1 loop used to
  // self-throttle: a viewer that stopped parsing stopped asking. The
  // visibilitychange handler restores that property by dropping the rate to
  // zero, and while it holds it, the rate is not ours to move.
  if (document.hidden) return;

  // A server that pushes frames on its own timetable paces itself, and a second
  // opinion from here would only fight it. TightVNC does not implement the
  // extension so this branch never runs - but it is the one that must not be
  // wrong if some other server ever does.
  if (continuous) {
    if (streamWant !== 0) { streamWant = 0; pushStream(); }
    return;
  }

  // The host's poll rate arrives with the first /ctl answer, which is well after
  // the opening rung set a rate against a poll it did not yet know about. Without
  // this the alignment above would only ever take hold on a rung change, and the
  // session that needs it most is the one where nothing changes: a good link that
  // opens at the top and stays there, beating against the poll grid all day.
  if (metrics.pollMs !== alignedFor) {
    alignedFor = metrics.pollMs;
    if (streamWant && (!manual || (video && streamWant >= TOP_HZ))) setRate(ceilHz());
  }

  const rising = backlog > prevBacklog;
  prevBacklog = backlog;

  // Above the motion gate, both of them: a backlog this size is a stall whatever
  // the frame count, and a second that delivered one frame is exactly how it
  // presents.
  if (backlog > HARD_BACKLOG) { stepDown(manual, 2); return; }

  // The motion gate, and the most important line here. A still desktop delivers
  // nothing forever; a controller that reads that as "the link cannot sustain
  // this" walks to the floor and then hands over the worst picture it has the
  // moment somebody moves a window. Nothing is decided and no dwell counter
  // moves on a quiet second.
  if (bytes < 150000 && n < 3) return;

  // What the host could actually deliver, not what we asked for.
  //
  // pollMs is authoritative where tune-host.cmd has recorded it, and absent -
  // zero - on every host nobody has run it on, which is exactly the one-frame-a-
  // second case this whole change is aimed at. Treating an unknown poll as no
  // ceiling at all measured 1 FPS against 30, read 0.97 short, and walked such a
  // host to the cheapest preset and pinned it there: 1 FPS *and* a blurry
  // picture, where the old tuner had at least given it a sharp one. So where the
  // poll is unknown, the best rate this session has actually delivered is the
  // honest ceiling - and it caps the known-poll case too, since a host can be
  // encode-bound well below its own polling rate.
  if (metrics.fps > bestFps) bestFps = metrics.fps;
  const capHz = Math.min(metrics.pollMs ? 1000 / metrics.pollMs : Infinity, bestFps);
  const target = Math.min(metrics.streamHz || 0, capHz);

  // And a shortfall is only evidence about the rate when the host had frames to
  // send. One 200 KB update in a second clears the motion gate with n = 1, which
  // at 30 Hz reads as 97% short and costs a rung every two seconds - on content
  // that changes once a second with a big delta, which is a photo viewer, a
  // video stepped frame by frame, a slow scroll through images. Duty and backlog
  // stay in force there; they are measurements of this device either way.
  //
  // Three frames, flat. Scaling this with the target inverted the rule it
  // guards: a down-step needs fps below 0.7 of target, so a threshold at a
  // quarter of target left it firing only between those two lines and going
  // quiet again on anything worse - the ladder was then free to climb over a
  // host delivering four frames a second, because four frames were too few to
  // judge. Two frames is a still screen twitching; three in a second is a rate.
  const paced = n >= 3;
  const deficit = target && paced ? 1 - metrics.fps / target : 0;
  const queued = stats.rtt && stats.floor ? stats.rtt - stats.floor : 0;

  if (metrics.duty > 0.85 || (backlog > SOFT_BACKLOG && rising) ||
      deficit > 0.30 || queued > 80) {
    upHold = 0;
    if (++downHold >= DOWN_DWELL) stepDown(manual, 1);
    return;
  }
  downHold = 0;

  // A link that genuinely recovered should not be punished for the rest of the
  // session, so the ceiling earns a step back a minute after it was set. On a
  // plain timer, not on clean seconds: every rung change used to reset that
  // count, so on twitchy content the ceiling could only ever ratchet down.
  if (ceilingRung < TOP && now - ceilingSince > CEILING_DECAY) {
    ceilingRung++;
    ceilingSince = now;
  }

  // Climb only with real headroom on every axis. The gap between 0.55 and the
  // 0.85 above is the dead band, and it is wide enough to swallow the frame to
  // frame variance of JPEG decode on real content; 6 seconds up against 2 down
  // is the same asymmetry the old tuner had, for the same reason - a stalled
  // picture is felt at once and a premature climb just stalls it again.
  if (metrics.duty >= 0.55 || backlog >= 64 * 1024 || deficit >= 0.10 ||
      queued >= 30 || now < holdUntil || (!manual && rung >= ceilingRung)) {
    upHold = 0;
    return;
  }
  if (++upHold < UP_DWELL) return;
  stepUp(manual);
}

/* ------------------------------------------------------ the host's rate -- */

// The bridge sits on loopback, 0 ms from TightVNC, so it can hold the next
// frame request open on our behalf and take this viewer's round trip out of the
// frame loop entirely. All we do is say how fast.
let streamWant = 0;       // the rate the ladder wants
let streamSent = -1;      // the rate the host last acknowledged; -1 is unknown
let streamBusy = false;
let streamOk = true;      // false once a host has proved it has no stream lever
let streamRetryAt = 0;    // do not call again before this
let hiddenWant = -1;      // the rate in force when the tab was hidden; -1 if visible
let streamFails = 0;      // consecutive failures, for the backoff below

function ctlUrl(query) {
  return endpoint.replace(/^wss:/, "https:").replace(/^ws:/, "http:")
                 .replace("/ws?", "/ctl?") + "&" + query;
}

async function pushStream() {
  if (streamBusy || !streamOk || !endpoint) return;
  if (streamWant === streamSent) return;
  // The failure this backs off from is the ordinary one: the host goes away, the
  // disconnect handler asks for stream=0, the fetch hits a tunnel whose hostname
  // no longer resolves and rejects at once. The tail of this function used to
  // re-enter on any mismatch, and -1 never matches anything, so that was a fetch
  // loop with no delay running for the life of the tab behind a card reading
  // "Host offline".
  if (performance.now() < streamRetryAt) return;
  streamBusy = true;
  let failed = false;
  const asked = streamWant;
  // The host needs a framebuffer size to build the request from, and the canvas
  // is where this page already reads that.
  const canvas = screenEl.querySelector("canvas");
  const size = canvas && canvas.width
    ? "&w=" + canvas.width + "&h=" + canvas.height : "";
  try {
    const r = await fetch(ctlUrl("stream=" + asked + size), { cache: "no-store" });
    const body = r.ok ? await r.json().catch(() => null) : null;
    if (body && typeof body.stream === "number") {
      streamSent = body.stream;
      metrics.streamHz = body.stream;
      if (typeof body.pollMs === "number") metrics.pollMs = body.pollMs;
      // The same answer says whether this host has a /video route, which is
      // how the Stream button learns it is pointless here without a probe
      // socket. A host that predates the field says nothing, and nothing is
      // left as "try it" - the failed open then reports itself.
      if (typeof body.video === "boolean" && body.video !== hostVideo) {
        hostVideo = body.video;
        reflectStream();
        if (!hostVideo) streamOff("host");
      }
      streamFails = 0;
      streamRetryAt = 0;
    } else {
      // A host that predates the lever falls through to the share branch and
      // answers 400 for a mode it cannot parse. It is never going to grow the
      // feature mid-session, so stop asking and run the depth-1 loop - which is
      // exactly what this page did before any of this existed.
      streamOk = false;
      streamSent = 0;
      metrics.streamHz = 0;
    }
  } catch (_) {
    // The tunnel having a moment, not a host without the feature. Leave streamOk
    // alone so a later attempt tries again, but do not go on claiming a rate
    // nobody acknowledged - and wait, doubling to half a minute, so a host that
    // is simply gone costs one call every thirty seconds rather than a spin.
    failed = true;
    streamSent = -1;
    metrics.streamHz = 0;
    streamFails++;
    streamRetryAt = performance.now() +
      Math.min(30000, 1000 * Math.pow(2, streamFails - 1));
  }
  streamBusy = false;
  // Only chase the value we still want when the call that just ran actually
  // landed. Retrying out of the failure path is what made the loop.
  if (!failed && streamWant !== streamSent) pushStream();
}

/* ------------------------------------------------------------------ ui -- */

function state(kind, text) {
  $("state").className = kind;
  $("stateText").textContent = text;
}

// One overlay, reused for the key prompt, the VNC password and every dead end.
function veil(html, onReady) {
  const el = document.createElement("div");
  el.id = "veil";
  el.innerHTML = '<div class="card">' + html + "</div>";
  const old = $("veil");
  if (old) old.remove();
  screenEl.appendChild(el);
  // A card with a text field under a captured pointer is a card nobody can
  // click. Whatever put it there, the lock goes.
  if (document.pointerLockElement) document.exitPointerLock();
  if (onReady) onReady(el);
}

function hideVeil() {
  const el = $("veil");
  if (el) el.remove();
}

function askToken(message) {
  veil(
    "<h2>Access key</h2>" +
    "<p>Paste the key the host printed when it started casting.</p>" +
    (message ? '<div class="err">' + esc(message) + "</div>" : "") +
    '<input type="password" id="gateInput" placeholder="Access key" autocomplete="off" spellcheck="false">' +
    '<button id="gateGo">Connect</button>',
    (el) => {
      const input = el.querySelector("#gateInput");
      const go = () => {
        const v = input.value.trim();
        if (!v) return;
        token = v;
        store.set("castToken", v);
        start();
      };
      el.querySelector("#gateGo").addEventListener("click", go);
      input.addEventListener("keydown", (e) => { if (e.key === "Enter") go(); });
      input.focus();
    }
  );
}

function askPassword(message) {
  veil(
    "<h2>Screen password</h2>" +
    "<p>The VNC password set on the host machine.</p>" +
    (message ? '<div class="err">' + esc(message) + "</div>" : "") +
    '<input type="password" id="pw" placeholder="Password" autocomplete="off">' +
    '<button id="pwGo">Unlock</button>',
    (el) => {
      const input = el.querySelector("#pw");
      const go = () => {
        password = input.value;
        store.set("castPass", password);
        needPassword = false;
        if (rfb) { hideVeil(); rfb.sendCredentials({ password: password }); }
        else start();
      };
      el.querySelector("#pwGo").addEventListener("click", go);
      input.addEventListener("keydown", (e) => { if (e.key === "Enter") go(); });
      input.focus();
    }
  );
}

// Every dead end here is recoverable and none of them are the viewer's fault -
// a tunnel rotating, a lid closing, wifi changing its mind - so all of them
// retry. The button is still there to skip the wait rather than to start the
// only attempt that will ever happen.
// `final` is for the one answer that retrying cannot improve: the owner has
// blocked this device. Everything else here is a blip worth waiting out, so it
// keeps the countdown and the button.
// `extra` is markup for a card that can do more than wait - the one that can
// wake the host - and `onReady` wires it once it is on screen.
function problem(title, detail, final, extra, onReady) {
  if (final) { clearTimeout(retry); retry = null; }
  const wait = final ? 0 : scheduleRetry();
  veil(
    "<h2>" + esc(title) + "</h2><p>" + esc(detail) + "</p>" +
    (extra || "") +
    (final ? "" :
      '<button id="retryGo">Try now</button>' +
      '<div class="foot"></div>'),
    (el) => {
      if (onReady) onReady(el);
      const b = el.querySelector("#retryGo");
      if (b) b.addEventListener("click", start);
      if (final) return;
      // A number that does not move reads as a page that has given up, which is
      // the exact impression a drop nobody can explain does not need. Count it
      // down, and say how many goes it has had: the difference between a blip
      // and a host that has been off for an hour is in that figure.
      const foot = el.querySelector(".foot");
      const due = Date.now() + wait;
      const tick = () => {
        if (!el.isConnected) return clearInterval(t);
        foot.textContent = retryFoot(due - Date.now(), attempts);
      };
      const t = setInterval(tick, 1000);
      tick();
    }
  );
}

// Backing off matters because a host that is simply off stays off for hours, and
// a fixed 4s meant a page left open overnight asked the API twenty thousand
// times. Starts quick, because most drops are a blip that is already over, and
// never stops: the only dead end is being blocked, and every other card retries
// for as long as the tab is open.
let backoff = 4000;
let attempts = 0;             // retries since the link last worked

const nextBackoff = (ms) => Math.min(Math.round(ms * 1.6), 30000);
const retryFoot = (left, n) =>
  "Reconnecting in " + Math.max(0, Math.ceil(left / 1000)) + "s…" +
  (n > 1 ? " (attempt " + n + ")" : "");

function scheduleRetry() {
  const wait = backoff;
  clearTimeout(retry);
  retry = setTimeout(start, wait);
  backoff = nextBackoff(backoff);
  attempts++;
  return wait;
}

/* -------------------------------------------------------- remote start -- */

// What the "nobody is casting" card says depends on what the site knows about
// the host. It only knows anything for the right key: an agent on the host
// checking in, and whether a wake has already been asked for. `agent` is the
// host's name, which may be blank, so the test is for presence, not truth.
function offlineCard(body) {
  if (body.agent == null) {
    return { detail: "Run the host script on the machine you want to reach.", button: "" };
  }
  const name = body.agent || "the host";
  if (body.want === "start") return { detail: "Waking " + name + "…", button: "" };
  return { detail: "The machine is on and listening. Start it from here.",
           button: "Start casting on " + name };
}

// Ask the site to pass a wish to the host's agent. The view key is the whole
// credential: it cannot move the cast anywhere, so the worst it can do is
// switch the owner's own screen on and off.
async function wish(want) {
  const res = await fetch("/api/cast?t=" + encodeURIComponent(token) + "&want=" + want, {
    method: "PUT",
    cache: "no-store",
    signal: AbortSignal.timeout ? AbortSignal.timeout(15000) : undefined,
  });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.detail || body.error || "HTTP " + res.status);
  return body;
}

function offline(body) {
  const card = offlineCard(body);
  if (body.agent != null) hostName = body.agent || "";
  problem("Nobody is casting", card.detail, false,
    card.button ? '<div class="err" hidden></div><button id="wakeGo">' + esc(card.button) + "</button>" : "",
    (el) => {
      const b = el.querySelector("#wakeGo");
      if (!b) return;
      b.addEventListener("click", async () => {
        b.disabled = true;
        b.textContent = "Asking…";
        try {
          await wish("start");
        } catch (e) {
          // The agent may have gone since the card was drawn, or the network
          // with it. Say so on this card and leave the button to try again.
          const err = el.querySelector(".err");
          err.textContent = String(e.message || e);
          err.hidden = false;
          b.disabled = false;
          b.textContent = card.button;
          return;
        }
        // The host takes ten seconds or so to appear. The retry loop is what
        // will find it, so start it patient again rather than leave it sitting
        // on a thirty-second wait it earned while the host was off, and let the
        // next lookup redraw this card as "Waking…" from what the site now says.
        backoff = 4000;
        attempts = 0;
        start();
      });
    });
}

/* ------------------------------------------------------------- connect -- */

async function start() {
  clearTimeout(retry);
  retry = null;
  manualStop = false;
  needPassword = false;
  hideVeil();

  if (DIRECT) return connect();
  if (!token) return askToken("");

  state("wait", "Looking for the host…");
  try {
    // A lookup that never answers - a laptop half awake, a captive portal
    // swallowing the request - is a page stuck on "Looking for the host…" with
    // no retry armed and nothing to bring it back. Give it a deadline, and the
    // failure lands on the same card and the same backoff as every other.
    const res = await fetch("/api/cast?t=" + encodeURIComponent(token), {
      cache: "no-store",
      signal: AbortSignal.timeout ? AbortSignal.timeout(15000) : undefined,
    });
    const body = await res.json().catch(() => ({}));

    if (res.status === 401) {
      store.drop("castToken");
      token = "";
      state("bad", "Wrong key");
      return askToken("That key does not match the host.");
    }
    if (res.status === 403) {
      state("bad", "Blocked");
      return problem("Blocked", body.detail || "The owner has blocked this device.", true);
    }
    if (res.status === 404) {
      state("wait", "Host offline");
      return offline(body);
    }
    if (!res.ok) throw new Error(body.error || "HTTP " + res.status);
    // The registry is meant to hand back a tunnel, and the page is about to send
    // it the VNC password. Check the shape before trusting it: /api/cast enforces
    // this too, but nothing costs less than refusing to open a socket the site
    // should never have named.
    if (!/^wss:\/\//i.test(String(body.url || ""))) {
      state("bad", "Bad endpoint");
      return problem("The site returned an address to refuse",
        "A cast endpoint must be a wss:// tunnel. Restart the host and try again.");
    }
    // Naming this tab on the socket URL is what lets /ctl move this bridge alone;
    // ctlUrl is built from the same string, so it carries the id for free.
    endpoint = body.url + "&v=" + VIEWER;
    hostName = body.name || "";
    if (body.name) document.title = "Cast - " + body.name;
  } catch (e) {
    // Almost always the viewer's own network rather than the site: a lid closing,
    // wifi handing over, a tunnel mid-rotation. Giving up here was what turned a
    // three-second blip into a dead page waiting for a click.
    state("bad", "Lookup failed");
    problem("Could not reach the site API", String(e.message || e));
    return;
  }

  connect();
}

function connect() {
  state("wait", "Connecting…");
  if (rfb) { try { rfb.disconnect(); } catch (_) {} rfb = null; }
  // A reconnect can be to a different tunnel entirely. Carrying the old floor
  // over would read the new host's distance as congestion for the minute or so
  // the floor needs to catch up.
  //
  // Tear the probe down before clearing them, not after. The old session's
  // disconnect handler is guarded by current(), which is already false on this
  // path, so it never reaches its own closePing - leaving a healthy socket that
  // goes on writing the old tunnel's samples straight back into the numbers this
  // line just reset, for the whole length of the new handshake.
  closePing();
  stats.rtt = 0;
  stats.floor = 0;
  // A new bridge knows nothing of what the last one was told, and none of what
  // the last host proved about itself is evidence about this one. streamOk in
  // particular used to be a one-way latch for the life of the tab: one tunnel
  // rotation onto a host that answered without a `stream` field, or a single
  // transient non-JSON 400, and the page ran the depth-1 loop for ever after
  // with no way back short of a reload.
  streamSent = -1;
  streamOk = true;
  streamFails = 0;
  streamRetryAt = 0;
  hiddenWant = -1;
  bestFps = 0;
  prevBacklog = 0;
  metrics.pollMs = 0;
  // The video socket belongs to the session it was opened against - a fresh
  // one is opened once the new RFB is up, if the toggle is still on.
  closeVideo();
  hostVideo = true;
  vidTried = false;

  // Building the socket here rather than handing RFB a URL is what makes the link
  // readout possible: noVNC replaces the onmessage property, but a listener added
  // with addEventListener still fires, so bytes can be counted without reaching
  // into its internals. It must still be CONNECTING when RFB takes it, because
  // RFB waits for the open event.
  let sock;
  try {
    sock = new WebSocket(endpoint, ["binary"]);
  } catch (e) {
    state("bad", "Bad endpoint");
    return problem("Could not open the connection", String(e.message || e));
  }
  sock.binaryType = "arraybuffer";
  sock.addEventListener("message", (e) => {
    stats.window += (e.data && e.data.byteLength) || 0;
  });

  // noVNC's disconnect event says only clean or not, and "not clean" covers both
  // the host hanging up rudely and the link being cut underneath us. The socket's
  // own close code separates them - 1006 with no reason is nothing on either end
  // deciding anything, it is the tunnel or the network - and a drop nobody can
  // find a pattern in is the case that most needs that written down.
  let closeInfo = "";
  sock.addEventListener("close", (e) => {
    closeInfo = e.code ? " (" + e.code + (e.reason ? ": " + e.reason : "") + ")" : "";
  });

  // Only hand over a password we actually have. Passing an empty string counts as
  // a real credential, so noVNC would attempt auth with it, get refused, and greet
  // a first-time viewer with "the host refused that password" before they typed
  // anything. With none supplied it asks properly instead.
  const me = new RFB(screenEl, sock,
    password ? { credentials: { password: password } } : {});
  rfb = me;
  me.background = "#000";
  me.focusOnClick = true;
  me.showDotCursor = true;
  applyQuality();
  applyFit();
  me.viewOnly = $("look").classList.contains("on");

  // Every handler below belongs to `me` and must refuse to speak for anything
  // else. RFB.disconnect() is not synchronous - it closes the socket and the
  // disconnect event arrives a task later - so a session we tore down still has
  // one event left to fire, and by then `rfb` is its replacement. Without this
  // guard the dead session nulls the live one: the toolbar goes inert, focus()
  // throws inside the connect handler so the keyboard and the ping probe never
  // start, and the phantom retry below builds a second session on top of the
  // first. Reconnect made that happen every single time on the LAN path.
  const current = () => rfb === me;

  me.addEventListener("connect", () => {
    if (!current()) return;
    hideVeil();
    state("live", "Connected");
    backoff = 4000;          // this link works; the next blip starts patient again
    attempts = 0;
    me.focus();
    openPing();
    startStats();
    // Only now: the request the host builds needs a framebuffer size, and the
    // canvas that carries it does not exist until the session is up.
    //
    // A session can come up while the tab is in the background - a retry that
    // fired after somebody switched away - and asking a hidden tab's bridge to
    // inject is the thing the visibilitychange handler exists to stop. Nothing
    // there would have caught it: it only runs on a change, and there is none.
    streamWant = document.hidden ? 0 : ceilHz();
    pushStream();
    // The VNC rate above is not wasted: it is the picture until the first
    // keyframe decodes, and the config message takes it back to zero.
    reflectStream();
    openVideo();
  });

  // What the controller runs on. One event per completed update, carrying what
  // it cost - and the guard matters as much here as anywhere: a torn-down
  // session still has events in flight, and counting them would credit the live
  // session with the dead one's frames.
  me.addEventListener("framebufferupdate", (e) => {
    if (current() && e.detail) onFrame(e.detail);
  });

  me.addEventListener("credentialsrequired", () => {
    if (!current()) return;
    state("wait", "Password needed");
    needPassword = true;
    askPassword(password ? "That password was rejected." : "");
  });

  // noVNC fires this and then immediately fails the connection, so without the
  // flag the disconnect handler below would replace the password card with
  // "Connection dropped" and start retrying - leaving nowhere to type.
  me.addEventListener("securityfailure", (e) => {
    if (!current()) return;
    store.drop("castPass");
    password = "";
    needPassword = true;
    state("bad", "Rejected");
    askPassword((e.detail && e.detail.reason) || "The host refused that password.");
  });

  me.addEventListener("disconnect", (e) => {
    if (!current()) return;
    rfb = null;
    closePing();
    stopStats();
    closeVideo();
    // The rate is remembered by the bridge, not by the connection, so a rate
    // this viewer chose would otherwise be waiting for whoever connects next.
    streamWant = 0;
    pushStream();
    if (manualStop || needPassword) return;
    // A clean close is the host hanging up; anything else is usually the tunnel
    // rotating out from under us, which a fresh /api/cast lookup fixes.
    state("bad", "Disconnected");
    problem("Connection dropped",
      ((e.detail && e.detail.clean) ? "The host ended the session."
                                    : "Lost the link to the host.") + closeInfo);
  });

  // Copying on the remote machine puts it on this device's clipboard. The other
  // direction is the paste handler further down.
  me.addEventListener("clipboard", (e) => {
    if (!current()) return;
    if (e.detail && e.detail.text && navigator.clipboard) {
      navigator.clipboard.writeText(e.detail.text).catch(() => {});
    }
  });
}

/* ------------------------------------------------------------ controls -- */

// noVNC listens for keys on its canvas, so a canvas without DOM focus is a dead
// keyboard - and nothing on screen says so, which is why it reads as "the cast
// froze" or "it only works half the time". Every way focus can leave the canvas
// has to put it back.
function refocus() {
  // A card is up: the access key or password field is where typing belongs, and
  // pulling focus to the canvas would leave the viewer unable to type into it.
  if (!rfb || $("veil")) return;
  const canvas = screenEl.querySelector("canvas");
  if (document.activeElement === canvas) return;
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  rfb.focus();
}

// Cheaper than taking focus back afterwards: a toolbar button that never takes
// focus cannot swallow the next Space or Enter either. Only buttons - the selects
// and the labels wrapping them need their default mousedown to drop open.
$("bar").addEventListener("mousedown", (e) => {
  if (e.target.closest("button")) e.preventDefault();
});

// "Fit" leaves black bars beside the desktop whenever the aspect ratios differ,
// and a click there lands on the container rather than the canvas. noVNC only
// grabs focus for clicks on the canvas itself, so those clicks were silently
// switching the keyboard off.
screenEl.addEventListener("mousedown", (e) => {
  if (e.target.closest("#veil")) return;
  // Moving focus is mousedown's own default action, and it runs after this
  // listener - so focusing from in here just gets undone, which left the bug this
  // was added to fix still live. preventDefault would stop that but would also
  // kill scrollbar dragging on the 1:1 view, so let the browser finish and take
  // focus back on the next task instead.
  setTimeout(refocus, 0);
});

// Fullscreen moves focus to the element being promoted, and coming back from
// another tab or window does not always restore it either.
document.addEventListener("fullscreenchange", () => {
  refocus();
  // Ctrl+W, Ctrl+T, Alt+Tab and Escape never reach the canvas otherwise - the
  // browser claims them first, so pressing Ctrl+W at the remote machine closes
  // this tab instead. Keyboard lock hands them over, and browsers only allow it
  // in fullscreen, which is why it lives here. Exiting still works: the toolbar
  // stays on screen, and holding Escape is the browser's own way out.
  if (!navigator.keyboard || !navigator.keyboard.lock) return;
  if (document.fullscreenElement) navigator.keyboard.lock().catch(() => {});
  else navigator.keyboard.unlock();
});
// The other side of keyboard lock. Handing the Windows key to the remote machine
// is the point, but two of the combos it unlocks put Windows into Snipping Tool:
// the screen dims, the pointer becomes a crosshair, and every key is swallowed
// until Escape. Win+Shift+S is easy to hit reaching for Shift+S, and Windows 11
// maps bare PrintScreen to the same thing. Neither is worth reaching the host -
// to capture the remote screen, screenshot this window instead.
//
// Capture phase on document, so this runs before noVNC's own handler on the
// canvas. keyup is swallowed with it: sending a keyup for a key the host never
// saw pressed is how modifiers get stuck down.
function isSnipKey(e) {
  return e.key === "PrintScreen" ||
         (e.metaKey && e.shiftKey && (e.key === "s" || e.key === "S"));
}
for (const type of ["keydown", "keyup"]) {
  document.addEventListener(type, (e) => {
    if (!isSnipKey(e)) return;
    e.preventDefault();
    e.stopImmediatePropagation();
  }, true);
}

/* ----------------------------------------------------------- mouse lock -- */

// What a game wants and a desktop does not: the pointer stays inside the remote
// screen, there is no local cursor drifting onto another monitor mid-turn, and
// movement is sent as movement - see relativePointer in novnc.js, which also
// records what that cannot do at the edges of the remote screen.
//
// noVNC listens on the canvas, so the canvas is what gets locked; locking the
// container would leave every mouse event landing on an element noVNC never
// hears from.
function lockTarget() {
  return rfb ? screenEl.querySelector("canvas") : null;
}

// The button holds the intent, not the lock. Browsers hand the lock back on
// Escape and refuse to take it again without a fresh click, so an armed button
// and a click on the screen is the only shape that survives that.
function armed() { return $("grab").classList.contains("on"); }

function takeLock() {
  const canvas = lockTarget();
  if (!canvas || $("veil") || !armed()) return;
  if (document.pointerLockElement === canvas) return;
  const p = canvas.requestPointerLock();
  if (p && p.catch) p.catch(() => {});
}

function setGrab(on) {
  $("grab").classList.toggle("on", on);
  if (on) takeLock();
  else if (document.pointerLockElement) document.exitPointerLock();
}

$("grab").addEventListener("click", () => { setGrab(!armed()); refocus(); });

// Capture phase: noVNC stops propagation on the canvas, so a bubbling listener
// on the container never sees a click that landed on the desktop itself - which
// is every click that matters here.
screenEl.addEventListener("mousedown", () => { takeLock(); }, true);

document.addEventListener("pointerlockchange", () => {
  const held = document.pointerLockElement === lockTarget();
  if (rfb) rfb.relativePointer = held;
  $("grab").classList.toggle("held", held);
  refocus();
});

/* ------------------------------------------------------------ clipboard -- */

// Copy here, paste there. Ctrl+V has to do two things in order - put the text on
// the host's clipboard, then ask the host to paste - and the host must not see
// the keystroke until the text has arrived, or it pastes whatever it had before.
//
// So the key is taken away from noVNC and sent back synthetically once the text
// is on its way. The `paste` event is what carries the text: reading the
// clipboard through navigator.clipboard.readText() needs a permission prompt,
// while the event hands the same string over for free - but only if the key is
// left to do its normal job, which is why nothing here calls preventDefault on
// the keydown.
function isPasteKey(e) {
  if (e.shiftKey && e.key === "Insert") return true;
  return (e.ctrlKey || e.metaKey) && !e.altKey && (e.key === "v" || e.key === "V");
}

// Capture on document, ahead of noVNC's own handler on the canvas. keyup goes
// with it for symmetry; noVNC ignores a release for a key it never saw pressed.
for (const type of ["keydown", "keyup"]) {
  document.addEventListener(type, (e) => {
    if (!rfb || $("veil") || !isPasteKey(e)) return;
    e.stopImmediatePropagation();
  }, true);
}

document.addEventListener("paste", (e) => {
  // A card is up: that paste belongs in the password field.
  if (!rfb || $("veil")) return;
  const text = e.clipboardData && e.clipboardData.getData("text/plain");
  if (!text) return;
  e.preventDefault();
  rfb.clipboardPasteFrom(text);

  // Both messages travel this one socket in order, but TightVNC hands the text
  // to Windows on another thread, so a keystroke sent in the same breath can
  // beat it there and paste the previous contents. A beat costs nothing on a
  // paste and turns an intermittent wrong-text bug into no bug.
  //
  // The whole combo is synthesised rather than leaning on the Ctrl the viewer is
  // physically holding: by the time this fires they may have let go, and a lone
  // "v" would be typed into their document instead. The cost is that the host
  // sees Ctrl released here, so a Ctrl held down for something else afterwards
  // needs pressing again.
  setTimeout(() => {
    if (!rfb) return;
    rfb.sendKey(0xffe3, "ControlLeft", true);
    rfb.sendKey(0x76, "KeyV");
    rfb.sendKey(0xffe3, "ControlLeft", false);
  }, 60);
});

window.addEventListener("focus", refocus);
// A hidden tab has its timers throttled to about once a minute, so a drop that
// happened while you were elsewhere is still sitting on a retry that has not
// fired. Coming back is the moment to stop waiting. The same goes for the network
// coming back: the retry it interrupted may have half a minute left to run.
//
// Only when a retry is actually pending, though. "No session" also describes a
// page sitting on the access-key card, and restarting that from under someone
// who switched tabs to copy the key wiped what they had typed - and a lookup
// already in flight is not improved by a second one racing it.
function hurry() {
  if (retry) start();
}
document.addEventListener("visibilitychange", () => {
  // A hidden tab keeps the injector and loses the controller: timers here are
  // throttled to roughly one fire a minute, so every down-step and the kill
  // switch itself would evaluate once a minute while the bridge went on sending
  // at the last rate it was given. Before any of this the depth-1 loop
  // self-throttled - a viewer that stopped parsing stopped asking - and this is
  // how that comes back. It also stops paying for a tunnel nobody is watching.
  //
  // What comes back is the rate that was in force, not the rung's rate. Those
  // differ exactly when something other than the ladder had lowered it - manual
  // mode, where the rung is whatever the person pinned and the rate is the only
  // dial the controller owns, and the kill switch, which sets zero and freezes
  // climbing for a minute. Restoring the rung's rate there handed a struggling
  // session its full rate back for a tick just because somebody changed tabs.
  if (rfb) {
    if (document.hidden) {
      if (hiddenWant < 0) hiddenWant = streamWant;
      streamWant = 0;
    } else {
      streamWant = hiddenWant < 0 ? ceilHz() : hiddenWant;
      hiddenWant = -1;
    }
    pushStream();
    // The same for the video socket: sixty encoded frames a second into a tab
    // nobody is looking at is the tunnel and the GPU paid for nothing, and the
    // decoder's queue would only grow against a throttled output. The RFB
    // pixels stay off across the gap - the socket comes straight back.
    if (document.hidden) closeVideo();
    else openVideo();
  }
  if (document.hidden) return;
  // The browser drops a wake lock with the tab; take it again with the tab.
  if (video) holdAwake(true);
  refocus();
  hurry();
});
window.addEventListener("online", hurry);

// The rung is the single source of both numbers, whether a person picked it or
// the controller did, so there is one path to apply and one place to read.
//
// setQuality rather than the two setters: each of qualityLevel and
// compressionLevel sends a full SetEncodings on its own, and every rung change
// moves both - so this used to send the ~25-entry list twice back to back, and a
// Tight server may discard its per-client encoder state on each one. Two fresh
// full regions, at exactly the moment the controller decided the link was
// struggling: a visible hitch caused by the attempt to avoid one.
function applyQuality() {
  if (!rfb) return;
  const q = video ? VIDEO : RUNGS[rung];
  rfb.setQuality(q.quality, q.compression);
}

// Which rung a dropdown entry pins. Several rungs share a quality pair, so this
// used to scan the table for the highest match - picking Sharp being a request
// for the best picture rather than the slowest version of it. The table names
// its own presets now, so the answer is read rather than reconstructed.
function rungForPreset(value) {
  const i = RUNGS.findIndex((r) => r.preset === value);
  return i < 0 ? rung : i;
}

// Fit scales the desktop into the window. Off renders 1:1 and lets noVNC's own
// screen div scroll, so ordinary scrollbars pan - which beats drag-panning, where
// a drag to pan is a drag you did not mean to send to the remote machine.
function applyFit() {
  if (!rfb) return;
  rfb.scaleViewport = $("fit").classList.contains("on");
  rfb.clipViewport = false;
  rfb.dragViewport = false;
}

// Picking a quality by hand pins a rung - both numbers and the rate - and the
// controller stops proposing while it is pinned. Streaming stays on at that
// rung's rate: turning it off here would make the picture choppier at the moment
// somebody asked for a better one, and the escape hatch for a host without the
// lever is pushStream's own fallback, not this control. Back on Auto, the ladder
// carries on from wherever the manual choice left it rather than jumping.
$("quality").addEventListener("change", () => {
  const picked = $("quality").value;
  if (picked === "auto") { upHold = downHold = 0; }
  else setRung(rungForPreset(picked));
  applyQuality();
  refocus();
});

// Switching monitors is a host-side change, so it goes to the bridge's control
// endpoint. The session key already in the endpoint URL is what authorises it.
$("share").addEventListener("change", async () => {
  if (!endpoint) return;
  const ctl = ctlUrl("share=" + encodeURIComponent($("share").value));
  state("wait", "Switching screen…");
  try {
    const r = await fetch(ctl, { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
  } catch (_) {
    state("bad", "Could not switch screen");
    refocus();
    return;
  }
  // The shared area is now a different size. Rather than hope the desktop-resize
  // path is handled everywhere, take the reliable route: the password is already
  // cached, so reconnecting costs a second and always lands in a correct state.
  manualStop = true;
  if (rfb) { try { rfb.disconnect(); } catch (_) {} rfb = null; }
  setTimeout(start, 250);
});

$("fit").addEventListener("click", () => {
  $("fit").classList.toggle("on");
  applyFit();
  refocus();
});

/* ---------------------------------------------------------- video mode -- */

// Everything a person watching a video wants and a person driving a desktop
// does not: the video pair pinned, the toolbar out of the way, Fit on so the
// whole picture is in view, and the screen kept awake - a tab that only ever
// receives frames gives the OS no reason not to dim it. The quality dropdown is
// disabled rather than moved, so it still reads what it will go back to.
let wake = null;
let idleTimer = 0;

async function holdAwake(on) {
  if (!on) {
    if (wake) { wake.release().catch(() => {}); wake = null; }
    return;
  }
  if (wake || document.hidden || !navigator.wakeLock) return;
  try {
    wake = await navigator.wakeLock.request("screen");
    wake.addEventListener("release", () => { wake = null; });
  } catch (_) {}
}

function stir() {
  if (!video) return;
  document.body.classList.remove("idle");
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => {
    if ($("bar").matches(":hover")) { stir(); return; }
    document.body.classList.add("idle");
  }, 2500);
}
document.addEventListener("mousemove", stir, { passive: true });
document.addEventListener("touchstart", stir, { passive: true });

$("video").addEventListener("click", () => {
  video = $("video").classList.toggle("on");
  document.body.classList.toggle("video", video);
  $("quality").disabled = video || !!decoder;
  if (video && !$("fit").classList.contains("on")) {
    $("fit").classList.add("on");
    applyFit();
  }
  applyQuality();
  // Off a pinned pair the rate is the ladder's again; on it, the axis opens up
  // to the top whatever rung the ladder was holding. Under Stream there is no
  // VNC rate to move, but the bitrate the encoder was asked for changes.
  if (rfb) { if (decoder) openVideo(); else setRate(ceilHz()); }
  holdAwake(video);
  if (video) stir();
  else { clearTimeout(idleTimer); document.body.classList.remove("idle"); }
  refocus();
});

/* -------------------------------------------------------------- stream -- */

// TightVNC ships the screen as compressed stills, and a game or a video changes
// every pixel every frame: the ladder tops out around twenty of those a second
// however good the link. The host has a hardware video encoder and this browser
// has a hardware decoder, so Stream takes the picture off RFB altogether: the
// bridge fans the encoder's output over a second socket, WebCodecs decodes it,
// and each frame is painted into the very canvas noVNC owns. That last part is
// what keeps everything else untouched - Fit, Fullscreen, Mouse lock and every
// coordinate the mouse sends are the canvas's, and RFB stays connected for
// input with its own frame requests switched off (rfb.pixels).
//
// Opt-in and remembered across reloads rather than the default, because text
// through an encoder tuned for latency is softer than Tight's lossless regions.
// Every failure path lands on the same fallback: the VNC pixels come back, the
// ladder resumes, and the state line says why.
const STREAM_KEY = "cast.stream";
const STREAM_TITLE = $("stream").title;
const LAG_QUEUE = 8;
let stream = false;      // the toggle, as the person left it
let hostVideo = true;    // false once /ctl said this host has no video route
let vidSock = null;
