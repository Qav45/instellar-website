  const to = from && !settled ? streamNext(vidSupported || [], Array.from(vidBad), from) : "";
  if (to) {
    vidBad.add(from);
    // Forget it as the codec to start on as well. A struck codec still sitting
    // in localStorage would lead the ask again on the very next visit and fail
    // again, which is the once-a-session fallback this ordering exists to stop.
    try { if (localStorage.getItem(CODEC_KEY) === from) localStorage.removeItem(CODEC_KEY); } catch (_) {}
    if (vidWant === from) vidWant = "";
    chooseCodecs();
    vidNote = " after " + from + " was " + why;
    state("live", "DECODER+: " + from + " " + why + ", switching to " + to);
    openVideo();
    return;
  }
  if (!from || detail || vidStep + 1 >= STREAM_STEPS.length) {
    streamOff("decode", 0, detail || why);
    return;
  }
  streamPace(why);
}

// One step down the ladder and round again. The hardware preference comes back
// with it: a decoder that would not take the last pace may well take this one,
// and that is the whole reason to step rather than reach for software.
function streamPace(why) {
  // A step that strained again this soon after being asked for back is one
  // this session cannot hold; stop climbing to it.
  if (vidUp && performance.now() - vidUp < PROBATION_MS) vidCeil = vidStep + 1;
  vidStep++;
  vidSoft = false;
  vidNote = " at " + STREAM_STEPS[vidStep].fps + " fps after " + why;
  state("live", "DECODER+: " + why + ", retrying at " + STREAM_STEPS[vidStep].fps + " fps");
  openVideo();
}

// Strike the taller picture this session is trying, if that is what is
// running, and go back to the rung that was carrying the stream before it.
function streamShorter(what) {
  if (!vidMaxhWant || vidMaxh !== vidMaxhWant) return false;
  vidMaxhBad = vidMaxhWant;
  vidMaxhWant = 0;
  vidMaxhOk = STREAM_HEIGHTS.filter((h) => h < vidMaxhBad).pop() || STREAM_BASE_HEIGHT;
  try { localStorage.setItem(HEIGHT_KEY, String(vidMaxhOk)); } catch (_) {}
  vidNote = " after " + vidMaxhBad + "p was " + what;
  state("live", "DECODER+: " + vidMaxhBad + "p " + what + ", back to " + vidMaxhOk + "p");
  openVideo();
  return true;
}

// The link is losing frames the decoder never saw. Fewer bytes is the answer,
// so a taller rung being tried goes first and then the pace ladder, which asks
// for fewer frames and fewer bits; the codec did nothing wrong and is not
// struck. At the bottom step there is nothing cheaper to ask for, and the
// strain goes on holding off every step up and upgrade.
function streamThin(why) {
  if (streamShorter(why)) return;
  if (vidStep + 1 < STREAM_STEPS.length) streamPace(why);
}

// The decoder would not take this stream, either at configure time or a moment
// later. Try an easier one before trying a slower way of decoding this one,
// and only call it an error when both are spent.
function streamRefused(detail) {
  // Except when what was refused is the upgrade this session just reached for.
  // That is not a pace problem and there is nothing to learn from walking the
  // ladder down on it: the safe codec was carrying this same stream at this
  // same pace seconds ago. Strike it and go straight back.
  const up = streamFamily(vidCodec);
  if (up && up === vidWant) {
    vidBad.add(up);
    vidWant = "";
    chooseCodecs();
    vidNote = " after " + up + " was refused";
    state("live", "DECODER+: " + up + " refused, back to " +
          streamNext(vidSupported || [], Array.from(vidBad), up));
    openVideo();
    return;
  }
  // Or what was refused is the taller picture this session just reached for,
  // which is the exact failure the cap exists for: 1080p60 H.264 is level 4.2
  // and a built-in decoder that stops below it refuses the configure outright
  // rather than falling back. Same answer as for a codec - strike the size,
  // stop asking for it here and on the next visit, and go back to the one that
  // was carrying this same stream seconds ago. Ahead of the pace ladder,
  // because walking the pace down would be answering a question nobody asked:
  // the frames were never the problem.
  if (streamShorter("refused")) return;
  if (vidStep + 1 < STREAM_STEPS.length) { streamPace("the decoder refused it"); return; }
  if (!vidSoft) {
    vidSoft = true;
    state("live", "DECODER+: retrying without the hardware preference");
    openVideo();
    return;
  }
  streamDowngrade("decoder error", detail);
}

// The safe codec has carried the picture cleanly for long enough to say the
// decoder and the link are both fine, so spend one encoder restart finding out
// whether the richer codec is real on this machine. A desktop that decodes AV1
// in hardware reaches it and has it remembered for next time; a machine that
// only appeared to gets the strike, comes straight back, and is not asked
// again this session. Once per session, and only at full pace - asking a
// machine that is already paced down to do something harder is the wrong
// question.
function streamUpgrade(to) {
  vidUpgraded = true;
  vidWant = to;
  chooseCodecs();
  vidNote = "";
  state("live", "DECODER+: steady, trying " + to);
  openVideo();
}

// The picture has been carried cleanly for long enough to say this decoder
// takes it at this size, so spend one encoder restart asking whether it takes
// the next size up. The same bargain as the codec upgrade above and for the
// same reason: what a screen can show is not what its decoder will accept, and
// decoded frames are the only honest evidence of the difference. A refusal is
// caught in streamRefused, which strikes the size and comes straight back.
// Only at full pace, since asking a machine that is already paced down to do
// something harder is the wrong question.
function streamGrow() {
  // Not on a decoder that is already doing it in software. vidSoft is the
  // hardware preference having been refused here, and a software decoder that
  // is keeping up with 720p60 is the last thing to hand twice the pixels to:
  // what it would cost is the pace ladder, which is frames rather than rows.
  if (vidSoft) return;
  const to = streamTaller(vidRows(), vidMaxh, vidMaxhBad);
  if (!to) return;
  vidMaxhWant = to;
  vidNote = "";
  state("live", "DECODER+: steady, trying " + to + "p");
  openVideo();
}

// The scene calmed down. A step is asked for back rather than kept for the
// session, or one hard minute in a game would leave the rest of it at twenty
// frames. Climbing costs an encoder restart, so it is one step at a time, and
// a step that fails on probation is not tried again.
function streamRecover() {
  vidStep--;
  vidUp = performance.now();
  vidNote = " at " + STREAM_STEPS[vidStep].fps + " fps";
  state("live", "DECODER+: steady, back to " + STREAM_STEPS[vidStep].fps + " fps");
  openVideo();
}

// Tear down the socket and decoder and nothing else: the RFB pixels stay as
// they are, which is what a hidden tab and a reconnect both want.
function closeVideo() {
  clearTimeout(vidTimer);
  if (vidRaf) { cancelAnimationFrame(vidRaf); vidRaf = 0; }
  vidReady = false;
  if (vidSock) { const s = vidSock; vidSock = null; try { s.close(); } catch (_) {} }
  if (decoder) { const d = decoder; decoder = null; try { d.close(); } catch (_) {} }
  streamFlush();
  vidHz = 0;
  vidEncoder = "";
  vidCodec = "";
  vidFrames = vidPainted = 0;
}

// Back to VNC pixels. With a reason it is a failure and the state line says
// so; without one it is the toggle going off. Either way the ladder resumes
// from its ceiling, exactly as the Video toggle hands the rate back.
function streamOff(why, code, reason) {
  closeVideo();
  $("quality").disabled = video;
  $("vidTune").hidden = true;
  // No session means nothing to fall back to, and whatever card is up owns
  // the state line: a video socket outliving Stop cast must not overwrite
  // "Host offline" with its own goodbye.
  if (!rfb) return;
  if (rfb.pixels === false) rfb.pixels = true;
  if (!document.hidden) setRate(ceilHz());
  // A hidden tab restores on return the rate it was hidden at, and under
  // Stream that was zero - so a decoder that died in the background came back
  // to a frozen VNC picture until the ladder happened to climb. The rate this
  // fallback would have set is the one to come back to.
  else if (hiddenWant >= 0) hiddenWant = ceilHz();
  if (!why) { state("live", "VNC+"); return; }
  state("live", "DECODER+ unavailable: " + streamReason(why, code, reason));
  if (why === "host" || why === "nodecoder" || why === "shape") { reflectStream(); return; }
  // A tunnel hiccup or an encoder still warming up deserves one more go. Just
  // one: a host that cannot encode says so on every attempt, and a socket
  // reopened every few seconds is the loop this page has already had to
  // remove once from pushStream. A socket already pending by then - a
  // reconnect got there first - is left alone.
  if (!vidTried && stream) {
    vidTried = true;
    setTimeout(() => { if (rfb && stream && !vidSock) openVideo(); }, 3000);
  }
}

$("stream").addEventListener("click", () => {
  if ($("stream").disabled) return;
  stream = !stream;
  try { localStorage.setItem(STREAM_KEY, stream ? "1" : "0"); } catch (_) {}
  reflectStream();
  if (stream) { vidTried = false; vidStep = vidCeil = 0; vidUp = 0; openVideo(); }
  else streamOff("");
  refocus();
});

// Same shape as the session store: a browser that blocks site data throws on
// the mention of localStorage, and a toggle that forgets itself is not a
// broken page.
try { stream = localStorage.getItem(STREAM_KEY) === "1"; } catch (_) {}
reflectStream();

$("look").addEventListener("click", () => {
  const on = $("look").classList.toggle("on");
  if (rfb) rfb.viewOnly = on;
  // Holding the pointer captive for a session that throws every mouse event
  // away is the worst of both: the cursor cannot leave and nothing it does
  // arrives.
  if (on) setGrab(false);
  refocus();
});

$("cad").addEventListener("click", () => { if (rfb) rfb.sendCtrlAltDel(); refocus(); });

$("full").addEventListener("click", () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen().catch(() => {});
  refocus();
});

$("again").addEventListener("click", () => {
  manualStop = true;
  if (rfb) { try { rfb.disconnect(); } catch (_) {} rfb = null; }
  start();
});

// The other half of the remote start. Not on the LAN page: that is served by
// the bridge itself, which has no /api/cast, and Ctrl+C is right there anyway.
$("stop").hidden = !!DIRECT;
$("stop").addEventListener("click", async () => {
  if (!token) return;
  const who = hostName || "the host";
  if (!confirm("Stop casting on " + who + "? The screen goes away for everyone watching.")) {
    refocus();
    return;
  }
  state("wait", "Stopping…");
  let body;
  try {
    body = await wish("stop");
  } catch (e) {
    state("bad", "Could not stop");
    if (rfb) { refocus(); return; }
    // Nothing on screen to fall back to, so the error gets the card.
    problem("Could not stop the cast", String(e.message || e));
    return;
  }
  // The host takes up to ten seconds to go, and the first retry fires before
  // that. Start the wait long enough that it does not walk straight back into
  // the session it just asked to end.
  manualStop = true;
  closePing();
  stopStats();
  if (rfb) { try { rfb.disconnect(); } catch (_) {} rfb = null; }
  backoff = 15000;
  state("wait", "Host offline");
  problem("Nobody is casting", "Stopping " + (body.name || who) + "… the host takes about ten seconds to go.");
});

window.addEventListener("beforeunload", () => {
  manualStop = true;
  closePing();
  if (rfb) { try { rfb.disconnect(); } catch (_) {} }
});

/* ---------------------------------------------------------------- boot -- */

// Keep the key out of the address bar once we have it. It still has to survive
// a reload, though: stripped from the URL and saved nowhere, every F5 on a watch
// link came back to the access-key card.
//
// The one key not worth saving is the entry code arriving on top of a saved key
// that is something else. That is an old /cast#1234 bookmark meeting a host whose
// key has since been rotated: the load it is on will fail either way, and writing
// "1234" over the good saved key would turn that one failed load into every load
// failing. When the key really is 1234 the two strings are the same and this
// decides nothing.
if (location.hash) {
  const saved = store.get("castToken");
  const stale = token === ENTRY && saved && saved !== ENTRY;
  if (token && !stale) store.set("castToken", token);
  history.replaceState(null, "", location.pathname + location.search);
}

$("gateGo").addEventListener("click", () => {
  const v = $("gateInput").value.trim();
  if (!v) return;
  token = v;
  store.set("castToken", v);
  start();
});
$("gateInput").addEventListener("keydown", (e) => {
  if (e.key === "Enter") $("gateGo").click();
});

/* --------------------------------------------------------- overflow menu -- */

// The controls nobody reaches for mid-game live behind one key, which is what
// keeps the bar a single row at a laptop width. It closes on any click outside
// itself and on Escape; left open it would sit over the picture, and the idle
// fade deliberately will not take the bar while it is showing.
const moreMenu = $("moreMenu"), moreBtn = $("moreBtn");

function closeMore() {
  moreMenu.hidden = true;
  moreBtn.setAttribute("aria-expanded", "false");
  moreBtn.classList.remove("on");
}

moreBtn.addEventListener("click", () => {
  const open = moreMenu.hidden;
  moreMenu.hidden = !open;
  moreBtn.setAttribute("aria-expanded", String(open));
  moreBtn.classList.toggle("on", open);
  if (open) stir();
});
document.addEventListener("click", (e) => {
  if (!moreMenu.hidden && !e.target.closest("#more")) closeMore();
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && !moreMenu.hidden) closeMore();
});

/* ------------------------------------------------------------- the way in -- */

// A calculator with a door in it. None of this is security, and it should not be
// mistaken for any: the access key in the watch link is what stands between a
// stranger and this machine, and by the time a line of this runs that key has
// already been read out of the hash. What it buys is that a screen somebody
// glances over reads as a calculator rather than as a way into a desktop. So the
// calculator genuinely works - a prop whose buttons do nothing is a prop anyone
// spots - and the code (ENTRY, declared at the top of this file because the hash
// is read there) is never written down anywhere, so every load asks again.
//
// There are two calculators here and only one of them is on screen at a time.
// The face of the cover is a real Desmos graphing calculator, fetched from
// Desmos at load. The keypad below it is the fallback: it is four megabytes
// lighter, it is already written, and it is what the cover falls back to when
// the third-party script is slow, blocked, offline or refused. A cover that
// fails closed - a calculator that never arrives and no way past it - would be
// worse than no cover at all, so the fallback is not optional and is reachable
// three ways: automatically on error, automatically on a timeout, and by hand
// from the Basic key in the graph's header.

const CALC_FN = {
  "sin(": (x) => Math.sin(calcAngle(x)),
  "cos(": (x) => Math.cos(calcAngle(x)),
  "tan(": (x) => Math.tan(calcAngle(x)),
  "ln(": Math.log, "log(": Math.log10, "sqrt(": Math.sqrt, "abs(": Math.abs,
};

// What each key writes into the expression. A multi-character token is one entry
// in the list, which is what makes backspace land on the whole of "sin(" rather
// than halfway through it.
const CALC_KEYS = {
  sq: "\u00b2", pow: "^", sqrt: "\u221a(", ln: "ln(", log: "log(", abs: "abs(",
  sin: "sin(", cos: "cos(", tan: "tan(", pi: "\u03c0", e: "e", fact: "!",
  "(": "(", ")": ")", neg: "\u2212", "%": "%", "/": "\u00f7", "*": "\u00d7",
  "-": "\u2212", "+": "+", ".": ".",
};

// Typed keys that mean a pad key. Enter is =, Escape clears, and x is the
// multiplication sign every calculator has let people type.
const CALC_TYPED = {
  Enter: "=", "=": "=", Escape: "ac", Backspace: "del", Delete: "ac",
  x: "*", X: "*", "\u00d7": "*", "\u00f7": "/", ",": ".",
};

let calcDeg = true;   // degrees or radians, as the header key says
let calcToks = [];    // the expression being typed, one key per entry
let calcLast = "";    // the line above: the sum just worked out
let calcFresh = true; // the next digit starts over rather than appending

const calcAngle = (x) => calcDeg ? x * Math.PI / 180 : x;

function calcFact(n) {
  if (n < 0 || n > 170 || Math.floor(n) !== n) return NaN;
  let r = 1;
  for (let i = 2; i <= n; i++) r *= i;
  return r;
}

// Twelve significant figures, which is where a double stops being able to back
// up the digits it would print, and exponent form only where the plain one
// would run off the display.
function calcFmt(n) {
  if (typeof n !== "number" || !isFinite(n)) return "Error";
  if (Object.is(n, -0)) n = 0;
  const a = Math.abs(n);
  if (a !== 0 && (a >= 1e12 || a < 1e-9)) return n.toExponential(6);
  return String(Number(n.toPrecision(12)));
}

// A real recursive-descent pass over the expression: precedence, right
// associative powers, unary minus, the functions above, parentheses. Cheaper to
// write than to explain why the calculator cannot add.
function calcEval(text) {
  const norm = text.replace(/\u00d7/g, "*").replace(/\u00f7/g, "/")
    .replace(/\u2212/g, "-").replace(/\u00b2/g, "^2")
    .replace(/\u221a\(/g, "sqrt(").replace(/\u03c0/g, "PI");
  const ts = norm.match(
    /\d+\.?\d*|\.\d+|sqrt\(|sin\(|cos\(|tan\(|ln\(|log\(|abs\(|PI|e|[+\-*/^()!%]/g) || [];
  let i = 0;
  const peek = () => ts[i];
  const eat = (t) => ts[i] === t ? (i++, true) : false;
  function expr() {
    let v = term();
    for (;;) { if (eat("+")) v += term(); else if (eat("-")) v -= term(); else return v; }
  }
  function term() {
    let v = unary();
    for (;;) {
      if (eat("*")) v *= unary();
      else if (eat("/")) { const d = unary(); v = d === 0 ? NaN : v / d; }
      else return v;
    }
  }
  function unary() { return eat("-") ? -unary() : power(); }
  function power() { const b = postfix(); return eat("^") ? Math.pow(b, unary()) : b; }
  function postfix() {
    let v = primary();
    for (;;) { if (eat("!")) v = calcFact(v); else if (eat("%")) v /= 100; else return v; }
  }
  function primary() {
    const t = peek();
    if (t === undefined) throw new Error("ran out");
    if (t === "(") { i++; const v = expr(); if (!eat(")")) throw new Error("paren"); return v; }
    if (CALC_FN[t]) { i++; const v = expr(); if (!eat(")")) throw new Error("paren"); return CALC_FN[t](v); }
    if (t === "PI") { i++; return Math.PI; }
    if (t === "e") { i++; return Math.E; }
    if (/^[\d.]/.test(t)) { i++; return Number(t); }
    throw new Error("token");
  }
  const v = expr();
  if (i !== ts.length) throw new Error("trailing");
  return v;
}

// Brackets a function key opened and nobody closed are closed here rather than
// answered with an error, which is what every calculator does.
function calcSolve() {
  const text = calcToks.join("");
  let open = 0;
  for (const c of text) { if (c === "(") open++; else if (c === ")") open--; }
  try { return calcFmt(calcEval(text + ")".repeat(Math.max(0, open)))); } catch (_) { return "Error"; }
}

function calcShow() {
  $("calcPrev").textContent = calcLast;
  $("calcNow").textContent = calcToks.length ? calcToks.join("") : "0";
}

function calcPress(k) {
  if (k === "ac") { calcToks = []; calcLast = ""; calcFresh = true; }
  else if (k === "del") { calcToks.pop(); calcFresh = calcToks.length === 0; }
  else if (k === "deg") {
    calcDeg = !calcDeg;
    $("calcDeg").textContent = calcDeg ? "DEG" : "RAD";
  } else if (k === "=") {
    // The door. The code typed on its own and nothing else in the expression is
    // the way through; a sum that merely happens to land on the same number is
    // not, which is the difference between a code and an answer.
    if (calcToks.join("") === ENTRY) { enter(); return; }
    if (!calcToks.length) return;
    const was = calcToks.join("");
    const got = calcSolve();
    calcLast = was + " =" + (got === "Error" ? " Error" : "");
    calcToks = got === "Error" ? [] : [got];
    calcFresh = true;
  } else {
    const digit = /^[0-9]$/.test(k);
    const t = digit ? k : CALC_KEYS[k];
    if (t === undefined) return;
    if (calcFresh && (digit || k === ".")) calcToks = [];
    calcFresh = false;
    if (calcToks.join("").length < 40) calcToks.push(t);
  }
  calcShow();
}

function calcKey(e) {
  if (!$("lock") || e.ctrlKey || e.altKey || e.metaKey) return;
  const k = CALC_TYPED[e.key] || e.key;
  if (!/^[0-9]$/.test(k) && k !== "=" && k !== "ac" && k !== "del" &&
      !Object.prototype.hasOwnProperty.call(CALC_KEYS, k)) return;
  e.preventDefault();
  e.stopPropagation();
  calcPress(k);
}

/* ---- the graphing calculator the cover actually wears ---- */

// The Desmos calculator API rather than an iframe to desmos.com. The iframe does
// embed - desmos.com sends no X-Frame-Options and no frame-ancestors - but it is
// cross-origin, so this page could never see a key pressed inside it and the
// door would be impossible to open. The API renders into an element of ours, in
// our own document, which is what keeps the door workable at all.
//
// The key below is Desmos's public demo key, published in their own API docs. It
// works and it is not a secret, but it is shared: whoever owns this site should
// ask Desmos for their own, which is free, and swap it here.
//
// Pinned, not floating. /api/v1.11/ redirects to whatever the latest 1.11 build
// is, which means the page silently changes under us; v1.11.4 is the build that
// redirect resolved to on 2026-09-16 and the one this was written against. A
// v1.12 line exists and serves too - if you move to it, the only calls this page
// makes are GraphingCalculator(), getExpressions() and destroy(), all of which
// have been in the API since long before either line.
//
// &lang=en is load-bearing and must not be dropped. Without it desmos.com
// content-negotiates on Accept-Language: a browser that asks in fr-FR is
// answered 302 to the same URL with &lang=fr, and that build is a different four
// megabytes - 4348961 bytes against 4029588, both measured on 2026-09-16. A
// hash only ever matches one of them, so a floating language would mean the
// graph loads for an English viewer and is blocked for everybody else. Asking
// for the English build by name makes the bytes the same for every viewer:
// fetched under en-US, fr-FR and de-DE, gzipped and not, with an Origin header
// and without, the response was byte-identical every time and carried no
// redirect at all.
//
// The hash is the point of the exercise. Four megabytes of somebody else's
// JavaScript run in this document, and this document has the access key and the
// screen password sitting in sessionStorage where any script in the page can
// read them. A bundle swapped at the CDN could post both anywhere it liked.
// sha384 below is over the exact bytes that URL served on 2026-09-16; if what
// arrives is anything else the browser refuses to run it, the script's error
// handler fires, and the cover falls back to the keypad - which is the whole
// reason the keypad is not optional. crossorigin="anonymous" goes with it and is
// not decoration: an integrity= on a tag fetched in no-cors mode is a body the
// browser cannot see, so it blocks the script outright instead of checking it.
// desmos.com does send Access-Control-Allow-Origin: *, checked both with and
// without an Origin header, so the CORS half of this holds.
//
// To re-pin after a version bump, twice, and compare the two:
//   curl -s "<the new URL>" | openssl dgst -sha384 -binary | openssl base64 -A
// A wrong hash is not a small mistake. The script then never loads for anyone.
const DESMOS_SRC =
  "https://www.desmos.com/api/v1.11.4/calculator.js" +
  "?apiKey=dcb31709b452b1cf9dc26972add0fda6&lang=en";
const DESMOS_SRI =
  "sha384-IdnQ7U0//tPk18rk5uPy9VCfSgj6ttgHLylYI6TMKYHq7h0kn5MKD9Dr2m1fScCH";

// Four megabytes over whatever link the viewer is on. Past this the cover gives
// up on the graph and shows the keypad instead - a person staring at Loading…
// with no way in is the one outcome this whole section exists to avoid.
const DESMOS_WAIT_MS = 8000;

let graphCalc = null;
let graphTimer = 0;

// The door, read off the expression list rather than off the keystrokes. A
// keystroke log cannot tell 1234 typed on its own from the 1234 left behind
// after backspacing 51234, and it cannot tell which row the digits landed in;
// the expression list is the thing actually on the screen. It is compared as
// latex and not as a value on purpose, and it is the same rule the keypad plays
// by: the code typed on its own and nothing else is the way through. 617·2 is an
// answer of 1234, not the code. y=1234x is a graph that contains it, not the
// code. One row, holding exactly the four characters, is the code.
function graphIsEntry() {
  let rows;
  try { rows = graphCalc.getExpressions(); } catch (_) { return false; }
  const typed = rows.map((r) => String(r.latex || "").trim()).filter(Boolean);
  return typed.length === 1 && typed[0] === ENTRY;
}

// Capturing, on the element Desmos was rendered into, so this runs before the
// calculator's own Enter handling and the row is still the row that was typed.
// Everything that is not the code is left alone and falls through to Desmos, so
// Enter goes on meaning "next expression" for anybody actually graphing.
function graphKey(e) {
  if (e.key !== "Enter" || e.ctrlKey || e.altKey || e.metaKey) return;
  if (!graphIsEntry()) return;
  e.preventDefault();
  e.stopPropagation();
  enter();
}

// The fallback, and the only thing that runs if any part of the above does not.
// It is one-way: the graph is torn down rather than hidden, because a Desmos
// instance holds a WebGL context and there is no reason to keep one alive behind
// a keypad. Somebody who wanted the graph can reload.
function showKeypad() {
  clearTimeout(graphTimer);
  graphTimer = 0;
  if (graphCalc) {
    $("graphBox").removeEventListener("keydown", graphKey, true);
    try { graphCalc.destroy(); } catch (_) {}
    graphCalc = null;
    document.addEventListener("keydown", calcKey, true);
  }
  const g = $("graph");
  if (g) g.hidden = true;
  const c = $("calc");
  if (c) c.hidden = false;
}

function mountGraph() {
  clearTimeout(graphTimer);
  graphTimer = 0;
  // The watchdog may already have given up and shown the keypad. That decision
  // stands: swapping the card back out from under somebody mid-sum is worse than
  // a graph that arrived late and was not used.
  const box = $("graphBox");
  if (!box || !$("graph") || $("graph").hidden) return;
  // The script can load and still not leave a calculator behind - a refused API
  // key is the usual way - so nothing here assumes it worked.
  try {
    graphCalc = window.Desmos.GraphingCalculator(box, {
      expressionsTopbar: false, settingsMenu: false, border: false,
    });
  } catch (_) {
    showKeypad();
    return;
  }
  const wait = $("graphWait");
  if (wait) wait.remove();
  // The typed-key door belongs to the keypad, and it preventDefaults digits.
  // Left armed it would eat every key meant for the expression row.
  document.removeEventListener("keydown", calcKey, true);
  $("graphBox").addEventListener("keydown", graphKey, true);
}

// Three things can now stop the graph arriving where before there were two: the
// network, the page's own Content-Security-Policy, and a bundle whose bytes are
// not the pinned ones. All three land on the same handler. A script the CSP
// refuses fires error on the element, a script whose integrity does not match
// fires error on the element, and a script that simply never answers is caught
// by the watchdog - so every way this can fail ends at the keypad, and the
// keypad's door has been armed since before this function was called.
function loadDesmos() {
  const s = document.createElement("script");
  s.src = DESMOS_SRC;
  s.integrity = DESMOS_SRI;
  s.crossOrigin = "anonymous";
  s.async = true;
  s.onload = () => { if (window.Desmos && window.Desmos.GraphingCalculator) mountGraph(); else showKeypad(); };
  s.onerror = showKeypad;
  graphTimer = setTimeout(showKeypad, DESMOS_WAIT_MS);
  document.head.appendChild(s);
}

// Past the calculator is where the page it was covering actually starts.
function enter() {
  clearTimeout(graphTimer);
  document.removeEventListener("keydown", calcKey, true);
  if (graphCalc) { try { graphCalc.destroy(); } catch (_) {} graphCalc = null; }
  const lock = $("lock");
  if (lock) lock.remove();
  if (DIRECT || token) start();
  else { state("wait", "Waiting for a key"); $("gateInput").focus(); }
}

// A watch link ending in #1234 says the person already knows what the cover is
// for, so there is no cover to put up: no Desmos fetch, no keypad, no key
// listeners. It takes the cover down and does nothing else - enter() falls
// through to the ordinary access-key path, which reads the hash as the key like
// any other hash, so #1234 is the whole watch link when 1234 is the key, and is
// the saved key or the card asking for one when it is not. The hash is
// stripped from the URL by the boot block above like any other, so a reload with
// nothing in the address bar puts the cover back, which is the same rule the
// code itself has always followed: every load asks again.
if (SKIP_COVER) enter();
else {
  $("calcPads").addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (b && b.dataset.k) calcPress(b.dataset.k);
  });
  $("calcDeg").addEventListener("click", () => calcPress("deg"));
  $("graphBasic").addEventListener("click", showKeypad);
  // Armed from the start, and so the keypad's door works during the seconds the
  // graph is still downloading even though the keypad is not the card on screen.
  // There is no window in which the cover is up and nothing opens it.
  document.addEventListener("keydown", calcKey, true);
  calcShow();
  loadDesmos();
}
</script>
</body>
</html>
