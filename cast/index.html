<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Cast</title>
<meta name="robots" content="noindex">
<script>
  (function () {
    // Served by the bridge on the LAN: already at the root, nothing to normalise.
    if (window.CAST_DIRECT) return;

    // Same file is served by GitHub Pages (instellar.net) and Vercel
    // (go.instellar.net). Only the Vercel copy has /api/*, so bounce to that one.
    var h = location.hostname;
    if (h === "instellar.net" || h === "www.instellar.net") {
      location.replace("https://go.instellar.net" +
        location.pathname + location.search + location.hash);
      return;
    }

    // Vercel serves /cast without redirecting to /cast/, and a relative URL in a
    // page at /cast resolves against / - so ./novnc.js would ask for /novnc.js and
    // 404, leaving the page stuck on its own markup. Add the slash so relative
    // paths mean what they look like.
    if (!location.pathname.endsWith("/")) {
      location.replace(location.pathname + "/" + location.search + location.hash);
    }
  })();
</script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  [hidden] { display: none !important; }
  :root { --bg:#0b0d12; --fg:#e7e9ee; --muted:#8a90a0; --accent:#6ea8fe; --panel:#151922; --line:#232838; }
  html, body { height: 100%; overflow: hidden; }
  body { background: var(--bg); color: var(--fg); display: flex; flex-direction: column;
         font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

  /* ---- toolbar ---- */
  #bar { display:flex; align-items:center; gap:8px; padding:6px 10px; flex:0 0 auto; flex-wrap:wrap;
         background:var(--panel); border-bottom:1px solid var(--line); font-size:13px; }
  #bar .spacer { flex:1; }
  #bar button, #bar select { background:#1b2130; color:var(--fg); border:1px solid var(--line);
         border-radius:8px; padding:5px 9px; font-size:12px; font-family:inherit; cursor:pointer; }
  #bar button:hover, #bar select:hover { border-color:var(--accent); }
  #bar button.on { border-color:var(--accent); color:var(--accent); }
  #bar label { color:var(--muted); font-size:12px; display:flex; align-items:center; gap:5px; }

  #state { display:flex; align-items:center; gap:8px; color:var(--muted); font-size:12px;
           min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #state .dot { width:8px; height:8px; border-radius:50%; background:var(--muted); flex:0 0 auto; }
  #state.live .dot { background:#3ddc84; box-shadow:0 0 8px #3ddc84; }
  #state.wait .dot { background:#ffb020; box-shadow:0 0 8px #ffb020; animation:pulse 1.2s infinite; }
  #state.bad  .dot { background:#ff5c5c; box-shadow:0 0 8px #ff5c5c; }
  @keyframes pulse { 50% { opacity:.25; } }

  /* ---- stats readout ---- */
  #hud { display:flex; gap:12px; font-size:11.5px; color:var(--muted);
         font-variant-numeric:tabular-nums; white-space:nowrap; }
  #hud b { color:var(--fg); font-weight:600; }
  #hud .warn b { color:#ffb020; }
  #hud .bad b { color:#ff5c5c; }

  /* ---- screen ---- */
  #screen { flex:1 1 auto; min-height:0; background:#000; position:relative; }

  /* ---- overlay cards (token / password / errors) ---- */
  #veil { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
          background:rgba(11,13,18,.94); z-index:10; padding:24px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:14px;
          padding:26px 26px 22px; width:100%; max-width:400px; }
  .card h2 { font-size:19px; letter-spacing:-.01em; margin-bottom:6px; }
  .card p { color:var(--muted); font-size:13px; line-height:1.55; margin-bottom:16px; }
  .card input { width:100%; background:#0f131c; color:var(--fg); border:1px solid var(--line);
          border-radius:9px; padding:10px 12px; font-size:14px; font-family:inherit; margin-bottom:12px; }
  .card input:focus { outline:none; border-color:var(--accent); }
  .card button { width:100%; background:var(--accent); color:#0b0d12; border:0; border-radius:9px;
          padding:10px; font-size:14px; font-weight:600; font-family:inherit; cursor:pointer; }
  .card .err { color:#ff8080; font-size:13px; margin-bottom:12px; }
  .card .foot { color:var(--muted); font-size:12px; margin-top:14px; line-height:1.5; }
</style>
</head>
<body>

<div id="bar">
  <div id="state"><span class="dot"></span><span id="stateText">Starting…</span></div>
  <div id="hud">
    <span id="hRtt">ping <b>–</b></span>
    <span id="hRate">link <b>–</b></span>
    <span id="hFb">screen <b>–</b></span>
  </div>
  <div class="spacer"></div>
  <label>Show
    <select id="share" title="Fewer pixels is the single biggest speed win">
      <option value="primary" selected>Main screen</option>
      <option value="2">Second screen</option>
      <option value="full">Both</option>
    </select>
  </label>
  <label>Quality
    <select id="quality" title="Auto watches the link and picks for you">
      <option value="auto" selected>Auto</option>
      <option value="9,3">Sharp</option>
      <option value="6,5">Balanced</option>
      <option value="3,7">Fast</option>
    </select>
  </label>
  <button id="fit" class="on" title="Scale the remote screen to fit this window">Fit</button>
  <button id="look" title="Ignore my mouse and keyboard">Watch only</button>
  <button id="cad" title="Send Ctrl+Alt+Delete to the remote machine">Ctrl+Alt+Del</button>
  <button id="full" title="Fullscreen">Fullscreen</button>
  <button id="again" title="Reconnect">Reconnect</button>
</div>

<div id="screen">
  <div id="veil">
    <div class="card">
      <h2>Access key</h2>
      <p>Paste the key the host printed when it started casting.</p>
      <input type="password" id="gateInput" placeholder="Access key" autocomplete="off" spellcheck="false">
      <button id="gateGo">Connect</button>
    </div>
  </div>
</div>

<script type="module">
// The stream does NOT come through instellar.net: Vercel functions cannot hold a
// WebSocket open. /api/cast only hands back the address of the host's tunnel, and
// this page then talks RFB straight to it. No serverless hop in the pixel path is
// the reason this stays quick.
//
// Everything else about feeling fast comes down to three numbers, all of which the
// toolbar shows so they can be argued with rather than taken on faith:
//   ping    - the floor on how fast a keystroke can echo. Network, not us.
//   link    - bytes actually arriving. If this pins, quality is too high.
//   screen  - the framebuffer. Every pixel here is decode work on a weak laptop,
//             which is why the host shares one display by default.

// noVNC ships CommonJS only - there is no ESM build to import - and its 54
// modules would be 54 requests on every cold load. novnc.js is that whole tree
// bundled into one same-origin file, which is one request and no third party in
// the critical path.
import RFB from "./novnc.js";

const $ = (id) => document.getElementById(id);
const screenEl = $("screen");

// Card bodies are built as HTML, and the messages put in them come off the RFB
// wire (the host's own rejection reason) or out of an /api/cast error body.
const esc = (s) => String(s).replace(/[&<>"]/g,
  (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

// A key containing a bare % is not a valid escape and decodeURIComponent throws
// on it. Up here that throw aborts the whole module, so the access-key card stays
// on screen with nothing wired to its button - a dead page and no error.
function hashToken() {
  const raw = (location.hash || "").replace(/^#/, "");
  try { return decodeURIComponent(raw); } catch (_) { return raw; }
}

let token = hashToken() || sessionStorage.getItem("castToken") || "";
let password = sessionStorage.getItem("castPass") || "";
// Served by the bridge itself on the LAN: the endpoint is this very host, and the
// session key was injected into the page, so there is nothing to look up.
const DIRECT = typeof window.CAST_DIRECT === "string" ? window.CAST_DIRECT : "";
let endpoint = DIRECT
  ? (location.protocol === "https:" ? "wss://" : "ws://") + location.host +
    "/ws?k=" + encodeURIComponent(DIRECT)
  : "";
let rfb = null;
let retry = null;
let manualStop = false;
let needPassword = false;   // a password card is up; disconnect must not bury it

/* --------------------------------------------------------------- metrics -- */

// A Chromebook is CPU-poor before it is bandwidth-poor, so the presets trade JPEG
// quality away first. That costs less than it sounds: Tight sends flat and
// low-colour regions - which is most of a code editor - through zlib with a
// palette, and only photographic areas through JPEG. Dropping quality blurs
// wallpaper, not text.
//
// Compression is a separate dial and it is close to free here: zlib decompresses
// at the same speed whatever level packed it, so a higher level costs the host a
// little CPU - it is a desktop, it has some - and costs the viewer nothing while
// meaningfully shrinking exactly the flat regions that dominate a screenful of
// text. The old level 1 was leaving that on the table.
const PRESETS = {
  sharp:    { quality: 9, compression: 3 },
  balanced: { quality: 6, compression: 5 },
  fast:     { quality: 3, compression: 7 },
};

// Cheap proxy for "is this a weak machine": Chromebooks commonly report 2-4 cores
// and 4GB. Only a starting guess; measurement takes over within seconds.
const WEAK = (navigator.hardwareConcurrency || 4) <= 4 ||
             (navigator.deviceMemory || 8) <= 4;

const stats = { rtt: 0, floor: 0, window: 0, mbps: 0 };
const hud = {
  rtt: $("hRtt").querySelector("b"),
  rate: $("hRate").querySelector("b"),
  fb: $("hFb").querySelector("b"),
};
let pingSock = null;
let pingTimer = null;
let autoTier = WEAK ? "balanced" : "sharp";

function openPing() {
  if (!endpoint) return;
  closePing();
  try {
    pingSock = new WebSocket(endpoint.replace("/ws?", "/ping?"), ["binary"]);
  } catch (_) { return; }
  pingSock.binaryType = "arraybuffer";

  // The timer belongs to this socket. Reading it out of `pingTimer` instead
  // meant a stale socket's close event - which lands after the replacement has
  // already opened - cleared the *live* timer, freezing the ping readout and
  // with it the auto tier, which is driven by that number.
  const sock = pingSock;
  let timer = null;
  const stop = () => clearInterval(timer);

  sock.addEventListener("open", () => {
    timer = setInterval(() => {
      if (sock.readyState !== 1) return;
      sock.send(new Float64Array([performance.now()]).buffer);
    }, 1000);
    if (sock === pingSock) pingTimer = timer;
  });

  sock.addEventListener("message", (e) => {
    if (!(e.data instanceof ArrayBuffer) || e.data.byteLength !== 8) return;
    const sample = performance.now() - new Float64Array(e.data)[0];
    // Smoothed, so one scheduling hiccup does not swing the readout or the tier.
    stats.rtt = stats.rtt ? stats.rtt * 0.7 + sample * 0.3 : sample;
    // The lowest round trip seen is this link's own floor - distance and tunnel,
    // nothing we can spend our way out of. What the tier cares about is delay on
    // top of that, so keep the floor to subtract from later.
    stats.floor = stats.floor ? Math.min(stats.floor, sample) : sample;
  });

  // The probe is a nicety; if it cannot connect the session carries on regardless.
  sock.addEventListener("close", stop);
  sock.addEventListener("error", stop);
}

function closePing() {
  clearInterval(pingTimer);
  if (pingSock) { try { pingSock.close(); } catch (_) {} }
  pingSock = null;
}

function fmtRate(mbps) {
  if (!mbps) return "idle";
  return mbps >= 1 ? mbps.toFixed(1) + " Mb/s" : (mbps * 1000).toFixed(0) + " kb/s";
}

// One timer drives both the readout and the auto tier, so the page does no
// per-frame work of its own.
let lastTick = performance.now();

setInterval(() => {
  // Divide by the time that actually passed. A hidden tab throttles this timer to
  // once a minute while bytes keep arriving, and assuming one second turned that
  // into a readout sixty times the real rate on the first tick back.
  const now = performance.now();
  const dt = (now - lastTick) / 1000;
  lastTick = now;
  stats.mbps = dt > 0 ? (stats.window * 8) / 1e6 / dt : 0;
  stats.window = 0;

  // Let the floor drift back up, or a single lucky sample early on becomes a
  // baseline the link can never live up to again and the tier sinks for good.
  // Only while the link is quiet, though: a floor measured with nothing in flight
  // is the real one, and letting a busy link raise it lets sustained congestion
  // slowly redefine itself as normal until the tier climbs back onto a link that
  // never recovered.
  if (stats.floor && stats.rtt && stats.mbps < 0.5) {
    stats.floor = Math.min(stats.floor * 1.02, stats.rtt);
  }

  // The probe is a second socket and it dies on its own timetable - an idle
  // timeout on the tunnel is enough. Left dead, the readout freezes on a stale
  // number and the tier goes on trusting it.
  if (rfb && (!pingSock || pingSock.readyState > 1)) openPing();

  const rtt = stats.rtt;
  hud.rtt.textContent = rtt ? Math.round(rtt) + " ms" : "–";
  $("hRtt").className = rtt > 150 ? "bad" : rtt > 70 ? "warn" : "";
  hud.rate.textContent = fmtRate(stats.mbps);

  const canvas = screenEl.querySelector("canvas");
  hud.fb.textContent = canvas && canvas.width
    ? canvas.width + "×" + canvas.height : "–";

  if ($("quality").value === "auto") retune();

  // Every named way focus can leave the canvas already puts it back, but a dead
  // keyboard that needs a Reconnect to clear means at least one way is not named
  // - a print dialog dismissed, an extension popup, a window manager handing
  // focus somewhere on its own. None of those fire anything we listen for. So
  // stop enumerating causes and check the state itself: if there is a session,
  // nothing on screen asking to be typed into, and focus is not on the canvas or
  // the toolbar, that is a keyboard nobody can use and no reason for it.
  // Only while this tab is the one in front: reaching for focus behind the
  // user's back, while they are in another tab, is how a page becomes the thing
  // that steals your address bar.
  if (rfb && !document.hidden && !$("veil")) {
    const el = document.activeElement;
    if (!(el && el.closest && el.closest("#bar"))) refocus();
  }
}, 1000);

// Auto quality, driven by latency alone. Throughput looks like a tempting second
// signal but it is a trap: lowering quality lowers throughput, which would argue
// for raising quality again, and the tier oscillates. Round-trip time has no such
// feedback loop. Hysteresis on top keeps noisy wifi from twitching the tier.
let tuneHold = 0;

function retune() {
  const rtt = stats.rtt;
  if (!rtt || !stats.floor) return;

  // Absolute thresholds answered the wrong question. A tunnel that idles at 25ms
  // read as "plenty of headroom" and got the most expensive preset even while
  // frames were visibly piling up, and a host two countries away idling at 120ms
  // was pinned to the cheapest one even with the link half empty. Distance is not
  // congestion. The delay we are adding on top of the link's own floor is.
  const queued = rtt - stats.floor;

  let want;
  if (queued > 120) want = "fast";
  else if (queued > 40 || WEAK) want = "balanced";
  else want = "sharp";

  if (want === autoTier) { tuneHold = 0; return; }
  // Asymmetric on purpose: a backed-up link is felt immediately, so give way
  // quickly, but only climb back after the calm has clearly held.
  const cheaper = ["fast", "balanced", "sharp"].indexOf(want) <
                  ["fast", "balanced", "sharp"].indexOf(autoTier);
  if (++tuneHold < (cheaper ? 2 : 6)) return;
  tuneHold = 0;
  autoTier = want;
  applyQuality();
}

/* ------------------------------------------------------------------ ui -- */

function state(kind, text) {
  $("state").className = kind;
  $("stateText").textContent = text;
}

// One overlay, reused for the key prompt, the VNC password and every dead end.
function veil(html, onReady) {
  const el = document.createElement("div");
  el.id = "veil";
  el.innerHTML = '<div class="card">' + html + "</div>";
  const old = $("veil");
  if (old) old.remove();
  screenEl.appendChild(el);
  if (onReady) onReady(el);
}

function hideVeil() {
  const el = $("veil");
  if (el) el.remove();
}

function askToken(message) {
  veil(
    "<h2>Access key</h2>" +
    "<p>Paste the key the host printed when it started casting.</p>" +
    (message ? '<div class="err">' + esc(message) + "</div>" : "") +
    '<input type="password" id="gateInput" placeholder="Access key" autocomplete="off" spellcheck="false">' +
    '<button id="gateGo">Connect</button>',
    (el) => {
      const input = el.querySelector("#gateInput");
      const go = () => {
        const v = input.value.trim();
        if (!v) return;
        token = v;
        sessionStorage.setItem("castToken", v);
        start();
      };
      el.querySelector("#gateGo").addEventListener("click", go);
      input.addEventListener("keydown", (e) => { if (e.key === "Enter") go(); });
      input.focus();
    }
  );
}

function askPassword(message) {
  veil(
    "<h2>Screen password</h2>" +
    "<p>The VNC password set on the host machine.</p>" +
    (message ? '<div class="err">' + esc(message) + "</div>" : "") +
    '<input type="password" id="pw" placeholder="Password" autocomplete="off">' +
    '<button id="pwGo">Unlock</button>',
    (el) => {
      const input = el.querySelector("#pw");
      const go = () => {
        password = input.value;
        sessionStorage.setItem("castPass", password);
        needPassword = false;
        if (rfb) { hideVeil(); rfb.sendCredentials({ password: password }); }
        else start();
      };
      el.querySelector("#pwGo").addEventListener("click", go);
      input.addEventListener("keydown", (e) => { if (e.key === "Enter") go(); });
      input.focus();
    }
  );
}

// Every dead end here is recoverable and none of them are the viewer's fault -
// a tunnel rotating, a lid closing, wifi changing its mind - so all of them
// retry. The button is still there to skip the wait rather than to start the
// only attempt that will ever happen.
// `final` is for the one answer that retrying cannot improve: the owner has
// blocked this device. Everything else here is a blip worth waiting out, so it
// keeps the countdown and the button.
function problem(title, detail, final) {
  if (final) clearTimeout(retry);
  const wait = final ? 0 : scheduleRetry();
  veil(
    "<h2>" + esc(title) + "</h2><p>" + esc(detail) + "</p>" +
    (final ? "" :
      '<button id="retryGo">Try now</button>' +
      '<div class="foot">Reconnecting in ' + Math.round(wait / 1000) + "s…</div>"),
    (el) => {
      const b = el.querySelector("#retryGo");
      if (b) b.addEventListener("click", start);
    }
  );
}

// Backing off matters because a host that is simply off stays off for hours, and
// a fixed 4s meant a page left open overnight asked the API twenty thousand
// times. Starts quick, because most drops are a blip that is already over.
let backoff = 4000;

function scheduleRetry() {
  const wait = backoff;
  clearTimeout(retry);
  retry = setTimeout(start, wait);
  backoff = Math.min(Math.round(backoff * 1.6), 30000);
  return wait;
}

/* ------------------------------------------------------------- connect -- */

async function start() {
  clearTimeout(retry);
  manualStop = false;
  needPassword = false;
  hideVeil();

  if (DIRECT) return connect();
  if (!token) return askToken("");

  state("wait", "Looking for the host…");
  try {
    const res = await fetch("/api/cast?t=" + encodeURIComponent(token), { cache: "no-store" });
    const body = await res.json().catch(() => ({}));

    if (res.status === 401) {
      sessionStorage.removeItem("castToken");
      token = "";
      state("bad", "Wrong key");
      return askToken("That key does not match the host.");
    }
    if (res.status === 403) {
      state("bad", "Blocked");
      return problem("Blocked", body.detail || "The owner has blocked this device.", true);
    }
    if (res.status === 404) {
      state("wait", "Host offline");
      return problem("Nobody is casting", "Run the host script on the machine you want to reach.");
    }
    if (!res.ok) throw new Error(body.error || "HTTP " + res.status);
    // The registry is meant to hand back a tunnel, and the page is about to send
    // it the VNC password. Check the shape before trusting it: /api/cast enforces
    // this too, but nothing costs less than refusing to open a socket the site
    // should never have named.
    if (!/^wss:\/\//i.test(String(body.url || ""))) {
      state("bad", "Bad endpoint");
      return problem("The site returned an address to refuse",
        "A cast endpoint must be a wss:// tunnel. Restart the host and try again.");
    }
    endpoint = body.url;
    if (body.name) document.title = "Cast - " + body.name;
  } catch (e) {
    // Almost always the viewer's own network rather than the site: a lid closing,
    // wifi handing over, a tunnel mid-rotation. Giving up here was what turned a
    // three-second blip into a dead page waiting for a click.
    state("bad", "Lookup failed");
    problem("Could not reach the site API", String(e.message || e));
    return;
  }

  connect();
}

function connect() {
  state("wait", "Connecting…");
  if (rfb) { try { rfb.disconnect(); } catch (_) {} rfb = null; }
  // A reconnect can be to a different tunnel entirely. Carrying the old floor
  // over would read the new host's distance as congestion for the minute or so
  // the floor needs to catch up.
  stats.rtt = 0;
  stats.floor = 0;

  // Building the socket here rather than handing RFB a URL is what makes the link
  // readout possible: noVNC replaces the onmessage property, but a listener added
  // with addEventListener still fires, so bytes can be counted without reaching
  // into its internals. It must still be CONNECTING when RFB takes it, because
  // RFB waits for the open event.
  let sock;
  try {
    sock = new WebSocket(endpoint, ["binary"]);
  } catch (e) {
    state("bad", "Bad endpoint");
    return problem("Could not open the connection", String(e.message || e));
  }
  sock.binaryType = "arraybuffer";
  sock.addEventListener("message", (e) => {
    stats.window += (e.data && e.data.byteLength) || 0;
  });

  // Only hand over a password we actually have. Passing an empty string counts as
  // a real credential, so noVNC would attempt auth with it, get refused, and greet
  // a first-time viewer with "the host refused that password" before they typed
  // anything. With none supplied it asks properly instead.
  const me = new RFB(screenEl, sock,
    password ? { credentials: { password: password } } : {});
  rfb = me;
  me.background = "#000";
  me.focusOnClick = true;
  me.showDotCursor = true;
  applyQuality();
  applyFit();
  me.viewOnly = $("look").classList.contains("on");

  // Every handler below belongs to `me` and must refuse to speak for anything
  // else. RFB.disconnect() is not synchronous - it closes the socket and the
  // disconnect event arrives a task later - so a session we tore down still has
  // one event left to fire, and by then `rfb` is its replacement. Without this
  // guard the dead session nulls the live one: the toolbar goes inert, focus()
  // throws inside the connect handler so the keyboard and the ping probe never
  // start, and the phantom retry below builds a second session on top of the
  // first. Reconnect made that happen every single time on the LAN path.
  const current = () => rfb === me;

  me.addEventListener("connect", () => {
    if (!current()) return;
    hideVeil();
    state("live", "Connected");
    backoff = 4000;          // this link works; the next blip starts patient again
    me.focus();
    openPing();
  });

  me.addEventListener("credentialsrequired", () => {
    if (!current()) return;
    state("wait", "Password needed");
    needPassword = true;
    askPassword(password ? "That password was rejected." : "");
  });

  // noVNC fires this and then immediately fails the connection, so without the
  // flag the disconnect handler below would replace the password card with
  // "Connection dropped" and start retrying - leaving nowhere to type.
  me.addEventListener("securityfailure", (e) => {
    if (!current()) return;
    sessionStorage.removeItem("castPass");
    password = "";
    needPassword = true;
    state("bad", "Rejected");
    askPassword((e.detail && e.detail.reason) || "The host refused that password.");
  });

  me.addEventListener("disconnect", (e) => {
    if (!current()) return;
    rfb = null;
    closePing();
    if (manualStop || needPassword) return;
    // A clean close is the host hanging up; anything else is usually the tunnel
    // rotating out from under us, which a fresh /api/cast lookup fixes.
    state("bad", "Disconnected");
    problem("Connection dropped",
      (e.detail && e.detail.clean) ? "The host ended the session."
                                   : "Lost the link to the host.");
  });

  me.addEventListener("clipboard", (e) => {
    if (!current()) return;
    if (e.detail && e.detail.text && navigator.clipboard) {
      navigator.clipboard.writeText(e.detail.text).catch(() => {});
    }
  });
}

/* ------------------------------------------------------------ controls -- */

// noVNC listens for keys on its canvas, so a canvas without DOM focus is a dead
// keyboard - and nothing on screen says so, which is why it reads as "the cast
// froze" or "it only works half the time". Every way focus can leave the canvas
// has to put it back.
function refocus() {
  // A card is up: the access key or password field is where typing belongs, and
  // pulling focus to the canvas would leave the viewer unable to type into it.
  if (!rfb || $("veil")) return;
  const canvas = screenEl.querySelector("canvas");
  if (document.activeElement === canvas) return;
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  rfb.focus();
}

// Cheaper than taking focus back afterwards: a toolbar button that never takes
// focus cannot swallow the next Space or Enter either. Only buttons - the selects
// and the labels wrapping them need their default mousedown to drop open.
$("bar").addEventListener("mousedown", (e) => {
  if (e.target.closest("button")) e.preventDefault();
});

// "Fit" leaves black bars beside the desktop whenever the aspect ratios differ,
// and a click there lands on the container rather than the canvas. noVNC only
// grabs focus for clicks on the canvas itself, so those clicks were silently
// switching the keyboard off.
screenEl.addEventListener("mousedown", (e) => {
  if (e.target.closest("#veil")) return;
  // Moving focus is mousedown's own default action, and it runs after this
  // listener - so focusing from in here just gets undone, which left the bug this
  // was added to fix still live. preventDefault would stop that but would also
  // kill scrollbar dragging on the 1:1 view, so let the browser finish and take
  // focus back on the next task instead.
  setTimeout(refocus, 0);
});

// Fullscreen moves focus to the element being promoted, and coming back from
// another tab or window does not always restore it either.
document.addEventListener("fullscreenchange", () => {
  refocus();
  // Ctrl+W, Ctrl+T, Alt+Tab and Escape never reach the canvas otherwise - the
  // browser claims them first, so pressing Ctrl+W at the remote machine closes
  // this tab instead. Keyboard lock hands them over, and browsers only allow it
  // in fullscreen, which is why it lives here. Exiting still works: the toolbar
  // stays on screen, and holding Escape is the browser's own way out.
  if (!navigator.keyboard || !navigator.keyboard.lock) return;
  if (document.fullscreenElement) navigator.keyboard.lock().catch(() => {});
  else navigator.keyboard.unlock();
});
// The other side of keyboard lock. Handing the Windows key to the remote machine
// is the point, but two of the combos it unlocks put Windows into Snipping Tool:
// the screen dims, the pointer becomes a crosshair, and every key is swallowed
// until Escape. Win+Shift+S is easy to hit reaching for Shift+S, and Windows 11
// maps bare PrintScreen to the same thing. Neither is worth reaching the host -
// to capture the remote screen, screenshot this window instead.
//
// Capture phase on document, so this runs before noVNC's own handler on the
// canvas. keyup is swallowed with it: sending a keyup for a key the host never
// saw pressed is how modifiers get stuck down.
function isSnipKey(e) {
  return e.key === "PrintScreen" ||
         (e.metaKey && e.shiftKey && (e.key === "s" || e.key === "S"));
}
for (const type of ["keydown", "keyup"]) {
  document.addEventListener(type, (e) => {
    if (!isSnipKey(e)) return;
    e.preventDefault();
    e.stopImmediatePropagation();
  }, true);
}

window.addEventListener("focus", refocus);
document.addEventListener("visibilitychange", () => {
  if (document.hidden) return;
  refocus();
  // A hidden tab has its timers throttled to about once a minute, so a drop that
  // happened while you were elsewhere is still sitting on a retry that has not
  // fired. Coming back is the moment to stop waiting.
  if (!rfb && !manualStop && !needPassword) start();
});

function applyQuality() {
  if (!rfb) return;
  const picked = $("quality").value;
  const p = picked === "auto"
    ? PRESETS[autoTier]
    : { quality: +picked.split(",")[0], compression: +picked.split(",")[1] };
  rfb.qualityLevel = p.quality;
  rfb.compressionLevel = p.compression;
}

// Fit scales the desktop into the window. Off renders 1:1 and lets noVNC's own
// screen div scroll, so ordinary scrollbars pan - which beats drag-panning, where
// a drag to pan is a drag you did not mean to send to the remote machine.
function applyFit() {
  if (!rfb) return;
  rfb.scaleViewport = $("fit").classList.contains("on");
  rfb.clipViewport = false;
  rfb.dragViewport = false;
}

$("quality").addEventListener("change", () => { applyQuality(); refocus(); });

// Switching monitors is a host-side change, so it goes to the bridge's control
// endpoint. The session key already in the endpoint URL is what authorises it.
$("share").addEventListener("change", async () => {
  if (!endpoint) return;
  const ctl = endpoint.replace(/^wss:/, "https:").replace(/^ws:/, "http:")
                      .replace("/ws?", "/ctl?") +
              "&share=" + encodeURIComponent($("share").value);
  state("wait", "Switching screen…");
  try {
    const r = await fetch(ctl, { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
  } catch (_) {
    state("bad", "Could not switch screen");
    refocus();
    return;
  }
  // The shared area is now a different size. Rather than hope the desktop-resize
  // path is handled everywhere, take the reliable route: the password is already
  // cached, so reconnecting costs a second and always lands in a correct state.
  manualStop = true;
  if (rfb) { try { rfb.disconnect(); } catch (_) {} rfb = null; }
  setTimeout(start, 250);
});

$("fit").addEventListener("click", () => {
  $("fit").classList.toggle("on");
  applyFit();
  refocus();
});

$("look").addEventListener("click", () => {
  const on = $("look").classList.toggle("on");
  if (rfb) rfb.viewOnly = on;
  refocus();
});

$("cad").addEventListener("click", () => { if (rfb) rfb.sendCtrlAltDel(); refocus(); });

$("full").addEventListener("click", () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen().catch(() => {});
  refocus();
});

$("again").addEventListener("click", () => {
  manualStop = true;
  if (rfb) { try { rfb.disconnect(); } catch (_) {} rfb = null; }
  start();
});

window.addEventListener("beforeunload", () => {
  manualStop = true;
  closePing();
  if (rfb) { try { rfb.disconnect(); } catch (_) {} }
});

/* ---------------------------------------------------------------- boot -- */

// Keep the key out of the address bar once we have it. It still has to survive
// a reload, though: stripped from the URL and saved nowhere, every F5 on a watch
// link came back to the access-key card.
if (location.hash) {
  if (token) sessionStorage.setItem("castToken", token);
  history.replaceState(null, "", location.pathname + location.search);
}

$("gateGo").addEventListener("click", () => {
  const v = $("gateInput").value.trim();
  if (!v) return;
  token = v;
  sessionStorage.setItem("castToken", v);
  start();
});
$("gateInput").addEventListener("keydown", (e) => {
  if (e.key === "Enter") $("gateGo").click();
});

if (DIRECT || token) start();
else { state("wait", "Waiting for a key"); $("gateInput").focus(); }
</script>
</body>
</html>
