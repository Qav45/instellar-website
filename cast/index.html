  // disconnect handler is guarded by current(), which is already false on this
  // path, so it never reaches its own closePing - leaving a healthy socket that
  // goes on writing the old tunnel's samples straight back into the numbers this
  // line just reset, for the whole length of the new handshake.
  closePing();
  stats.rtt = 0;
  stats.floor = 0;
  // A new bridge knows nothing of what the last one was told, and none of what
  // the last host proved about itself is evidence about this one. streamOk in
  // particular used to be a one-way latch for the life of the tab: one tunnel
  // rotation onto a host that answered without a `stream` field, or a single
  // transient non-JSON 400, and the page ran the depth-1 loop for ever after
  // with no way back short of a reload.
  streamSent = -1;
  streamOk = true;
  streamFails = 0;
  streamRetryAt = 0;
  hiddenWant = -1;
  bestFps = 0;
  prevBacklog = 0;
  metrics.pollMs = 0;
  // The video socket belongs to the session it was opened against - a fresh
  // one is opened once the new RFB is up, if the toggle is still on.
  closeVideo();
  hostVideo = true;
  vidTried = false;
  vidStep = vidCeil = 0;
  vidUp = vidCodecSince = 0;
  vidFamily = "";
  vidSoft = false;

  // Building the socket here rather than handing RFB a URL is what makes the link
  // readout possible: noVNC replaces the onmessage property, but a listener added
  // with addEventListener still fires, so bytes can be counted without reaching
  // into its internals. It must still be CONNECTING when RFB takes it, because
  // RFB waits for the open event.
  let sock;
  try {
    sock = new WebSocket(endpoint, ["binary"]);
  } catch (e) {
    state("bad", "Bad endpoint");
    return problem("Could not open the connection", String(e.message || e));
  }
  sock.binaryType = "arraybuffer";
  sock.addEventListener("message", (e) => {
    stats.window += (e.data && e.data.byteLength) || 0;
  });

  // noVNC's disconnect event says only clean or not, and "not clean" covers both
  // the host hanging up rudely and the link being cut underneath us. The socket's
  // own close code separates them - 1006 with no reason is nothing on either end
  // deciding anything, it is the tunnel or the network - and a drop nobody can
  // find a pattern in is the case that most needs that written down.
  let closeInfo = "";
  sock.addEventListener("close", (e) => {
    closeInfo = e.code ? " (" + e.code + (e.reason ? ": " + e.reason : "") + ")" : "";
  });

  // Only hand over a password we actually have. Passing an empty string counts as
  // a real credential, so noVNC would attempt auth with it, get refused, and greet
  // a first-time viewer with "the host refused that password" before they typed
  // anything. With none supplied it asks properly instead.
  const me = new RFB(screenEl, sock,
    password ? { credentials: { password: password } } : {});
  rfb = me;
  me.background = "#000";
  me.focusOnClick = true;
  me.showDotCursor = true;
  applyQuality();
  applyFit();
  me.viewOnly = $("look").classList.contains("on");

  // Every handler below belongs to `me` and must refuse to speak for anything
  // else. RFB.disconnect() is not synchronous - it closes the socket and the
  // disconnect event arrives a task later - so a session we tore down still has
  // one event left to fire, and by then `rfb` is its replacement. Without this
  // guard the dead session nulls the live one: the toolbar goes inert, focus()
  // throws inside the connect handler so the keyboard and the ping probe never
  // start, and the phantom retry below builds a second session on top of the
  // first. Reconnect made that happen every single time on the LAN path.
  const current = () => rfb === me;

  me.addEventListener("connect", () => {
    if (!current()) return;
    hideVeil();
    state("live", "VNC+");
    backoff = 4000;          // this link works; the next blip starts patient again
    attempts = 0;
    me.focus();
    openPing();
    startStats();
    // Only now: the request the host builds needs a framebuffer size, and the
    // canvas that carries it does not exist until the session is up.
    //
    // A session can come up while the tab is in the background - a retry that
    // fired after somebody switched away - and asking a hidden tab's bridge to
    // inject is the thing the visibilitychange handler exists to stop. Nothing
    // there would have caught it: it only runs on a change, and there is none.
    streamWant = document.hidden ? 0 : ceilHz();
    pushStream();
    // The VNC rate above is not wasted: it is the picture until the first
    // keyframe decodes, and the config message takes it back to zero.
    reflectStream();
    openVideo();
  });

  // What the controller runs on. One event per completed update, carrying what
  // it cost - and the guard matters as much here as anywhere: a torn-down
  // session still has events in flight, and counting them would credit the live
  // session with the dead one's frames.
  me.addEventListener("framebufferupdate", (e) => {
    if (current() && e.detail) onFrame(e.detail);
  });

  me.addEventListener("credentialsrequired", () => {
    if (!current()) return;
    state("wait", "Password needed");
    needPassword = true;
    askPassword(password ? "That password was rejected." : "");
  });

  // noVNC fires this and then immediately fails the connection, so without the
  // flag the disconnect handler below would replace the password card with
  // "Connection dropped" and start retrying - leaving nowhere to type.
  me.addEventListener("securityfailure", (e) => {
    if (!current()) return;
    store.drop("castPass");
    password = "";
    needPassword = true;
    state("bad", "Rejected");
    askPassword((e.detail && e.detail.reason) || "The host refused that password.");
  });

  me.addEventListener("disconnect", (e) => {
    // Any session ending ends the mic, a superseded one (Reconnect) included.
    micOff();
    if (!current()) return;
    rfb = null;
    closePing();
    stopStats();
    closeVideo();
    // The rate is remembered by the bridge, not by the connection, so a rate
    // this viewer chose would otherwise be waiting for whoever connects next.
    streamWant = 0;
    pushStream();
    if (manualStop || needPassword) return;
    // A clean close is the host hanging up; anything else is usually the tunnel
    // rotating out from under us, which a fresh /api/cast lookup fixes.
    state("bad", "Disconnected");
    problem("Connection dropped",
      ((e.detail && e.detail.clean) ? "The host ended the session."
                                    : "Lost the link to the host.") + closeInfo);
  });

  // Copying on the remote machine puts it on this device's clipboard. The other
  // direction is the paste handler further down.
  me.addEventListener("clipboard", (e) => {
    if (!current()) return;
    if (e.detail && e.detail.text && navigator.clipboard) {
      navigator.clipboard.writeText(e.detail.text).catch(() => {});
    }
  });
}

/* ------------------------------------------------------------ controls -- */

// noVNC listens for keys on its canvas, so a canvas without DOM focus is a dead
// keyboard - and nothing on screen says so, which is why it reads as "the cast
// froze" or "it only works half the time". Every way focus can leave the canvas
// has to put it back.
function refocus() {
  // A card is up: the access key or password field is where typing belongs, and
  // pulling focus to the canvas would leave the viewer unable to type into it.
  if (!rfb || $("veil")) return;
  const canvas = screenEl.querySelector("canvas");
  if (document.activeElement === canvas) return;
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  rfb.focus();
}

// Cheaper than taking focus back afterwards: a toolbar button that never takes
// focus cannot swallow the next Space or Enter either. Only buttons - the selects
// and the labels wrapping them need their default mousedown to drop open.
$("bar").addEventListener("mousedown", (e) => {
  if (e.target.closest("button")) e.preventDefault();
});

// "Fit" leaves black bars beside the desktop whenever the aspect ratios differ,
// and a click there lands on the container rather than the canvas. noVNC only
// grabs focus for clicks on the canvas itself, so those clicks were silently
// switching the keyboard off.
screenEl.addEventListener("mousedown", (e) => {
  if (e.target.closest("#veil")) return;
  // Moving focus is mousedown's own default action, and it runs after this
  // listener - so focusing from in here just gets undone, which left the bug this
  // was added to fix still live. preventDefault would stop that but would also
  // kill scrollbar dragging on the 1:1 view, so let the browser finish and take
  // focus back on the next task instead.
  setTimeout(refocus, 0);
});

// Fullscreen moves focus to the element being promoted, and coming back from
// another tab or window does not always restore it either.
document.addEventListener("fullscreenchange", () => {
  refocus();
  // Ctrl+W, Ctrl+T, Alt+Tab and Escape never reach the canvas otherwise - the
  // browser claims them first, so pressing Ctrl+W at the remote machine closes
  // this tab instead. Keyboard lock hands them over, and browsers only allow it
  // in fullscreen, which is why it lives here. Exiting still works: the toolbar
  // stays on screen, and holding Escape is the browser's own way out.
  if (!navigator.keyboard || !navigator.keyboard.lock) return;
  if (document.fullscreenElement) navigator.keyboard.lock().catch(() => {});
  else navigator.keyboard.unlock();
});
// The other side of keyboard lock. Handing the Windows key to the remote machine
// is the point, but two of the combos it unlocks put Windows into Snipping Tool:
// the screen dims, the pointer becomes a crosshair, and every key is swallowed
// until Escape. Win+Shift+S is easy to hit reaching for Shift+S, and Windows 11
// maps bare PrintScreen to the same thing. Neither is worth reaching the host -
// to capture the remote screen, screenshot this window instead.
//
// Capture phase on document, so this runs before noVNC's own handler on the
// canvas. keyup is swallowed with it: sending a keyup for a key the host never
// saw pressed is how modifiers get stuck down.
function isSnipKey(e) {
  return e.key === "PrintScreen" ||
         (e.metaKey && e.shiftKey && (e.key === "s" || e.key === "S"));
}
for (const type of ["keydown", "keyup"]) {
  document.addEventListener(type, (e) => {
    if (!isSnipKey(e)) return;
    e.preventDefault();
    e.stopImmediatePropagation();
  }, true);
}

/* ----------------------------------------------------------- mouse lock -- */

// What a game wants and a desktop does not: the pointer stays inside the remote
// screen, there is no local cursor drifting onto another monitor mid-turn, and
// movement is sent as movement - see relativePointer in novnc.js, which sends a
// position that free-runs from the last one, because a game that has grabbed the
// mouse reads each position against the one before it rather than against any
// centre. The one thing it cannot do is free-run for ever; running out of
// framebuffer costs a single flick, and _pointerPos says why.
//
// noVNC listens on the canvas, so the canvas is what gets locked; locking the
// container would leave every mouse event landing on an element noVNC never
// hears from.
function lockTarget() {
  return rfb ? screenEl.querySelector("canvas") : null;
}

// The button holds the intent, not the lock. Browsers hand the lock back on
// Escape and refuse to take it again without a fresh click, so an armed button
// and a click on the screen is the only shape that survives that.
function armed() { return $("grab").classList.contains("on"); }

function takeLock() {
  const canvas = lockTarget();
  if (!canvas || $("veil") || !armed()) return;
  if (document.pointerLockElement === canvas) return;
  const p = canvas.requestPointerLock();
  if (p && p.catch) p.catch(() => {});
}

function setGrab(on) {
  $("grab").classList.toggle("on", on);
  if (on) takeLock();
  else if (document.pointerLockElement) document.exitPointerLock();
}

$("grab").addEventListener("click", () => { setGrab(!armed()); refocus(); });

// Capture phase: noVNC stops propagation on the canvas, so a bubbling listener
// on the container never sees a click that landed on the desktop itself - which
// is every click that matters here.
screenEl.addEventListener("mousedown", () => { takeLock(); }, true);

document.addEventListener("pointerlockchange", () => {
  const held = document.pointerLockElement === lockTarget();
  if (rfb) rfb.relativePointer = held;
  $("grab").classList.toggle("held", held);
  refocus();
});

/* ------------------------------------------------------------ clipboard -- */

// Copy here, paste there. Ctrl+V has to do two things in order - put the text on
// the host's clipboard, then ask the host to paste - and the host must not see
// the keystroke until the text has arrived, or it pastes whatever it had before.
//
// So the key is taken away from noVNC and sent back synthetically once the text
// is on its way. The `paste` event is what carries the text: reading the
// clipboard through navigator.clipboard.readText() needs a permission prompt,
// while the event hands the same string over for free - but only if the key is
// left to do its normal job, which is why nothing here calls preventDefault on
// the keydown.
function isPasteKey(e) {
  if (e.shiftKey && e.key === "Insert") return true;
  return (e.ctrlKey || e.metaKey) && !e.altKey && (e.key === "v" || e.key === "V");
}

// Capture on document, ahead of noVNC's own handler on the canvas. keyup goes
// with it for symmetry; noVNC ignores a release for a key it never saw pressed.
for (const type of ["keydown", "keyup"]) {
  document.addEventListener(type, (e) => {
    if (!rfb || $("veil") || !isPasteKey(e)) return;
    e.stopImmediatePropagation();
  }, true);
}

document.addEventListener("paste", (e) => {
  // A card is up: that paste belongs in the password field.
  if (!rfb || $("veil")) return;
  const text = e.clipboardData && e.clipboardData.getData("text/plain");
  if (!text) return;
  e.preventDefault();
  rfb.clipboardPasteFrom(text);

  // Both messages travel this one socket in order, but TightVNC hands the text
  // to Windows on another thread, so a keystroke sent in the same breath can
  // beat it there and paste the previous contents. A beat costs nothing on a
  // paste and turns an intermittent wrong-text bug into no bug.
  //
  // The whole combo is synthesised rather than leaning on the Ctrl the viewer is
  // physically holding: by the time this fires they may have let go, and a lone
  // "v" would be typed into their document instead. The cost is that the host
  // sees Ctrl released here, so a Ctrl held down for something else afterwards
  // needs pressing again.
  setTimeout(() => {
    if (!rfb) return;
    rfb.sendKey(0xffe3, "ControlLeft", true);
    rfb.sendKey(0x76, "KeyV");
    rfb.sendKey(0xffe3, "ControlLeft", false);
  }, 60);
});

window.addEventListener("focus", refocus);
// A hidden tab has its timers throttled to about once a minute, so a drop that
// happened while you were elsewhere is still sitting on a retry that has not
// fired. Coming back is the moment to stop waiting. The same goes for the network
// coming back: the retry it interrupted may have half a minute left to run.
//
// Only when a retry is actually pending, though. "No session" also describes a
// page sitting on the access-key card, and restarting that from under someone
// who switched tabs to copy the key wiped what they had typed - and a lookup
// already in flight is not improved by a second one racing it.
function hurry() {
  if (retry) start();
}
document.addEventListener("visibilitychange", () => {
  // A hidden tab keeps the injector and loses the controller: timers here are
  // throttled to roughly one fire a minute, so every down-step and the kill
  // switch itself would evaluate once a minute while the bridge went on sending
  // at the last rate it was given. Before any of this the depth-1 loop
  // self-throttled - a viewer that stopped parsing stopped asking - and this is
  // how that comes back. It also stops paying for a tunnel nobody is watching.
  //
  // What comes back is the rate that was in force, not the rung's rate. Those
  // differ exactly when something other than the ladder had lowered it - manual
  // mode, where the rung is whatever the person pinned and the rate is the only
  // dial the controller owns, and the kill switch, which sets zero and freezes
  // climbing for a minute. Restoring the rung's rate there handed a struggling
  // session its full rate back for a tick just because somebody changed tabs.
  if (rfb) {
    if (document.hidden) {
      if (hiddenWant < 0) hiddenWant = streamWant;
      streamWant = 0;
    } else {
      streamWant = hiddenWant < 0 ? ceilHz() : hiddenWant;
      hiddenWant = -1;
    }
    pushStream();
    // The video socket is left open: a person watching their own machine from
    // another tab wants a live picture to come back to, not a frozen one. The
    // decoder is not rAF-driven and the gate drops to the next keyframe when its
    // queue grows, so a throttled tab costs frames, never the session. Only a
    // socket that died while hidden is reopened here.
    // Frames already decoded and waiting for a slot are let go of on the way
    // out: rAF will not run to paint them, and a held VideoFrame is a buffer
    // the decoder cannot have back.
    if (document.hidden) streamFlush();
    // A frozen background tab receives nothing, and that is not the stream
    // stalling: its deadline starts again from the tab coming back.
    else vidLastAu = performance.now();
    if (!document.hidden && !vidSock) openVideo();
  }
  if (document.hidden) return;
  // The browser drops a wake lock with the tab; take it again with the tab.
  if (video) holdAwake(true);
  refocus();
  hurry();
});
window.addEventListener("online", hurry);

// The rung is the single source of both numbers, whether a person picked it or
// the controller did, so there is one path to apply and one place to read.
//
// setQuality rather than the two setters: each of qualityLevel and
// compressionLevel sends a full SetEncodings on its own, and every rung change
// moves both - so this used to send the ~25-entry list twice back to back, and a
// Tight server may discard its per-client encoder state on each one. Two fresh
// full regions, at exactly the moment the controller decided the link was
// struggling: a visible hitch caused by the attempt to avoid one.
function applyQuality() {
  if (!rfb) return;
  const q = video ? VIDEO : RUNGS[rung];
  rfb.setQuality(q.quality, q.compression);
}

// Which rung a dropdown entry pins. Several rungs share a quality pair, so this
// used to scan the table for the highest match - picking Sharp being a request
// for the best picture rather than the slowest version of it. The table names
// its own presets now, so the answer is read rather than reconstructed.
function rungForPreset(value) {
  const i = RUNGS.findIndex((r) => r.preset === value);
  return i < 0 ? rung : i;
}

// Fit scales the desktop into the window. Off renders 1:1 and lets noVNC's own
// screen div scroll, so ordinary scrollbars pan - which beats drag-panning, where
// a drag to pan is a drag you did not mean to send to the remote machine.
function applyFit() {
  if (!rfb) return;
  rfb.scaleViewport = $("fit").classList.contains("on");
  rfb.clipViewport = false;
  rfb.dragViewport = false;
}

// Picking a quality by hand pins a rung - both numbers and the rate - and the
// controller stops proposing while it is pinned. Streaming stays on at that
// rung's rate: turning it off here would make the picture choppier at the moment
// somebody asked for a better one, and the escape hatch for a host without the
// lever is pushStream's own fallback, not this control. Back on Auto, the ladder
// carries on from wherever the manual choice left it rather than jumping.
$("quality").addEventListener("change", () => {
  const picked = $("quality").value;
  if (picked === "auto") { upHold = downHold = 0; }
  else setRung(rungForPreset(picked));
  applyQuality();
  refocus();
});

// DECODER+'s own knobs. Each is a new ask, so the encoder restarts on it with a
// fresh keyframe, as for the Video toggle. Kept per browser.
for (const id of ["vidMbps", "vidSize", "vidCq"]) {
  try { const v = localStorage.getItem("cast." + id); if (v && $(id).querySelector('option[value="' + v + '"]')) $(id).value = v; } catch (_) {}
  $(id).addEventListener("change", () => {
    try { localStorage.setItem("cast." + id, $(id).value); } catch (_) {}
    if (rfb && decoder) openVideo();
    refocus();
  });
}

// Switching monitors is a host-side change, so it goes to the bridge's control
// endpoint. The session key already in the endpoint URL is what authorises it.
$("share").addEventListener("change", async () => {
  if (!endpoint) return;
  const ctl = ctlUrl("share=" + encodeURIComponent($("share").value));
  state("wait", "Switching screen…");
  try {
    const r = await fetch(ctl, { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
  } catch (_) {
    state("bad", "Could not switch screen");
    refocus();
    return;
  }
  // The shared area is now a different size. Rather than hope the desktop-resize
  // path is handled everywhere, take the reliable route: the password is already
  // cached, so reconnecting costs a second and always lands in a correct state.
  manualStop = true;
  if (rfb) { try { rfb.disconnect(); } catch (_) {} rfb = null; }
  setTimeout(start, 250);
});

$("fit").addEventListener("click", () => {
  $("fit").classList.toggle("on");
  applyFit();
  refocus();
});

/* ----------------------------------------------------------------- mic -- */

// The host's microphone, over /audio beside the VNC+ socket: 20ms chunks of
// s16le mono, each scheduled straight onto an AudioContext. Off on every load
// and only ever started by a click - a live microphone must not come on by
// itself - and it shares nothing with DECODER+.
//
// The jitter buffer is how far ahead of the speaker the next chunk is placed:
// MIC_LEAD after a gap, and a chunk that would land more than MIC_MAX ahead is
// dropped instead, so a tunnel stall or a host clock running fast costs a click
// of lost audio rather than latency that never comes back.
const MIC_LEAD = 0.06;
const MIC_MAX = 0.15;
let mic = null;             // { ws, ctx, at, rate, opened, live } while on

function micShow(text, on, wait) {
  const b = $("mic");
  b.textContent = text;
  b.classList.toggle("on", on);
  b.classList.toggle("wait", wait);
}

function micOff(text) {
  const m = mic;
  mic = null;
  if (m) {
    m.ws.onmessage = m.ws.onclose = null;
    try { m.ws.close(); } catch (_) {}
    m.ctx.close().catch(() => {});
  }
  micShow(text || "Mic", false, false);
}

function micOn() {
  if (!rfb || !endpoint) return;
  // Made and resumed inside the click, which is what lets it make a sound.
  const ctx = new AudioContext({ latencyHint: "interactive" });
  ctx.resume().catch(() => {});
  const ws = new WebSocket(endpoint.replace("/ws?", "/audio?"));
  ws.binaryType = "arraybuffer";
  const m = mic = { ws, ctx, at: 0, rate: 16000, opened: false, live: false };
  micShow("Mic: connecting", true, true);
  ws.onopen = () => { m.opened = true; };
  ws.onmessage = (e) => {
    if (mic !== m) return;
    if (typeof e.data === "string") {
      try { m.rate = JSON.parse(e.data).rate || m.rate; } catch (_) {}
      return;
    }
    const now = ctx.currentTime;
    if (m.at < now) m.at = now + MIC_LEAD;
    else if (m.at - now > MIC_MAX) return;
    const s = new Int16Array(e.data);
    const buf = ctx.createBuffer(1, s.length, m.rate);
    const f = buf.getChannelData(0);
    for (let i = 0; i < s.length; i++) f[i] = s[i] / 32768;
    const src = ctx.createBufferSource();
    src.buffer = buf;
    src.connect(ctx.destination);
    src.start(m.at);
    m.at += buf.duration;
    if (!m.live) { m.live = true; micShow("Mic: live", true, false); }
  };
  // "no mic" is the host saying the device is not there; a socket that never
  // opened is a host with no /audio at all (CAST_MIC=off, no ffmpeg, older).
  ws.onclose = (e) => {
    if (mic !== m) return;
    micOff(e.reason === "no mic" || !m.opened ? "Mic: none on host" : "Mic: lost");
  };
}

$("mic").addEventListener("click", () => {
  if (mic) micOff(); else micOn();
  refocus();
});
addEventListener("pagehide", () => micOff());

/* ---------------------------------------------------------- video mode -- */

// Everything a person watching a video wants and a person driving a desktop
// does not: the video pair pinned, the toolbar out of the way, Fit on so the
// whole picture is in view, and the screen kept awake - a tab that only ever
// receives frames gives the OS no reason not to dim it. The quality dropdown is
// disabled rather than moved, so it still reads what it will go back to.
let wake = null;
let idleTimer = 0;

async function holdAwake(on) {
  if (!on) {
    if (wake) { wake.release().catch(() => {}); wake = null; }
    return;
  }
  if (wake || document.hidden || !navigator.wakeLock) return;
  try {
    wake = await navigator.wakeLock.request("screen");
    wake.addEventListener("release", () => { wake = null; });
  } catch (_) {}
}

function stir() {
  if (!video) return;
  document.body.classList.remove("idle");
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => {
    if ($("bar").matches(":hover") || !$("moreMenu").hidden) { stir(); return; }
    document.body.classList.add("idle");
  }, 2500);
}
document.addEventListener("mousemove", stir, { passive: true });
document.addEventListener("touchstart", stir, { passive: true });

$("video").addEventListener("click", () => {
  video = $("video").classList.toggle("on");
  document.body.classList.toggle("video", video);
  $("quality").disabled = video || !!decoder;
  if (video && !$("fit").classList.contains("on")) {
    $("fit").classList.add("on");
    applyFit();
  }
  applyQuality();
  // Off a pinned pair the rate is the ladder's again; on it, the axis opens up
  // to the top whatever rung the ladder was holding. Under Stream there is no
  // VNC rate to move, but the bitrate the encoder was asked for changes.
  if (rfb) { if (decoder) openVideo(); else setRate(ceilHz()); }
  holdAwake(video);
  if (video) stir();
  else { clearTimeout(idleTimer); document.body.classList.remove("idle"); }
  refocus();
});

/* -------------------------------------------------------------- stream -- */

// TightVNC ships the screen as compressed stills, and a game or a video changes
// every pixel every frame: the ladder tops out around twenty of those a second
// however good the link. The host has a hardware video encoder and this browser
// has a hardware decoder, so Stream takes the picture off RFB altogether: the
// bridge fans the encoder's output over a second socket, WebCodecs decodes it,
// and each frame is painted into the very canvas noVNC owns. That last part is
// what keeps everything else untouched - Fit, Fullscreen, Mouse lock and every
// coordinate the mouse sends are the canvas's, and RFB stays connected for
// input with its own frame requests switched off (rfb.pixels).
//
// Opt-in and remembered across reloads rather than the default, because text
// through an encoder tuned for latency is softer than Tight's lossless regions.
// Every failure path lands on the same fallback: the VNC pixels come back, the
// ladder resumes, and the state line says why.
const STREAM_KEY = "cast.stream";
const CODEC_KEY = "cast.codec";
const STREAM_TITLE = $("stream").title;
// How many frames the decoder may be behind before the page stops feeding it.
// This is the ceiling on how stale the picture can get, and so on input delay:
// eight frames at sixty is 133ms of already-decoded past sitting in a queue
// between the hand and the screen, on top of the 50ms the tunnel costs. Three
// caps it near 66ms. The trade is that a shallower tolerance reaches for the
// next keyframe more often, which is why GOP_SECONDS went back to one - the
// freeze that costs is bounded by the GOP, so the two numbers have to be chosen
// together. Made safe by the drained-queue gate below: the host's replay burst
// blows past any tolerance this small, and it no longer counts as strain.
const LAG_QUEUE = 3;
// And how long it has to stay there. decodeQueueSize counts chunks not yet
// handed to the decoder, not frames of past: a keyframe that takes a couple of
// hundred milliseconds to cross the tunnel holds up every delta behind it, and
// they land together, so the queue jumps past three behind every keyframe on a
// link it takes that long to carry - whatever the decoder is - and a hardware
// decoder clears it in a few milliseconds a chunk. Cutting on the count alone
// threw those frames away and froze the picture until the next keyframe,
// which is the same burst again. A queue that is still over the limit after
// this long is a decoder that is behind.
const LAG_MS = 150;            // a queue over LAG_QUEUE for this long is behind, not a burst
const STRAIN_DROPS = 2;        // lag drops within STRAIN_DROP_MS mean the decoder is behind
const STRAIN_DROP_MS = 10000;
const STRAIN_RATIO = 0.85;     // decoded under this share of what arrives, for STRAIN_SLOW_MS
const STRAIN_SLOW_MS = 2000;
const STRAIN_GRACE_MS = 1000;  // a fresh decoder's first second is the GOP replay, not strain
// No access unit at all for this long, on a tab that is being looked at, is a
// stream that has stopped - the encoder alive and the socket open, but nothing
// coming out. It is not a still screen: ddagrab sends a frame every period
// whether or not anything moved (see streamMissed). Longer than the host's
// skip-to-keyframe takes to drain a backlog, which is a gap and not a stop.
const STALL_MS = 5000;
// What to ask the host for, most demanding first. A viewer that keeps up with
// no codec at all does not have a codec problem: it has more frames and more
// bytes arriving than it or its link can carry. `mbps` is a share of what the
// Video toggle would have asked for.
const STREAM_STEPS = [{ fps: 60, mbps: 1 }, { fps: 30, mbps: 0.5 }, { fps: 20, mbps: 0.25 }];
const STEP_UP_MS = 30000;      // this long without strain and the pace is asked for back
const PROBATION_MS = 60000;    // strain this soon after a step up puts that step out of reach
const STRIKE_MS = 30000;       // a codec that ran this long before straining is not the problem
// How long a codec has to carry the picture cleanly before it is believed:
// before it is written to localStorage as the one to start on next time, and
// before the session spends an encoder restart asking whether a richer one
// would work here. One decoded picture is not evidence - isConfigSupported
// already said yes and was wrong.
const STREAM_PROVE_MS = 15000;

// --- how many rows to ask the host for ---
//
// video.mjs caps the picture it encodes at ?maxh= rows, and defaults to 720
// when the page sends nothing - which until now the page never did. So every
// viewer got 720 whatever its screen was: right for the Chromebook this cast
// is watched from, and an unasked-for downgrade for the same person sitting at
// a 1440p desktop. This is the page asking.
//
// Three rungs, because a rung is what an encoder restart is worth. They are
// the three sizes screens actually come in, and the step between any two of
// them is a third of the picture or more, which is visible; a difference
// inside one of them is not, and every change to the cap costs everyone on
// that encoder a restart and a fresh keyframe, since the host joins viewers on
// the cap as well as on the pace. 1440 is the top on purpose. The host clamps
// at 2160 and would encode it, but the ask is 8-12 mbps through a tunnel, and
// at that budget the bitrate is what limits the picture long before the rows
// are - 2160 rows of it would be a softer picture, not a sharper one.
const STREAM_HEIGHTS = [720, 1080, 1440];
// What a viewer asks for before it has decoded anything here, and the floor:
// below 720 the bytes saved are small and the text stops being readable.
//
// It is the start rather than the answer because a panel says what can be
// shown, not what can be decoded. The cap exists because a built-in decoder
// refused the host's native desktop outright - 1080p60 H.264 is level 4.2,
// several rungs above what many of them carry, as the comment at the configure
// site records - and a Chromebook with a 1080p panel asking for 1080 on the
// strength of its panel walks straight back into that refusal. So a taller
// picture is an upgrade that has to be earned on decoded frames, in exactly
// the way the richer codecs are earned above.
const STREAM_BASE_HEIGHT = 720;
const HEIGHT_KEY = "cast.maxh";
const HEIGHT_SLACK = 0.05;      // a running rung is kept until the screen falls this far short of it
const HEIGHT_SETTLE_MS = 1500;  // a window being dragged is one size change, not fifty

// --- the presentation clock ---
//
// The decoder's output callback used to paint the instant a frame came out of
// it, so the screen showed the arrival pattern of the tunnel rather than the
// timing of the host. Every millisecond of jitter through Cloudflare, every
// burst out of the encoder, and the 190 KB keyframe against the 1 KB delta all
// landed directly on the picture as uneven motion - the encoder can be putting
// out a perfect sixty and it will still judder. The 5-byte wire header has
// carried a millisecond host timestamp per access unit all along and nothing
// read it for timing; this reads it. Decoded frames wait in a short queue and
// go up on slots derived from the host's own clock, not from whenever the
// bytes happened to land.
//
// The delay that buys is the entire cost of it, so it is kept small and it
// moves. It starts at one frame period - the least a clock can hold and still
// be a clock - grows only on evidence the link needs more, and comes back down
// after a calm stretch. The cap is deliberately in the tens of milliseconds:
// this is a machine someone plays games through, and the commit before this
// one took a queue out from between the hand and the screen for that exact
// reason. A buffer that cures judder by adding a fifth of a second of lag has
// cured nothing.
const PACE_CAP_MS = 80;      // the most delay the clock will ever hold
const PACE_FLOOR_MS = 8;     // and the least, whatever the frame period says
const PACE_BAND_MS = 6;      // dead band: inside this the buffer does not move
const PACE_SHRINK_MS = 4;    // how much one step back down gives away
const PACE_CALM = 4;         // clean decisions in a row before it shrinks
const PACE_LATE = 2;         // late pictures in one decision that mean grow now
const PACE_WINDOW_MS = 2000; // how much arrival history the jitter estimate sees
const PACE_STEP_MS = 1000;   // how often the buffer is resized
const PACE_RESET_MS = 1000;  // an offset jump this big is a new encoder, not jitter
const PACE_QUEUE_MAX = 6;    // hard ceiling on held VideoFrames, whatever the clock says
let stream = false;      // the toggle, as the person left it
let hostVideo = true;    // false once /ctl said this host has no video route
let vidSock = null;
let decoder = null;      // a live VideoDecoder means Stream is carrying the picture
let vidReady = false;    // switch off VNC only after a decoded picture arrives
let vidWaitKey = true;   // deltas are useless without the key they build on
let vidOver = 0;         // when the decode queue went over LAG_QUEUE, 0 while it is not
let vidTimer = 0;        // the wait for a config message on a fresh socket
let vidFrames = 0;       // decoder outputs since the last tick
let vidHz = 0;           // the rate the encoder was configured for
let vidEncoder = "";     // which encoder the host ended up on, for the hover text
let vidCodec = "";       // and the codec string it is sending
let vidTried = false;    // one unasked retry per connect, no more
let vidDelivered = 0;    // AUs arriving since the last tick, decoded or not
let vidMissed = 0;       // AUs the host stamped and never sent us, since the last tick
let vidLastTs = -1;      // the host timestamp of the last AU to arrive, -1 before one
let vidLastAu = 0;       // when an AU last arrived at all
let vidShortSince = 0;   // when the link first lost more than it could spare
let vidDrops = [];       // when the lag control last fired, newest last
let vidSlowSince = 0;    // when decoded output first fell short of the arrivals
let vidSince = 0;        // when the current decoder was configured
let vidDrained = false;  // this decoder has emptied its queue at least once
let vidNote = "";        // what the state line says about the last downgrade
let vidStep = 0;         // how far down STREAM_STEPS this session has had to go
let vidCeil = 0;         // the most demanding step still worth trying this session
let vidCalm = 0;         // when the current step last saw strain, or started
let vidUp = 0;           // when the pace was last asked for back
let vidCodecSince = 0;   // when the current codec family started decoding here
let vidFamily = "";      // and which family that is, kept across reopens
let vidSoft = false;     // the hardware preference was refused here; stop asking for it
let vidPaint = [];       // decoded frames waiting for their slot on the screen
let vidClock = [];       // recent arrivals: when each landed, and how late the host said
let vidBase = 0;         // local milliseconds that host timestamp zero maps to
let vidDelay = 0;        // how far behind the host clock the paint runs, in ms
let vidRaf = 0;          // the paint loop's handle, 0 when it is not running
let vidLate = 0;         // pictures that went up after their slot, this decision
let vidDecided = 0;      // when the buffer was last resized
let vidSteady = 0;       // decisions in a row with nothing late
let vidPainted = 0;      // pictures actually put on the canvas since the last tick
let vidCtxEl = null;     // the canvas the context below belongs to
let vidCtx = null;       // and the context itself, looked up once instead of per frame
let vidSaved = false;    // this codec has been believed long enough to be remembered
let vidUpgraded = false; // one attempt per session at something better than the safe codec
let vidWant = "";        // a codec this session is asking for over the remembered one
let vidMaxh = 0;         // the picture cap being asked for, in rows; 0 before the first ask
let vidMaxhOk = 0;       // the tallest cap this machine has been shown to decode
let vidMaxhWant = 0;     // a taller cap this session is trying over the remembered one
let vidMaxhBad = 0;      // a cap refused here; nothing this tall is asked for again
let vidMaxhTimer = 0;    // the resize settle timer

// Which codecs this browser decodes, richest first: bytes are what the tunnel
// is short of, and AV1 buys the most picture per byte, then HEVC. The host
// takes the list as a preference and answers with whichever of them it can
// encode. These strings are probes, one plausible 1080p profile per codec; the
// host's own arrives in the config message. Nothing supported still asks for
// H.264, since a browser without WebCodecs H.264 has no Stream at all and the
// host will say so.
//
// Richest first is the order of value, not the order to ask in. The viewer
// this page is watched from is a Chromebook, and the comment on streamCodecs
// below records what happened there: isConfigSupported answered yes to AV1 and
// the machine then decoded it in software at half rate. Leading the ask with
// the codec most likely to be absent from the hardware decoder costs a failed
// rung and a visible fallback every single session, so the ask leads with
// STREAM_SAFE instead - H.264 is the one format a built-in decoder is least
// likely to be missing - and the richer codecs become an upgrade that has to
// prove itself on real decoded frames rather than a default that has to fail
// first.
const STREAM_CODECS = [["av1", "av01.0.08M.08"], ["hevc", "hvc1.1.6.L120.90"], ["h264", "avc1.64002a"]];
const STREAM_SAFE = "h264";
let vidSupported = null; // the probe's answers, one boolean per STREAM_CODECS entry
let vidCodecs = null;    // "av1,hevc,h264" once the probe below has answered
const vidBad = new Set(); // codecs downgraded away from this session; not retried until reload

// The probe says what decodes at all; it does not say what decodes fast.
// isConfigSupported answered yes to AV1 on a Chromebook that then decoded it
// in software at half rate, so the probe cannot be trusted to choose. What
// this returns, in order: whatever `first` names, if the probe still supports
// it and the session has not struck it - that is the codec remembered from a
// visit where it carried the picture cleanly for STREAM_PROVE_MS, or the one
// this session is deliberately trying as an upgrade. Failing that, the safe
// codec. Failing that - a browser with no H.264 at all, or a session that has
// struck it - whatever is left, richest first.
//
// The better codecs stay on the list behind the lead rather than being cut
// from it, because the host answers with the first entry it can encode: a host
// that cannot encode H.264 at all still gets to offer AV1 instead of failing.
function streamOrder(supported, bad = [], first = "") {
  const list = STREAM_CODECS.filter((c, i) => supported[i]).map((c) => c[0])
    .filter((c) => !bad.includes(c));
  const lead = list.includes(first) ? first
             : list.includes(STREAM_SAFE) ? STREAM_SAFE : "";
  return lead ? [lead].concat(list.filter((c) => c !== lead)) : list;
}

// The same list as a query-string value. Unlike streamOrder this has to name
// something whether or not anything is left, since the URL needs a value.
function streamCodecs(supported, bad = [], first = "") {
  const list = streamOrder(supported, bad, first);
  return list.length ? list.join(",") : STREAM_SAFE;
}

// The family a WebCodecs codec string belongs to, for the state line and the
// bad list: av01.* is AV1, hvc1/hev1 HEVC, avc1/avc3 H.264.
function streamFamily(codec) {
  if (/^av01/.test(codec)) return "av1";
  if (/^(hvc1|hev1)/.test(codec)) return "hevc";
  if (/^avc[13]/.test(codec)) return "h264";
  return "";
}

// Decoded output short of what arrives. Nothing arriving is nothing to fall
// short of.
function streamSlow(deliveredFps, decodedFps) {
  return deliveredFps > 0 && decodedFps < deliveredFps * STRAIN_RATIO;
}

// How many access units the host stamped between two that arrived, and never
// sent. ddagrab hands the encoder a frame every period whether or not the
// screen changed, and the host stamps AUs by counting them (stamp() in
// video.mjs), so arrivals sit one period apart even on a still desktop. A wider
// gap is frames lost on the way: the host skipping this viewer to the next
// keyframe because its socket fell a megabyte behind. The decoder never sees
// those, so decoded against delivered cannot, and a Chromebook that decodes
// everything it is given read as calm while the picture froze a GOP at a time.
function streamMissed(prevUs, us, hz) {
  if (!(prevUs >= 0) || !(hz > 0) || us <= prevUs) return 0;
  return Math.max(0, Math.round((us - prevUs) * hz / 1e6) - 1);
}

// Whether the decoder is not keeping up, and why, in the words the state line
// uses. `drops` are the times the lag control fired, `slowMs` how long output
// has been short. Either sign alone is enough: the lag control firing twice in
// ten seconds is a decoder that keeps falling a queue behind, and two seconds
// of low output is one that never catches up.
function streamStrain(drops, now, slowMs) {
  const recent = drops.filter((t) => now - t <= STRAIN_DROP_MS);
  if (recent.length >= STRAIN_DROPS) return "dropping frames";
  if (slowMs >= STRAIN_SLOW_MS) return "decoding too slowly";
  return "";
}

// The codec to fall to when `from` stops working: whatever the next ask would
// lead with once `from` is struck, so the state line and the URL agree. That
// is the safe codec while the session still has it, which is the point - a
// Chromebook that has just failed on AV1 is not helped by being handed HEVC,
// the other format its decoder is likely to be missing. Empty when there is
// nothing left, which is what tells streamDowngrade to pace instead.
function streamNext(supported, bad, from) {
  return streamOrder(supported, bad.concat([from]))[0] || "";
}

// The codec worth spending one encoder restart on as an upgrade: the richest
// the probe found that this session has not given up on, when that is not
// already the one running. Empty when the stream is on the best there is - or
// when the richer ones have been struck, which is how a machine that failed
// this once stops being asked again.
function streamBetter(supported, bad, current) {
  const best = STREAM_CODECS.filter((c, i) => supported[i]).map((c) => c[0])
    .filter((c) => !bad.includes(c))[0] || "";
  return best && best !== current ? best : "";
}

// The device rows the picture is actually painted into. The canvas is the one
// noVNC owns, so its CSS height is the size the picture is presented at
// whichever way Fit is set: scaled into the window with Fit on, and the
// framebuffer's own height at 1:1, where what is visible is a crop at native
// scale and every row of it is a real row. Multiplied by the device pixel
// ratio, because a ratio of 2 paints two device rows per CSS row and has
// somewhere genuine to put them. The screen is the fallback for a canvas that
// is not up yet; nothing at all answers 0, which asks for the base.
//
// Bounded by the framebuffer, which is the height the host actually has to
// give: ddagrab never enlarges, so rows asked for past it produce the same
// picture. They are not free, though. The host sizes the bitstream's declared
// level on the cap and not on the picture it produced (video.mjs, -level from
// capW/capH), and asking this 1920x1080 host for 1440 was measured here to
// return the identical 1920x1080 picture declared avc1.640033 - level 5.1 -
// where 1080 returns it as 640002a, level 4.2. Asking for rows the host does
// not have buys nothing and spends a level some decoder will refuse.
function streamRows(cssH, screenH, dpr, fbH) {
  const scale = dpr > 0 ? dpr : 1;
  const css = cssH > 0 ? cssH : screenH > 0 ? screenH : 0;
  const rows = css > 0 ? Math.round(css * scale) : 0;
  return fbH > 0 ? Math.min(rows, fbH) : rows;
}

// The cap to ask for: the largest rung this viewer can actually paint, never
// above what its decoder has been shown to take.
//
// The largest that fits, and not the smallest that covers, because what is
// being asked for is a fixed number of megabits and not a quality: rows the
// display will only throw away are bits taken off the rows it keeps, so a
// 768-row laptop handed 1080 rows gets a softer picture out of the same bytes
// than it would have got from 720. `current` is the rung already running, and
// it is sticky downward - a window nudged just inside a boundary keeps the
// rung it has, because the rows it loses are invisible and the restart every
// viewer on that encoder pays for is not. `allowed` is the decoder's earned
// ceiling and has the last word: it is the line that keeps a 1080p panel with
// a 720p decoder on 720.
function streamHeight(rows, allowed, current) {
  const top = STREAM_HEIGHTS[STREAM_HEIGHTS.length - 1];
  let want = STREAM_HEIGHTS.filter((h) => h <= rows).pop() || STREAM_BASE_HEIGHT;
  if (current && want < current && rows >= current * (1 - HEIGHT_SLACK)) want = current;
  return Math.min(want, Math.max(STREAM_BASE_HEIGHT, Math.min(top, allowed || 0)));
}

// The next cap worth one encoder restart: one rung above what is running,
// while the screen can use it and the session has not had it refused. One rung
// at a time and never past what the screen asks for, so a decoder that stops
// at 1080p60 proves 1080, is asked about 1440 exactly once, and is left there.
function streamTaller(rows, current, bad) {
  const want = streamHeight(rows, STREAM_HEIGHTS[STREAM_HEIGHTS.length - 1], 0);
  const next = STREAM_HEIGHTS.find((h) => h > (current || STREAM_BASE_HEIGHT)) || 0;
  return next && next <= want && (!bad || next < bad) ? next : 0;
}

// The remembered cap, which is a claim about this machine's decoder and not
// about its window: the tallest picture that carried here for STREAM_PROVE_MS,
// written on the same evidence the codec is written on and corrected back down
// when one is refused. Anything that is not one of the rungs - a hand-edited
// value, a key from some other page - is not believed.
function streamProven(saved) {
  const h = Math.round(Number(saved) || 0);
  return STREAM_HEIGHTS.includes(h) ? h : STREAM_BASE_HEIGHT;
}

// The list to ask the host for now, from the probe, the session's bad list
// and last visit's codec.
function chooseCodecs() {
  let last = "";
  try { last = localStorage.getItem(CODEC_KEY) || ""; } catch (_) {}
  vidCodecs = streamCodecs(vidSupported, Array.from(vidBad), vidWant || last);
}

// The rows this viewer paints right now, read off the canvas and the screen.
function vidRows() {
  const c = vidCanvas();
  return streamRows(c ? c.clientHeight : 0, (window.screen && screen.height) || 0,
                    window.devicePixelRatio || 1, c ? c.height : 0);
}

// The cap for the next ask. Read at every openVideo rather than watched, so a
// window that changed while the stream was down costs nothing to account for.
// The remembered value is read once and then lives in vidMaxhOk, which the
// proof below raises and a refusal lowers.
function chooseHeight() {
  if (!vidMaxhOk) {
    let saved = "";
    try { saved = localStorage.getItem(HEIGHT_KEY) || ""; } catch (_) {}
    vidMaxhOk = streamProven(saved);
  }
  vidMaxh = streamHeight(vidRows(), vidMaxhWant || vidMaxhOk, vidMaxh);
  // Size pinned by hand: ask for it whatever the window, as a trial, so a
  // decoder that refuses it goes back through streamShorter and is not asked
  // again this session.
  const pinned = Number($("vidSize").value);
  if (pinned && pinned !== vidMaxhBad) vidMaxh = vidMaxhWant = pinned;
}

// Asked once, at load: isConfigSupported is a promise, and openVideo is not.
const vidProbe = !("VideoDecoder" in window) ? Promise.resolve() :
  Promise.all(STREAM_CODECS.map(([, codec]) =>
    VideoDecoder.isConfigSupported({ codec, hardwareAcceleration: "prefer-hardware" })
      .then((r) => !!r.supported, () => false)))
    .then((s) => { vidSupported = s; chooseCodecs(); });

// The 5-byte header the bridge puts on every binary frame: flags (bit 0 is a
// keyframe), then a big-endian millisecond timestamp. WebCodecs wants
// microseconds. Anything shorter than a header plus one byte is not a frame.
function parseVideoFrame(buf) {
  if (!buf || buf.byteLength < 6) return null;
  const v = new DataView(buf);
  return { key: (v.getUint8(0) & 1) === 1, timestamp: v.getUint32(1) * 1000,
           data: new Uint8Array(buf, 5) };
}

// What the recent arrivals say about the link. `base` is the smallest offset
// seen between the host's timestamp and the local clock - the least-delayed
// path in the window, which is the natural zero for the presentation clock -
// and `jitter` is the spread around it, which is exactly the amount of arrival
// noise the buffer has to swallow.
function streamClock(clock) {
  let lo = Infinity, hi = -Infinity;
  for (const c of clock) { if (c.off < lo) lo = c.off; if (c.off > hi) hi = c.off; }
  return { base: lo === Infinity ? 0 : lo, jitter: clock.length < 2 ? 0 : hi - lo };
}

// A picture that went up more than a frame period after its slot came is one
// the buffer was too short to cover: it arrived after the clock already wanted
// it. That is the growth signal, and an empty paint slot deliberately is not -
// an empty slot is just as likely to be a frame the host never encoded, and no
// amount of buffer will conjure one of those.
function streamLate(at, now, frameMs) {
  return now - at > frameMs;
}

// Where the buffer should sit after this decision. Growing is the safe
// direction and happens at once, to the whole of what was measured; shrinking
// gives latency back and happens one small step at a time, and only after
// several clean decisions running. The asymmetry is the ladder's own, for the
// ladder's reason: a stalled picture is felt immediately and a premature
// shrink just stalls it again. Between the two thresholds is a dead band where
// nothing moves, so a link sitting near a boundary does not oscillate.
function streamDelay(delay, jitter, frameMs, late, calm) {
  // One frame period is the floor, except where a frame period is itself more
  // delay than the cap allows - a five-frame stream would otherwise be asked
  // to hold 200 ms. Latency is the harder constraint of the two, so the cap
  // wins; a delay under a frame period is a smaller jitter margin, not a
  // broken clock.
  const floor = Math.min(PACE_CAP_MS, Math.max(PACE_FLOOR_MS, frameMs));
  const fit = (ms) => Math.min(PACE_CAP_MS, Math.max(floor, ms));
  const want = fit(jitter + frameMs);
  if (late >= PACE_LATE) return fit(Math.max(want, delay + frameMs / 2));
  if (want > delay + PACE_BAND_MS) return want;
  if (calm >= PACE_CALM && want < delay - PACE_BAND_MS) return fit(delay - PACE_SHRINK_MS);
  return fit(delay);
}

// Whether to hand a chunk to the decoder, and whether to wait for a key after
// it. A delta after a skipped frame is garbage - it references pixels this
// decoder never saw - so once anything is dropped nothing goes in until the next
// key. The drop itself is the lag control: a decoder holding more than
// LAG_QUEUE chunks for LAG_MS running is behind, and feeding it more only makes
// the picture later. `overMs` is how long the queue has been over the limit; a
// burst that the decoder is already clearing has barely been over at all. A
// keyframe is always decoded; it is the recovery point.
function streamGate(waitKey, key, queued, overMs = 0) {
  if (key) return { decode: true, waitKey: false };
  if (waitKey || (queued > LAG_QUEUE && overMs >= LAG_MS)) return { decode: false, waitKey: true };
  return { decode: true, waitKey: false };
}

// How far the encoded picture's shape may sit from the framebuffer's before
// the two are called different rectangles. The host's cap scales with the
// aspect ratio kept and truncates each side to even, so the worst honest error
// is one pixel on the short side - under half a percent at the smallest
// picture the host will send. Two per cent leaves room for that and for an
// encoder that rounds its own crop, and is nowhere near what a second monitor
// costs: two 16:9 screens side by side make a 32:9 framebuffer, which is off
// by a factor of two.
const RECT_SKEW = 0.02;        // picture shape against framebuffer shape

// Is the picture the host is sending the same rectangle the framebuffer is?
//
// This is the one thing that has to be true for Stream to be usable, and it is
// not the same question as whether it is the same size. Every mouse coordinate
// this page sends is measured against the canvas, and the canvas is the VNC
// framebuffer; the decoded picture is drawn across the whole of that canvas.
// So a picture of a smaller rectangle - one monitor where the framebuffer
// spans two - arrives stretched over the whole framebuffer. That is the zoom,
// and it is also every click landing somewhere the user did not aim, which is
// the half of it that is not visible.
//
// Being scaled is not the problem and must not trip this: the host's cap
// shrinks the picture but keeps its shape, so 1280x720 of a 2560x1440
// framebuffer is the same rectangle and draws correctly across it. Only the
// shape is compared, for that reason.
//
// What the comparison catches is a framebuffer that spans monitors against a
// picture of one of them, which is never the same shape unless the monitors
// were arranged into one by accident. What it cannot catch is the host
// capturing the wrong one of two identically shaped monitors - the shapes
// agree and the picture is wrong; see captureIndex in video.mjs, which is
// where that assumption lives. Width and height are optional on the wire, from
// a host that predates them or a sequence header this host could not read, and
// with nothing to compare the picture is trusted exactly as it was before this
// check existed.
function streamRectOk(w, h, fbW, fbH) {
  if (!(w > 0 && h > 0 && fbW > 0 && fbH > 0)) return true;
  return Math.abs((w / h) / (fbW / fbH) - 1) <= RECT_SKEW;
}

// One short line for the state text, whatever went wrong. The bridge closes
// with 1011 and a reason when the encoder is the problem, and 1006 with nothing
// when the socket simply never got there - a host predating the route, a tunnel
// that only forwards /ws, the link going away.
function streamReason(why, code, reason) {
  switch (why) {
    case "nodecoder": return "this browser cannot decode video";
    case "host": return "this host has no video route";
    case "shape": return "DECODER+ carries one screen - pick Main or Second screen";
    case "timeout": return "the host sent no video";
    case "decode": return "decoder error" + (reason ? " (" + reason + ")" : "");
    case "close":
      if (code === 1011) return reason || "the encoder failed";
      if (code === 1006) return "the video link dropped";
      return "closed" + (code ? " (" + code + (reason ? ": " + reason : "") + ")" : "");
  }
  return "unknown";
}

function canStream() {
  return "VideoDecoder" in window && hostVideo;
}

function reflectStream() {
  const b = $("stream");
  const why = !("VideoDecoder" in window)
    ? "This browser has no WebCodecs video decoder, so DECODER+ cannot run here."
    : !hostVideo ? "This host has no video route. Update the host script to get one."
    : "";
  b.disabled = !!why;
  b.title = why || STREAM_TITLE;
  b.classList.toggle("on", stream && !why);
}

function vidCanvas() {
  return rfb ? (rfb.canvas || screenEl.querySelector("canvas")) : null;
}

// The context to paint into, found once per canvas rather than once per frame.
//
// It stays a 2D context, and not for want of looking at the alternatives. This
// is noVNC's own canvas - the one VNC paints when Stream is off or has fallen
// over, and the one whose width and height every mouse coordinate on this page
// is measured against. noVNC binds a 2D context to it at novnc.js:13825, and a
// canvas gives out one context kind for its whole life: asking the same
// element for "bitmaprenderer" afterwards returns null, so an
// ImageBitmapRenderingContext here would mean a second canvas stacked over the
// first, with its own size to keep in step with the framebuffer, for the sake
// of a transferFromImageBitmap that would still need a createImageBitmap off
// the VideoFrame to feed it. WebGL costs the same second canvas and a shader
// besides. Neither is worth breaking the one invariant - canvas size is the
// input mapping - to find out. The cheap win that was actually available is
// here: getContext was being called on every decoded frame.
function vidPaintCtx() {
  const c = vidCanvas();
  if (!c) { vidCtxEl = vidCtx = null; return null; }
  if (c !== vidCtxEl) { vidCtxEl = c; vidCtx = c.getContext("2d"); }
  return vidCtx;
}

// A VideoFrame holds a buffer out of a pool the decoder cannot refill while it
// is held, so letting one go is not housekeeping: a frame leaked here is a
// decoder that stops producing pictures. Every frame this page touches goes
// through one of these two, exactly once.
function streamDrop(frame) {
  try { frame.close(); } catch (_) {}
}

// Let go of everything being held, on any path that ends the stream the queue
// belongs to: a downgrade, a socket close, the toggle going off, the tab
// hiding, a new encoder whose timestamps mean nothing to the old slots.
function streamFlush() {
  for (const q of vidPaint) streamDrop(q.frame);
  vidPaint = [];
}

// Take a decoded frame into the queue and fold its arrival into the clock.
function streamHold(frame, now) {
  const ms = (frame.timestamp || 0) / 1000;
  const off = now - ms;
  // An offset that moved by a second is not jitter, it is a different clock:
  // every step down the ladder and every codec switch restarts ffmpeg, and its
  // timestamps start again from zero. The frames already queued were slotted
  // against the old one and are worthless.
  if (!vidClock.length || Math.abs(off - vidBase) > PACE_RESET_MS) {
    streamFlush();
    vidClock = [];
    vidBase = off;
  }
  // A frame that came out earlier than the clock's zero allows proves the zero
  // too late, and by more than a frame the slew below would take seconds to
  // walk back. The first picture out of a fresh decoder is exactly that: it
  // carries the decoder's start-up, anchors the clock, and every frame after
  // it is slotted that far out - while the queue cap sheds them from the front
  // before any slot comes, so nothing is painted at all. Jumping forward only
  // makes queued frames due sooner, and the paint loop shows the newest.
  // The arrivals behind it were measured against that stale zero and go too:
  // the join replay is up to a second of frames decoded at once, each later
  // against its timestamp than the next, and left in the window its spread
  // read as that much jitter - the buffer went to the cap on every encoder
  // restart and took a quarter of a minute to come back down.
  else if (vidBase - off > (vidHz ? 1000 / vidHz : 1000 / 60)) { vidBase = off; vidClock = []; }
  vidClock.push({ t: now, off });
  while (vidClock.length && now - vidClock[0].t > PACE_WINDOW_MS) vidClock.shift();
  vidPaint.push({ frame, ms });
  // Whatever the clock believes, the frames held are a resource the decoder
  // needs back. Past the cap the oldest goes - it is the one whose slot has
  // most nearly passed anyway - so the held count has a hard ceiling that no
  // arithmetic above can raise.
  while (vidPaint.length > PACE_QUEUE_MAX) streamDrop(vidPaint.shift().frame);
}

// The paint loop. requestAnimationFrame rather than a timer, deliberately: the
// point of the exercise is even spacing on screen, and the screen only changes
// at a vsync. A setInterval at 60 Hz lands at a phase unrelated to the
// compositor, so the frame it writes is picked up one refresh later or not at
// all, which puts back exactly the beat this code exists to remove - and it
// keeps running at full rate in a background tab, burning a GPU on a picture
// nobody is looking at. rAF is throttled to a crawl in a hidden tab, which is
// the correct behaviour here and is why the output callback below refuses to
// queue anything while document.hidden: the frames are closed as they arrive
// and the queue stays empty, so a tab coming back does not paint a second of
// history at once. The existing hidden-tab handling is unchanged otherwise -
// the socket stays open and the gate drops to the next keyframe.
function streamPaint() {
  vidRaf = 0;
  if (!decoder) { streamFlush(); return; }
  const now = performance.now();
  const frameMs = vidHz ? 1000 / vidHz : 1000 / 60;
  // Everything whose slot has come. The newest of them is the picture; any
  // behind it are frames this display had no slot for, and they are closed
  // rather than drawn. Because the slot comes from the host's timestamp and
  // not from arrival, two frames landing in the same millisecond still get
  // slots a frame period apart and go up one per refresh - which is the whole
  // mechanism.
  let show = null;
  while (vidPaint.length && vidPaint[0].ms + vidBase + vidDelay <= now) {
    if (show) streamDrop(show.frame);
    show = vidPaint.shift();
  }
  if (show) {
    const ctx = vidPaintCtx();
    try {
      if (ctx) {
        ctx.drawImage(show.frame, 0, 0, vidCtxEl.width, vidCtxEl.height);
        vidPainted++;
      }
    } finally { streamDrop(show.frame); }
    if (streamLate(show.ms + vidBase + vidDelay, now, frameMs)) vidLate++;
  }
  // Resize the buffer once a second, on the clock the frames themselves set.
  if (now - vidDecided >= PACE_STEP_MS) {
    const k = streamClock(vidClock);
    // The zero of the clock is slewed, not jumped: a base that moved in one go
    // would drag every queued slot with it and show as a lurch. One frame
    // period a second is four orders of magnitude more than crystal drift
    // between two machines needs and still invisible.
    if (vidClock.length) vidBase += Math.max(-frameMs, Math.min(frameMs, k.base - vidBase));
    vidDelay = streamDelay(vidDelay, k.jitter, frameMs, vidLate, vidSteady);
    vidSteady = vidLate ? 0 : vidSteady + 1;
    vidLate = 0;
    vidDecided = now;
  }
  vidRaf = requestAnimationFrame(streamPaint);
}

// A window that changed size wants a different picture - but not on every
// event a drag emits, and not for a change too small to see. The cap is part
// of what the host joins two viewers on, so every change to it restarts the
// encoder and costs everyone on it a keyframe. One ask, HEIGHT_SETTLE_MS after
// the last resize, and only when the rung itself moved; the slack in
// streamHeight is what keeps a boundary from counting as a move.
window.addEventListener("resize", () => {
  clearTimeout(vidMaxhTimer);
  if (!vidSock || !vidReady) return;
  vidMaxhTimer = setTimeout(() => {
    if (!vidSock || !vidReady) return;
    const was = vidMaxh;
    chooseHeight();
    if (vidMaxh === was) return;
    state("live", "DECODER+: " + vidMaxh + "p for this window");
    openVideo();
  }, HEIGHT_SETTLE_MS);
});

function openVideo() {
  closeVideo();
  if (!stream || !rfb || !endpoint || document.hidden) return;
  // Not before the session is up, whoever asks: the streamOff retry, a tab
  // coming back and the codec probe answering can all land between connect()
  // and the RFB connect event, and the connect handler opens one of its own a
  // moment later - two sockets, two encoder joins and two GOP replays for one
  // picture, with the first decoder painting a canvas that has no size yet.
  if (rfb._rfbConnectionState !== "connected") return;
  if (rfb.pixels === false) { rfb.pixels = true; setRate(ceilHz()); }
  if (!canStream()) { streamOff("VideoDecoder" in window ? "host" : "nodecoder"); return; }
  // The codec probe is still out only in the first moments after load; come
  // back when it has answered, if Stream is still wanted and nothing else got
  // here first.
  if (vidCodecs === null) { vidProbe.then(() => { if (stream && !vidSock) openVideo(); }); return; }
  // Video mode is a picture that is all motion, so it gets the bytes. The
  // display is the share dropdown's own vocabulary; the bridge whitelists it
  // and the codec list too.
  const step = STREAM_STEPS[vidStep];
  // The picture cap goes with them. A host too old to know the parameter reads
  // fps, mbps, display and codecs by name and never looks for maxh, so it
  // ignores it and streams exactly as it does today - there is no version of
  // this that an old host can fail on.
  chooseHeight();
  // The Bitrate and Text dropdowns, when set, replace the ask; the strain
  // ladder still takes its share off a picked bitrate. A host too old for cq
  // ignores it, as with maxh.
  const picked = Number($("vidMbps").value) || (video ? 12 : 8);
  const url = endpoint.replace("/ws?", "/video?") + "&fps=" + step.fps +
              "&mbps=" + Math.round(picked * step.mbps * 10) / 10 +
              "&maxh=" + vidMaxh + "&cq=" + $("vidCq").value +
              "&display=" + encodeURIComponent($("share").value) + "&codecs=" + vidCodecs;
  let sock;
  try {
    sock = new WebSocket(url);
  } catch (e) {
    streamOff("decode", 0, String(e.message || e));
    return;
  }
  sock.binaryType = "arraybuffer";
  vidSock = sock;
  // The same guard as the RFB handlers: a socket this page closed still has a
  // close event to deliver, and it must not tear down its replacement.
  const mine = () => vidSock === sock;
  vidTimer = setTimeout(() => { if (mine()) streamOff("timeout"); }, 5000);

  sock.addEventListener("message", (e) => {
    if (!mine()) return;
    if (typeof e.data === "string") {
      let cfg = null;
      try { cfg = JSON.parse(e.data); } catch (_) {}
      if (cfg && cfg.type === "config") configureVideo(cfg);
      return;
    }
    // The link readout is bytes arriving, whichever socket carries them.
    stats.window += e.data.byteLength || 0;
    if (!decoder || decoder.state !== "configured") return;
    const f = parseVideoFrame(e.data);
    if (!f) return;
    vidDelivered++;
    vidMissed += streamMissed(vidLastTs, f.timestamp, vidHz);
    vidLastTs = f.timestamp;
    vidLastAu = performance.now();
    const q = decoder.decodeQueueSize, at = performance.now();
    if (q <= LAG_QUEUE) vidOver = 0;
    else if (!vidOver) vidOver = at;
    const g = streamGate(vidWaitKey, f.key, q, vidOver ? at - vidOver : 0);
    // The gate closing on an open stream is the lag control firing. Nothing
    // before the first picture counts, and neither does the cached GOP the
    // host replays on join: up to a second of frames arrive at once, which
    // puts the queue past LAG_QUEUE whatever the decoder is, and draining that
    // many takes a second of decoding by definition - so a flat second of
    // grace expired in the middle of it and called the backlog strain. Since
    // every step down restarts the encoder and so replays a fresh cache, that
    // counted as a rung failing and cost the next rung too, all the way down.
    // The queue coming back to empty is the honest signal, and a decoder that
    // never gets there is caught by the slow check in the tick instead.
    // A hidden tab's drops are the browser throttling it, not the link or the
    // decoder straining, and must not step the stream down for when it returns.
    // Emptying the queue once is what proves the burst above is behind us.
    // Not before the first picture: the replay's own first chunk lands on an
    // empty queue, so asked then this was true before the burst began and
    // shielded nothing - every lag drop after the one-second grace counted.
    if (!vidDrained && vidReady && decoder.decodeQueueSize <= 1) vidDrained = true;
    if (g.waitKey && !vidWaitKey && vidReady && !document.hidden && vidDrained &&
        performance.now() - vidSince > STRAIN_GRACE_MS) {
      const now = performance.now();
      vidDrops = vidDrops.filter((t) => now - t <= STRAIN_DROP_MS).concat(now);
      vidCalm = now;
      const why = streamStrain(vidDrops, now, 0);
      if (why) { streamDowngrade(why); return; }
    }
    vidWaitKey = g.waitKey;
    if (!g.decode) return;
    try {
      decoder.decode(new EncodedVideoChunk({ type: f.key ? "key" : "delta",
                                             timestamp: f.timestamp, data: f.data }));
    } catch (err) {
      streamOff("decode", 0, String(err.message || err));
    }
  });
  sock.addEventListener("close", (e) => {
    if (mine()) streamOff("close", e.code, e.reason);
  });
}

// What the decoder is asked for. Hardware is worth preferring: it is the
// difference between a laptop fan and a quiet one, and on a weak machine
// between a picture and a slideshow. It is only a preference until a browser
// treats it as a requirement, which is what vidSoft records.
function videoConfig(codec) {
  return { codec, optimizeForLatency: true,
           hardwareAcceleration: vidSoft ? "no-preference" : "prefer-hardware" };
}

// A config message is the encoder starting - or restarting with new settings,
// which is why the decoder is built fresh each time rather than reconfigured
// mid-stream. VNC keeps the picture moving until the first decoded frame.
function configureVideo(cfg) {
  // Ahead of every other thing this function does, because if the host's
  // picture is not the rectangle the canvas describes then there is no
  // decoder worth building: drawing it would zoom the picture and move every
  // click off its target. VNC already has the screen and keeps it.
  const fb = vidCanvas();
  if (fb && !streamRectOk(cfg.width, cfg.height, fb.width, fb.height)) {
    streamOff("shape");
    return;
  }
  clearTimeout(vidTimer);
  if (decoder) { try { decoder.close(); } catch (_) {} decoder = null; }
  // Whatever is queued belongs to the decoder just closed, and was slotted
  // against an encoder clock that is about to start again from zero.
  streamFlush();
  vidReady = false;
  // Strain is evidence about the stream being configured, and none of it
  // survives the configure. A drop recorded at sixty frames is not a fact
  // about thirty: the pace changed, the encoder restarted and the decoder is
  // new. Carrying the list over is what let one rough moment at the top walk
  // the ladder to the bottom in fifteen seconds, each step inheriting the
  // strikes of the step above it while the ten-second window still held them.
  vidDrops = [];
  vidSlowSince = 0;
  vidDrained = false;
  if (rfb.pixels === false) { rfb.pixels = true; setRate(ceilHz()); }
  // Config alone does not prove a decoder can produce pictures. Bound the
  // wait even when the socket remains open but no usable frames arrive.
  vidTimer = setTimeout(() => streamDowngrade("not producing frames"), 8000);
  const d = new VideoDecoder({
    output: (frame) => {
      // A frame from a decoder that has been replaced is stale pixels; it is
      // let go of and not counted.
      if (decoder !== d) { streamDrop(frame); return; }
      // Counted as decoded the moment it comes out, whatever becomes of it
      // afterwards. The strain rule downstream weighs decoded against
      // delivered, and it has to go on meaning "the decoder kept up" and not
      // "the screen showed it" - otherwise a presentation clock doing its job,
      // dropping a frame the display had no refresh for, would read as the
      // decoder failing and walk the quality ladder down for it.
      vidFrames++;
      if (!vidCanvas()) { streamDrop(frame); streamFlush(); return; }
      // The takeover happens before the hidden check below, because a tab
      // hidden in the seconds between the socket opening and the first frame
      // would otherwise never clear the first-picture timeout, and a decoder
      // that is working perfectly would be reported as producing nothing.
      if (!vidReady) {
        clearTimeout(vidTimer);
        vidReady = true;
        rfb.pixels = false;
        streamWant = 0;
        pushStream();
        $("quality").disabled = true;
        $("vidTune").hidden = false;
        state("live", "DECODER+" + (vidNote ? " " + streamFamily(vidCodec) + vidNote : ""));
      }
      // Nothing is held while the tab is hidden: rAF is throttled there, so a
      // queued frame would be a GPU buffer held for as long as the person
      // stays in another tab, and a tab coming back would paint a lump of
      // history all at once.
      if (document.hidden) { streamDrop(frame); streamFlush(); return; }
      // Into the queue rather than straight onto the canvas: the clock says
      // when, and the loop it starts is what says it.
      streamHold(frame, performance.now());
      if (!vidRaf) vidRaf = requestAnimationFrame(streamPaint);
    },
    // An error that arrives later says the same thing as a refused configure,
    // just after the fact, and gets the same walk down.
    error: (e) => { if (decoder === d) streamRefused(String(e.message || e)); },
  });
  // prefer-hardware is a preference everywhere except where it is not. A
  // Chromebook whose decoder cannot take 1080p60 refuses the configure
  // outright rather than quietly picking software.
  //
  // Which is a pace problem before it is a hardware one: 1080p60 in H.264
  // needs level 4.2, several rungs above what a lot of built-in decoders
  // carry, and the same decoder takes 1080p30 without complaint. So a refusal
  // walks down the ladder first, asking for hardware each time. Software is
  // the answer only at the bottom, because software 1080p60 on a machine like
  // that is a queue that never empties and every frame arriving late - worse
  // to use than the smaller picture it refused.
  try {
    d.configure(videoConfig(cfg.codec));
  } catch (e) {
    try { d.close(); } catch (_) {}
    vidCodec = cfg.codec || "";
    streamRefused(String(e.message || e));
    return;
  }
  decoder = d;
  // How long this codec has been decoding here, which the strike rule reads.
  // Steps down and back up reconfigure the same codec and must not reset it.
  // Against vidFamily, not vidCodec: every step reopens, and closeVideo has
  // emptied vidCodec by the time the new config lands, so a proven codec that
  // stepped down was timed from zero again and struck on its next strain.
  if (streamFamily(cfg.codec || "") !== vidFamily) {
    vidCodecSince = performance.now();
    vidSaved = false;
  }
  vidFamily = streamFamily(cfg.codec || "");
  vidWaitKey = true;
  vidOver = 0;
  vidHz = cfg.fps || 0;
  vidEncoder = cfg.encoder || "";
  vidCodec = cfg.codec || "";
  vidFrames = vidDelivered = vidPainted = vidMissed = 0;
  vidLastTs = -1;
  vidShortSince = 0;
  vidDrops = [];
  vidSlowSince = 0;
  vidSince = vidCalm = vidLastAu = performance.now();
  // A fresh encoder is a fresh clock: no offset history to average, and one
  // frame period of delay to start from, which is the least a presentation
  // clock can hold and still be one.
  vidClock = [];
  vidBase = 0;
  vidLate = 0;
  vidSteady = 0;
  vidDelay = Math.max(PACE_FLOOR_MS, vidHz ? 1000 / vidHz : 1000 / 60);
  vidDecided = performance.now();
}

// The codec is not keeping up here, or will not decode at all: strike it for
// the session and ask the host again with the rest of the list, so a
// Chromebook that decodes AV1 in software is on HEVC within seconds rather
// than the tens the retry-and-hope path took. The host restarts its encoder
// for the new list.
//
// With no codec left to fall to, a codec that decodes but cannot keep up is
// asked for fewer frames and fewer bytes rather than abandoned: the pace is
// what it cannot carry, not the format, and a browser that only decodes H.264
// used to lose Stream for the session on the first two dropped frames. A
// codec that errored outright - `detail` is the decoder's own words - is past
// being paced, and so are a codec with no name to it and the bottom step of
// the ladder. Those are the old failure.
function streamDowngrade(why, detail) {
  // A taller picture that decodes but cannot be kept up with is the size
  // failing, not the codec or the pace: the same stream carried cleanly one
  // rung down seconds ago. Blaming either walked a Chromebook down the codec
  // list or the ladder while it went on being sent the rows it choked on.
  if (!detail && streamShorter(why)) return;
  const from = streamFamily(vidCodec);
  // A codec that decoded this scene for half a minute and then fell behind is
  // not the wrong codec: the picture got harder. Subnautica underwater is the
  // case that made this rule - caustics and particles at sixty frames are more
  // decoding than a menu screen, and striking a codec per hard scene walked
  // through the whole list without ever addressing the pace. A decoder that
  // errored outright is still a codec verdict however long it ran.
  const settled = !detail && vidCodecSince && performance.now() - vidCodecSince > STRIKE_MS;
